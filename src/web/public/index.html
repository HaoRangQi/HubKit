<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>HubKit Dashboard</title>
  <link rel="stylesheet" href="/vendor/xterm-css/xterm.css">
  <script>
    (function applyInitialTheme() {
      const storageKey = 'hubkit-theme-mode';
      const root = document.documentElement;
      const savedMode = localStorage.getItem(storageKey);
      const themeMode = savedMode === 'light' || savedMode === 'dark' || savedMode === 'auto'
        ? savedMode
        : 'auto';
      const prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
      const resolvedTheme = themeMode === 'auto' ? (prefersDark ? 'dark' : 'light') : themeMode;
      root.dataset.themeMode = themeMode;
      root.dataset.themeResolved = resolvedTheme;
    })();
  </script>
  <style>
    :root {
      color-scheme: light;

      --md-source: #3f6758;
      --md-primary: #2f6b56;
      --md-on-primary: #ffffff;
      --md-primary-container: #b3f1d7;
      --md-on-primary-container: #002116;
      --md-secondary: #4d6358;
      --md-on-secondary: #ffffff;
      --md-secondary-container: #d0e8da;
      --md-on-secondary-container: #0a1f17;
      --md-tertiary: #3d6374;
      --md-on-tertiary: #ffffff;
      --md-tertiary-container: #c1e8fc;
      --md-on-tertiary-container: #001f2a;
      --md-error: #ba1a1a;
      --md-on-error: #ffffff;
      --md-error-container: #ffdad6;
      --md-on-error-container: #410002;
      --md-warning: #765a00;
      --md-warning-container: #ffdf8a;
      --md-on-warning-container: #251a00;
      --md-success: #246b45;
      --md-success-container: #a8f2c2;
      --md-on-success-container: #00210e;
      --md-background: #fbfdf8;
      --md-on-background: #191c1a;
      --md-surface: #fbfdf8;
      --md-surface-dim: #dbe5dd;
      --md-surface-bright: #fbfdf8;
      --md-surface-container-lowest: #ffffff;
      --md-surface-container-low: #f4f7f1;
      --md-surface-container: #eef1eb;
      --md-surface-container-high: #e8ebe5;
      --md-surface-container-highest: #e2e5df;
      --md-on-surface: #191c1a;
      --md-on-surface-variant: #414942;
      --md-outline: #717970;
      --md-outline-variant: #c1c9bf;
      --md-scrim: #000000;

      --font-sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      --font-mono: "SF Mono", "Roboto Mono", Consolas, monospace;
      --shape-xs: 4px;
      --shape-sm: 8px;
      --shape-md: 12px;
      --shape-lg: 16px;
      --shape-xl: 24px;
      --shape-pill: 999px;
      --elevation-1: 0 1px 2px rgb(0 0 0 / 0.14), 0 1px 3px 1px rgb(0 0 0 / 0.08);
      --elevation-2: 0 1px 2px rgb(0 0 0 / 0.3), 0 2px 6px 2px rgb(0 0 0 / 0.15);
      --elevation-3: 0 4px 8px 3px rgb(0 0 0 / 0.15), 0 1px 3px rgb(0 0 0 / 0.3);
      --motion-standard: 200ms cubic-bezier(0.2, 0, 0, 1);
      --motion-emphasized: 300ms cubic-bezier(0.2, 0, 0, 1);
      --glass-blur: 18px;
      --glass-surface-opacity: 0.72;
      --glass-border-opacity: 0.34;
      --card-surface-mix: 86%;
      --card-inner-mix: 72%;
      --wallpaper-opacity: 0.92;
      --wallpaper-scrim-opacity: 0;
      --wallpaper-scrim-color: #ffffff;
      --wallpaper-scale: 1;
    }

    :root[data-theme-resolved="dark"] {
      color-scheme: dark;
      --md-primary: #98d4bc;
      --md-on-primary: #003829;
      --md-primary-container: #13513f;
      --md-on-primary-container: #b3f1d7;
      --md-secondary: #b4ccbf;
      --md-on-secondary: #20352c;
      --md-secondary-container: #364b41;
      --md-on-secondary-container: #d0e8da;
      --md-tertiary: #a5ccdf;
      --md-on-tertiary: #073544;
      --md-tertiary-container: #244c5b;
      --md-on-tertiary-container: #c1e8fc;
      --md-error: #ffb4ab;
      --md-on-error: #690005;
      --md-error-container: #93000a;
      --md-on-error-container: #ffdad6;
      --md-warning: #e8c450;
      --md-warning-container: #5a4300;
      --md-on-warning-container: #ffdf8a;
      --md-success: #8ad7a7;
      --md-success-container: #07522e;
      --md-on-success-container: #a8f2c2;
      --md-background: #111411;
      --md-on-background: #e2e5df;
      --md-surface: #111411;
      --md-surface-dim: #111411;
      --md-surface-bright: #373a36;
      --md-surface-container-lowest: #0c0f0c;
      --md-surface-container-low: #191c1a;
      --md-surface-container: #1d201e;
      --md-surface-container-high: #272b28;
      --md-surface-container-highest: #323633;
      --md-on-surface: #e2e5df;
      --md-on-surface-variant: #c1c9bf;
      --md-outline: #8b9389;
      --md-outline-variant: #414942;
      --wallpaper-scrim-color: #000000;
    }

    * {
      box-sizing: border-box;
    }

    html {
      min-width: 320px;
      background: var(--md-background);
    }

    body {
      min-height: 100vh;
      margin: 0;
      background:
        linear-gradient(180deg, color-mix(in srgb, var(--md-primary-container) 28%, transparent) 0, transparent 340px),
        var(--md-background);
      color: var(--md-on-background);
      font-family: var(--font-sans);
      line-height: 1.5;
      letter-spacing: 0;
      -webkit-font-smoothing: antialiased;
    }

    body::after {
      content: "";
      position: fixed;
      inset: 0;
      z-index: 0;
      background: var(--wallpaper-scrim-color);
      opacity: var(--wallpaper-scrim-opacity, 0);
      pointer-events: none;
    }

    .wallpaper-layer {
      position: fixed;
      inset: -6%;
      z-index: 0;
      display: none;
      background-repeat: no-repeat;
      background-position: center;
      background-size: cover;
      opacity: var(--wallpaper-opacity, 0.92);
      filter: blur(var(--wallpaper-blur, 0px));
      transform: scale(var(--wallpaper-scale, 1));
      pointer-events: none;
    }

    .glass-panel {
      backdrop-filter: blur(var(--glass-blur));
      -webkit-backdrop-filter: blur(var(--glass-blur));
      box-shadow: var(--elevation-1);
    }

    button,
    input,
    select {
      font: inherit;
    }

    button {
      -webkit-tap-highlight-color: transparent;
    }

    .icon {
      display: inline-block;
      width: 20px;
      height: 20px;
      flex-shrink: 0;
      color: currentColor;
      fill: currentColor;
      vertical-align: -4px;
    }

    .shell {
      width: 100%;
      margin: 0;
      padding: 20px 32px 32px 188px;
      position: relative;
      z-index: 1;
    }

    .top-app-bar {
      position: sticky;
      top: 0;
      z-index: 30;
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      gap: 16px;
      align-items: center;
      min-height: 76px;
      margin: -20px -32px 18px -188px;
      padding: 16px 32px 16px 188px;
      background: color-mix(in srgb, var(--md-surface) calc(var(--glass-surface-opacity) * 100%), transparent);
      border-bottom: 1px solid color-mix(in srgb, var(--md-outline-variant) calc(var(--glass-border-opacity) * 100%), transparent);
      backdrop-filter: blur(calc(var(--glass-blur) + 2px));
      -webkit-backdrop-filter: blur(calc(var(--glass-blur) + 2px));
    }

    .brand {
      display: flex;
      min-width: 0;
      align-items: center;
      gap: 14px;
    }

    .brand-mark {
      display: grid;
      width: 44px;
      height: 44px;
      flex: 0 0 auto;
      place-items: center;
      border-radius: var(--shape-lg);
      background: var(--md-primary-container);
      color: var(--md-on-primary-container);
      box-shadow: var(--elevation-1);
    }

    .brand-copy {
      min-width: 0;
    }

    h1 {
      margin: 0;
      color: var(--md-on-surface);
      font-size: 28px;
      font-weight: 500;
      line-height: 1.15;
      letter-spacing: 0;
    }

    .subtitle {
      margin: 2px 0 0;
      color: var(--md-on-surface-variant);
      font-size: 14px;
      line-height: 1.4;
    }

    .bar-actions {
      display: flex;
      align-items: center;
      justify-content: flex-end;
      gap: 12px;
    }

    .theme-switcher {
      display: grid;
      gap: 0;
      justify-items: end;
      min-width: 0;
    }

    .theme-tabs {
      display: inline-grid;
      grid-auto-flow: column;
      gap: 0;
      height: 44px;
      padding: 2px;
      border: 1px solid var(--md-outline-variant);
      border-radius: var(--shape-pill);
      background: var(--md-surface-container-low);
      overflow: hidden;
    }

    .theme-btn {
      display: inline-flex;
      min-width: 72px;
      min-height: 40px;
      align-items: center;
      justify-content: center;
      gap: 7px;
      padding: 0 12px;
      border: 0;
      border-radius: var(--shape-pill);
      background: transparent;
      color: var(--md-on-surface-variant);
      cursor: pointer;
      font-size: 13px;
      font-weight: 500;
      transition: background var(--motion-standard), color var(--motion-standard), box-shadow var(--motion-standard);
      white-space: nowrap;
    }

    .theme-btn:hover {
      background: color-mix(in srgb, var(--md-on-surface) 8%, transparent);
      color: var(--md-on-surface);
    }

    .theme-btn.active {
      background: var(--md-primary-container);
      color: var(--md-on-primary-container);
      box-shadow: var(--elevation-1);
    }

    .connection-chip {
      display: inline-flex;
      height: 44px;
      align-items: center;
      gap: 8px;
      padding: 0 16px;
      border: 1px solid var(--md-outline-variant);
      border-radius: var(--shape-pill);
      background: var(--md-surface-container-low);
      color: var(--md-on-surface-variant);
      font-size: 14px;
      font-weight: 500;
      white-space: nowrap;
    }

    .connection-chip.connected {
      background: var(--md-success-container);
      color: var(--md-on-success-container);
      border-color: transparent;
    }

    .connection-chip.disconnected {
      background: var(--md-error-container);
      color: var(--md-on-error-container);
      border-color: transparent;
    }

    .status-indicator {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: currentColor;
    }

    .connection-chip.connected .status-indicator {
      animation: pulse 1600ms cubic-bezier(0.2, 0, 0, 1) infinite;
    }

    .view-tabs {
      display: inline-grid;
      grid-auto-flow: column;
      gap: 0;
      height: 44px;
      padding: 2px;
      border: 1px solid var(--md-outline);
      border-radius: var(--shape-pill);
      background: color-mix(in srgb, var(--md-surface-container) 65%, transparent);
      overflow: hidden;
    }

    .nav-btn {
      display: inline-flex;
      min-width: 108px;
      min-height: 40px;
      align-items: center;
      justify-content: center;
      gap: 8px;
      padding: 0 16px;
      border: 0;
      border-radius: var(--shape-pill);
      background: transparent;
      color: var(--md-on-surface);
      cursor: pointer;
      font-size: 14px;
      font-weight: 500;
      transition: background var(--motion-standard), color var(--motion-standard);
    }

    .nav-btn:hover {
      background: color-mix(in srgb, var(--md-on-surface) 8%, transparent);
    }

    .nav-btn.active {
      background: var(--md-secondary-container);
      color: var(--md-on-secondary-container);
    }

    .dashboard-header {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      gap: 16px;
      align-items: end;
      margin-bottom: 20px;
    }

    .summary-strip {
      display: grid;
      grid-template-columns: repeat(4, minmax(150px, 1fr));
      gap: 14px;
    }

    .summary-item {
      position: relative;
      overflow: hidden;
      min-height: 112px;
      padding: 18px 18px 16px;
      border: 1px solid color-mix(in srgb, var(--md-outline-variant) calc(var(--glass-border-opacity) * 100%), transparent);
      border-radius: var(--shape-lg);
      background: linear-gradient(
        180deg,
        color-mix(in srgb, var(--md-surface-container-lowest) 52%, transparent),
        color-mix(in srgb, var(--md-surface-container-low) calc(var(--glass-surface-opacity) * 100%), transparent)
      );
    }

    .summary-item::after {
      content: "";
      position: absolute;
      inset: auto 0 0;
      height: 4px;
      background: var(--summary-accent, var(--md-primary));
    }

    .summary-label {
      display: block;
      color: var(--md-on-surface-variant);
      font-size: 12px;
      font-weight: 500;
      text-transform: uppercase;
      letter-spacing: 0.04em;
    }

    .summary-value {
      display: block;
      margin-top: 8px;
      color: var(--md-on-surface);
      font-size: 38px;
      font-weight: 700;
      line-height: 1;
    }

    .summary-note {
      display: block;
      margin-top: 10px;
      color: var(--md-on-surface-variant);
      font-size: 13px;
      line-height: 1.3;
    }

    .summary-inline-action {
      display: inline-flex;
      margin-top: 10px;
      min-height: 30px;
      align-items: center;
      justify-content: center;
      gap: 6px;
      padding: 0 10px;
      border: 1px solid color-mix(in srgb, var(--md-success) 45%, var(--md-outline));
      border-radius: var(--shape-pill);
      background: color-mix(in srgb, var(--md-success-container) 65%, transparent);
      color: color-mix(in srgb, var(--md-on-success-container) 85%, var(--md-on-surface));
      cursor: pointer;
      font-size: 12px;
      font-weight: 700;
    }

    .summary-inline-action:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    .summary-item[data-summary-tone="all"] {
      --summary-accent: var(--md-primary);
    }

    .summary-item[data-summary-tone="running"] {
      --summary-accent: var(--md-success);
      background: linear-gradient(
        180deg,
        color-mix(in srgb, var(--md-success-container) 38%, transparent),
        color-mix(in srgb, var(--md-surface-container-low) calc(var(--glass-surface-opacity) * 100%), transparent)
      );
    }

    .summary-item[data-summary-tone="running"] .summary-value {
      color: var(--md-success);
      text-shadow: 0 1px 0 color-mix(in srgb, var(--md-success-container) 55%, transparent);
    }

    .summary-item[data-summary-tone="stopped"] {
      --summary-accent: var(--md-outline);
    }

    .summary-item[data-summary-tone="update"] {
      --summary-accent: var(--md-warning);
      background: linear-gradient(
        180deg,
        color-mix(in srgb, var(--md-warning-container) 44%, transparent),
        color-mix(in srgb, var(--md-surface-container-low) calc(var(--glass-surface-opacity) * 100%), transparent)
      );
    }

    .summary-item[data-summary-tone="update"] .summary-value {
      color: color-mix(in srgb, var(--md-warning) 88%, var(--md-on-surface));
      text-shadow: 0 1px 0 color-mix(in srgb, var(--md-warning-container) 60%, transparent);
    }

    .dashboard-actions {
      display: flex;
      align-items: center;
      justify-content: flex-end;
      gap: 10px;
    }

    .dashboard-layout {
      display: block;
      margin-top: 18px;
    }

    .group-rail {
      position: fixed;
      left: 30px;
      top: 152px;
      z-index: 24;
      display: grid;
      gap: 14px;
      align-content: start;
      width: 146px;
      min-height: calc(100vh - 184px);
      max-height: calc(100vh - 184px);
      padding: 14px 10px 14px 0;
      border: 1px solid color-mix(in srgb, var(--md-outline-variant) 32%, transparent);
      border-radius: var(--shape-xl);
      background: color-mix(in srgb, var(--md-surface-container-lowest) 58%, transparent);
      backdrop-filter: blur(calc(var(--glass-blur) + 2px));
      -webkit-backdrop-filter: blur(calc(var(--glass-blur) + 2px));
      box-shadow: var(--elevation-1);
      overflow-y: auto;
      overscroll-behavior: contain;
    }

    .group-rail::before {
      content: "";
      position: absolute;
      left: 19px;
      top: 0;
      bottom: 0;
      width: 3px;
      border-radius: 999px;
      background: color-mix(in srgb, var(--md-outline) 40%, transparent);
    }

    .group-rail-item {
      position: relative;
      display: grid;
      justify-items: start;
      gap: 5px;
      min-height: 46px;
      padding: 6px 6px 6px 38px;
      border-radius: 0 var(--shape-pill) var(--shape-pill) 0;
      border: 0;
      background: transparent;
      color: var(--md-on-surface-variant);
      cursor: pointer;
      text-align: left;
    }

    .group-rail-item::before {
      content: "";
      position: absolute;
      left: 12px;
      top: 12px;
      width: 18px;
      height: 18px;
      border-radius: 999px;
      border: 2px solid color-mix(in srgb, var(--md-outline) 64%, transparent);
      background: color-mix(in srgb, var(--md-surface-container-high) 58%, transparent);
      transition: background var(--motion-standard), border-color var(--motion-standard), transform var(--motion-standard);
    }

    .group-rail-item.active::before {
      background: var(--md-primary);
      border-color: var(--md-primary);
      transform: scale(1.04);
    }

    .group-rail-item.active {
      background: color-mix(in srgb, var(--md-primary-container) 48%, transparent);
      color: var(--md-on-surface);
    }

    .group-rail-kicker {
      font-size: 11px;
      line-height: 1;
      opacity: 0.82;
    }

    .group-rail-label {
      color: inherit;
      font-size: 13px;
      font-weight: 700;
      line-height: 1.15;
      overflow-wrap: anywhere;
    }

    .dashboard-group-content {
      display: grid;
      gap: 22px;
      min-width: 0;
    }

    .modules-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(360px, 1fr));
      gap: 18px;
      align-items: stretch;
      justify-content: start;
    }

    .toolbox-section {
      margin-top: 24px;
      display: grid;
      gap: 16px;
    }

    .toolbox-header {
      display: flex;
      align-items: flex-end;
      justify-content: space-between;
      gap: 12px;
      flex-wrap: wrap;
    }

    .toolbox-grid {
      display: grid;
      grid-template-columns: minmax(0, 1fr);
      gap: 14px;
    }

    .segmented-tabs {
      display: inline-grid;
      grid-auto-flow: column;
      gap: 0;
      width: max-content;
      max-width: 100%;
      min-height: 44px;
      padding: 4px;
      border-radius: var(--shape-pill);
      background: color-mix(in srgb, var(--md-surface-container-high) 54%, transparent);
      border: 1px solid color-mix(in srgb, var(--md-outline-variant) calc(var(--glass-border-opacity) * 100%), transparent);
      overflow-x: auto;
    }

    .segmented-tab {
      display: inline-flex;
      min-width: 96px;
      min-height: 36px;
      align-items: center;
      justify-content: center;
      gap: 6px;
      padding: 0 14px;
      border: 0;
      border-radius: var(--shape-pill);
      background: transparent;
      color: var(--md-on-surface-variant);
      cursor: pointer;
      font-size: 13px;
      font-weight: 600;
      white-space: nowrap;
    }

    .segmented-tab.active {
      background: color-mix(in srgb, var(--md-primary-container) 82%, transparent);
      color: var(--md-on-primary-container);
      box-shadow: var(--elevation-1);
    }

    .toolbox-card {
      display: grid;
      gap: 14px;
      padding: 18px;
      border-radius: var(--shape-md);
      background: linear-gradient(
        180deg,
        color-mix(in srgb, var(--md-tertiary-container) 16%, transparent),
        color-mix(in srgb, var(--md-surface-container-low) calc(var(--glass-surface-opacity) * 100%), transparent)
      );
      border: 1px solid color-mix(in srgb, var(--md-outline-variant) calc(var(--glass-border-opacity) * 100%), transparent);
    }

    .toolbox-card-header {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 12px;
    }

    .toolbox-card-title {
      display: grid;
      gap: 4px;
      min-width: 0;
    }

    .toolbox-card-title h3 {
      margin: 0;
      font-size: 18px;
      font-weight: 600;
      line-height: 1.25;
    }

    .toolbox-card-title p {
      margin: 0;
      color: var(--md-on-surface-variant);
      font-size: 13px;
      line-height: 1.45;
    }

    .toolbox-count {
      padding: 6px 10px;
      border-radius: var(--shape-pill);
      background: var(--md-surface-container-high);
      color: var(--md-on-surface-variant);
      font-size: 12px;
      white-space: nowrap;
    }

    .toolbox-actions {
      display: grid;
      gap: 10px;
    }

    .tool-action-item {
      display: grid;
      gap: 10px;
      padding: 14px;
      border-radius: var(--shape-sm);
      background: color-mix(in srgb, var(--md-surface-container-lowest) 50%, transparent);
      border: 1px solid color-mix(in srgb, var(--md-outline-variant) calc(var(--glass-border-opacity) * 100%), transparent);
    }

    .tool-action-head {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 12px;
    }

    .tool-action-copy {
      display: grid;
      gap: 4px;
      min-width: 0;
    }

    .tool-action-name-row {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
    }

    .tool-action-name {
      font-size: 15px;
      font-weight: 600;
      color: var(--md-on-surface);
    }

    .tool-action-desc {
      color: var(--md-on-surface-variant);
      font-size: 13px;
      line-height: 1.45;
    }

    .risk-chip,
    .mode-chip,
    .run-chip {
      display: inline-flex;
      align-items: center;
      min-height: 28px;
      padding: 0 10px;
      border-radius: var(--shape-pill);
      font-size: 12px;
      font-weight: 600;
      white-space: nowrap;
    }

    .risk-chip.high {
      background: var(--md-error-container);
      color: var(--md-on-error-container);
    }

    .risk-chip.medium {
      background: var(--md-warning-container);
      color: var(--md-on-warning-container);
    }

    .risk-chip.low {
      background: var(--md-success-container);
      color: var(--md-on-success-container);
    }

    .mode-chip {
      background: var(--md-secondary-container);
      color: var(--md-on-secondary-container);
    }

    .run-chip {
      display: inline-flex;
      min-height: 32px;
      align-items: center;
      justify-content: center;
      padding: 0 12px;
      border-radius: var(--shape-pill);
      background: var(--md-surface-container-high);
      color: var(--md-on-surface-variant);
      font-size: 12px;
      font-weight: 700;
      white-space: nowrap;
    }

    .run-chip.success {
      background: var(--md-success-container);
      color: var(--md-on-success-container);
    }

    .run-chip.error {
      background: var(--md-error-container);
      color: var(--md-on-error-container);
    }

    .run-chip.running {
      background: var(--md-tertiary-container);
      color: var(--md-on-tertiary-container);
    }

    .tool-action-meta {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 10px;
    }

    .tool-action-meta .metric {
      min-height: 72px;
    }

    .tool-action-buttons {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
    }

    .tool-action-warning {
      min-height: 58px;
      padding: 10px 12px;
      border-radius: var(--shape-sm);
      background: color-mix(in srgb, var(--md-warning-container) 58%, transparent);
      color: var(--md-on-warning-container);
      font-size: 13px;
      line-height: 1.45;
      border: 1px solid color-mix(in srgb, var(--md-warning) 22%, transparent);
      display: -webkit-box;
      overflow: hidden;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow-wrap: anywhere;
    }

    .module-card {
      display: flex;
      width: 100%;
      min-width: 0;
      min-height: 700px;
      flex-direction: column;
      gap: 12px;
      padding: 18px 18px 16px;
      overflow: hidden;
      border: 1px solid color-mix(in srgb, var(--md-outline-variant) calc(var(--glass-border-opacity) * 100%), transparent);
      border-radius: var(--shape-lg);
      background: linear-gradient(
        180deg,
        color-mix(in srgb, var(--md-surface-container-lowest) 66%, transparent),
        color-mix(in srgb, var(--md-surface-container-low) var(--card-surface-mix), transparent)
      );
      transition:
        background var(--motion-standard),
        border-color var(--motion-standard),
        box-shadow var(--motion-standard),
        transform var(--motion-standard);
    }

    .module-card.script-card {
      max-width: 360px;
      min-height: 356px;
      background: linear-gradient(
        180deg,
        color-mix(in srgb, var(--md-tertiary-container) 18%, transparent),
        color-mix(in srgb, var(--md-surface-container-low) var(--card-surface-mix), transparent)
      );
    }

    .module-card.system-action-card {
      max-width: 360px;
      min-height: 468px;
      background: linear-gradient(
        180deg,
        color-mix(in srgb, var(--md-warning-container) 22%, transparent),
        color-mix(in srgb, var(--md-surface-container-low) var(--card-surface-mix), transparent)
      );
    }

    .module-card:hover {
      background: linear-gradient(
        180deg,
        color-mix(in srgb, var(--md-surface-container-lowest) 72%, transparent),
        color-mix(in srgb, var(--md-surface-container) var(--card-surface-mix), transparent)
      );
      border-color: color-mix(in srgb, var(--md-primary) 42%, var(--md-outline-variant));
      box-shadow: var(--elevation-1);
      transform: translateY(-1px);
    }

    .module-card.running {
      border-color: color-mix(in srgb, var(--md-success) 30%, var(--md-outline-variant));
      background: linear-gradient(
        180deg,
        color-mix(in srgb, var(--md-success-container) 28%, transparent),
        color-mix(in srgb, var(--md-surface-container-low) var(--card-surface-mix), transparent)
      );
    }

    .module-group-stack {
      display: grid;
      gap: 28px;
    }

    .module-group {
      display: grid;
      gap: 14px;
      scroll-margin-top: 104px;
    }

    .module-group-header {
      display: flex;
      align-items: end;
      justify-content: space-between;
      gap: 12px;
      padding: 4px 2px 0;
    }

    .group-toggle {
      display: grid;
      grid-template-columns: auto minmax(0, 1fr);
      min-width: 0;
      align-items: center;
      gap: 10px 14px;
      padding: 0 0 0 14px;
      border: 0;
      background: transparent;
      color: inherit;
      cursor: pointer;
      text-align: left;
      position: relative;
    }

    .group-toggle .icon {
      transition: transform var(--motion-standard);
    }

    .group-toggle::before {
      content: "";
      position: absolute;
      left: 0;
      top: 4px;
      bottom: 4px;
      width: 4px;
      border-radius: 999px;
      background: var(--group-accent, var(--md-primary));
      box-shadow: 0 0 0 1px color-mix(in srgb, var(--group-accent, var(--md-primary)) 28%, transparent);
    }

    .group-toggle-copy {
      display: grid;
      gap: 2px;
      min-width: 0;
    }

    .group-toggle-kicker {
      color: color-mix(in srgb, var(--group-accent, var(--md-primary)) 70%, var(--md-on-surface-variant));
      font-size: 11px;
      font-weight: 700;
      line-height: 1;
      text-transform: uppercase;
      letter-spacing: 0.04em;
    }

    .module-group.collapsed .group-toggle .icon {
      transform: rotate(-90deg);
    }

    .module-group.collapsed .modules-grid {
      display: none;
    }

    .module-group-title {
      margin: 0;
      color: var(--md-on-surface);
      font-size: 19px;
      font-weight: 700;
      line-height: 1.2;
    }

    .module-group-meta {
      color: var(--md-on-surface-variant);
      font-size: 12px;
      white-space: nowrap;
    }

    .module-card.error {
      border-color: color-mix(in srgb, var(--md-error) 36%, var(--md-outline-variant));
      background: linear-gradient(
        180deg,
        color-mix(in srgb, var(--md-error-container) 28%, transparent),
        color-mix(in srgb, var(--md-surface-container-low) var(--card-surface-mix), transparent)
      );
    }

    .module-header {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      gap: 10px;
      align-items: start;
      min-height: 62px;
    }

    .module-title {
      min-width: 0;
    }

    .module-title h3 {
      margin: 0;
      color: var(--md-on-surface);
      font-size: 21px;
      font-weight: 700;
      line-height: 1.15;
      overflow-wrap: anywhere;
    }

    .module-id {
      display: inline-flex;
      max-width: 100%;
      margin-top: 6px;
      color: var(--md-on-surface-variant);
      font-family: var(--font-mono);
      font-size: 12px;
      overflow-wrap: anywhere;
    }

    .state-badge {
      display: inline-flex;
      min-height: 34px;
      align-items: center;
      gap: 7px;
      padding: 0 14px;
      border-radius: var(--shape-pill);
      background: var(--md-surface-container-high);
      color: var(--md-on-surface-variant);
      font-size: 13px;
      font-weight: 700;
      white-space: nowrap;
    }

    .state-badge.running {
      background: var(--md-success-container);
      color: var(--md-on-success-container);
    }

    .state-badge.error {
      background: var(--md-error-container);
      color: var(--md-on-error-container);
    }

    .state-badge.starting,
    .state-badge.stopping {
      background: var(--md-tertiary-container);
      color: var(--md-on-tertiary-container);
    }

    .state-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: currentColor;
    }

    .module-description {
      min-height: 40px;
      margin: -4px 0 0;
      color: var(--md-on-surface-variant);
      font-size: 14px;
      line-height: 1.45;
      display: -webkit-box;
      overflow: hidden;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow-wrap: anywhere;
    }

    .module-primary-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      min-height: 64px;
      padding: 10px 14px;
      border-radius: var(--shape-md);
      background: color-mix(in srgb, var(--md-surface-container-high) var(--card-inner-mix), transparent);
    }

    .module-primary-meta {
      min-width: 0;
    }

    .module-kicker {
      display: block;
      color: var(--md-on-surface-variant);
      font-size: 11px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }

    .module-emphasis {
      display: block;
      margin-top: 2px;
      color: var(--md-on-surface);
      font-size: 17px;
      font-weight: 700;
      line-height: 1.2;
      display: -webkit-box;
      overflow: hidden;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow-wrap: anywhere;
    }

    .metric-grid {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 8px;
    }

    .metric {
      min-width: 0;
      min-height: 66px;
      padding: 10px;
      border-radius: var(--shape-sm);
      background: color-mix(in srgb, var(--md-surface-container) var(--card-inner-mix), transparent);
    }

    .script-card-meta {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      min-height: 30px;
      align-items: center;
    }

    .script-card-result {
      display: grid;
      gap: 4px;
      min-height: 70px;
      padding: 12px;
      border-radius: var(--shape-md);
      background: color-mix(in srgb, var(--md-surface-container-high) var(--card-inner-mix), transparent);
      border: 1px solid color-mix(in srgb, var(--md-outline-variant) 28%, transparent);
    }

    .script-card-result .metric-value {
      margin-top: 0;
      font-family: var(--font-sans);
      font-size: 14px;
    }

    .metric-label {
      display: block;
      color: var(--md-on-surface-variant);
      font-size: 11px;
      font-weight: 500;
    }

    .metric-value {
      display: block;
      margin-top: 4px;
      color: var(--md-on-surface);
      font-family: var(--font-mono);
      font-size: 13px;
      font-weight: 700;
      display: -webkit-box;
      overflow: hidden;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow-wrap: anywhere;
    }

    .process-mini {
      display: grid;
      gap: 8px;
      min-height: 142px;
      padding: 10px 12px;
      border: 1px solid color-mix(in srgb, var(--md-outline-variant) calc(var(--glass-border-opacity) * 100%), transparent);
      border-radius: var(--shape-md);
      background: color-mix(in srgb, var(--md-surface-container-high) var(--card-inner-mix), transparent);
    }

    .process-mini.collapsed {
      gap: 6px;
      min-height: 82px;
    }

    .process-mini.collapsed .process-badges,
    .process-mini.collapsed .process-kv {
      display: none;
    }

    .process-mini-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
    }

    .process-mini-title {
      color: var(--md-on-surface);
      font-size: 12px;
      font-weight: 700;
    }

    .process-mini-time {
      color: var(--md-on-surface-variant);
      font-size: 11px;
      white-space: nowrap;
    }

    .process-badges {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
    }

    .proc-badge {
      display: inline-flex;
      min-height: 26px;
      align-items: center;
      gap: 5px;
      padding: 0 10px;
      border-radius: var(--shape-pill);
      background: var(--md-surface-container-highest);
      color: var(--md-on-surface-variant);
      font-size: 11px;
      font-weight: 600;
      white-space: nowrap;
    }

    .proc-badge.running {
      background: var(--md-success-container);
      color: var(--md-on-success-container);
    }

    .proc-badge.warn {
      background: var(--md-warning-container);
      color: var(--md-on-warning-container);
    }

    .proc-badge.error {
      background: var(--md-error-container);
      color: var(--md-on-error-container);
    }

    .process-kv {
      display: grid;
      gap: 4px;
      min-height: 72px;
      overflow: hidden;
    }

    .process-kv-row {
      display: grid;
      grid-template-columns: auto minmax(0, 1fr);
      gap: 8px;
      align-items: start;
      font-size: 11px;
      line-height: 1.35;
    }

    .process-kv-key {
      color: var(--md-on-surface-variant);
      white-space: nowrap;
    }

    .process-kv-value {
      min-width: 0;
      color: var(--md-on-surface);
      font-family: var(--font-mono);
      display: -webkit-box;
      overflow: hidden;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow-wrap: anywhere;
    }

    .process-mini-actions {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }

    .process-mini-actions .btn {
      flex: 1 1 132px;
      min-height: 36px;
    }

    .module-actions {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 10px;
      align-items: center;
      margin-top: auto;
    }

    .module-actions .btn-filled,
    .module-actions .btn-error,
    .module-actions .btn-tonal:first-child {
      grid-column: span 2;
    }

    .module-actions .btn {
      width: 100%;
      min-width: 0;
      padding-inline: 12px;
    }

    .module-card:not(.script-card) .module-actions {
      grid-template-columns: repeat(3, minmax(0, 1fr));
    }

    .module-card:not(.script-card) .module-actions .btn-filled,
    .module-card:not(.script-card) .module-actions .btn-error,
    .module-card:not(.script-card) .module-actions .btn-tonal:first-child {
      grid-column: 1 / -1;
    }

    .system-action-preset-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 10px;
    }

    .system-action-preset-grid .btn {
      width: 100%;
      min-width: 0;
      padding-inline: 10px;
    }

    .btn {
      position: relative;
      display: inline-flex;
      min-height: 40px;
      align-items: center;
      justify-content: center;
      gap: 8px;
      padding: 0 18px;
      border: 0;
      border-radius: var(--shape-pill);
      cursor: pointer;
      font-size: 14px;
      font-weight: 500;
      letter-spacing: 0;
      overflow: hidden;
      text-decoration: none;
      transition:
        background var(--motion-standard),
        box-shadow var(--motion-standard),
        color var(--motion-standard),
        transform var(--motion-standard);
      white-space: nowrap;
    }

    .btn:hover:not(:disabled) {
      box-shadow: var(--elevation-1);
    }

    .btn:active:not(:disabled) {
      transform: translateY(1px);
    }

    .btn:disabled {
      cursor: not-allowed;
      opacity: 0.45;
    }

    .btn-filled {
      background: var(--md-primary);
      color: var(--md-on-primary);
    }

    .btn-tonal {
      background: var(--md-secondary-container);
      color: var(--md-on-secondary-container);
    }

    .btn-tertiary {
      background: var(--md-tertiary-container);
      color: var(--md-on-tertiary-container);
    }

    .btn-error {
      background: var(--md-error);
      color: var(--md-on-error);
    }

    .btn-warning {
      background: var(--md-warning-container);
      color: var(--md-on-warning-container);
    }

    .btn-text {
      background: transparent;
      color: var(--md-primary);
      padding-inline: 12px;
    }

    .btn-text:hover:not(:disabled) {
      background: color-mix(in srgb, var(--md-primary) 10%, transparent);
      box-shadow: none;
    }

    .btn-outlined {
      border: 1px solid var(--md-outline);
      background: transparent;
      color: var(--md-primary);
    }

    .btn-sm {
      min-height: 34px;
      padding-inline: 14px;
      font-size: 13px;
    }

    .icon-btn {
      display: inline-grid;
      width: 40px;
      height: 40px;
      place-items: center;
      border: 0;
      border-radius: 50%;
      background: transparent;
      color: var(--md-on-surface-variant);
      cursor: pointer;
      transition: background var(--motion-standard), color var(--motion-standard);
    }

    .icon-btn:hover {
      background: color-mix(in srgb, var(--md-on-surface) 10%, transparent);
      color: var(--md-on-surface);
    }

    .settings-container {
      display: grid;
      gap: 26px;
      width: min(980px, 100%);
    }

    .settings-section {
      display: grid;
      gap: 12px;
    }

    .settings-panel {
      border: 1px solid color-mix(in srgb, var(--md-outline-variant) calc(var(--glass-border-opacity) * 100%), transparent);
      border-radius: var(--shape-lg);
      background: linear-gradient(
        180deg,
        color-mix(in srgb, var(--md-surface-container-lowest) 40%, transparent),
        color-mix(in srgb, var(--md-surface-container-low) calc(var(--glass-surface-opacity) * 100%), transparent)
      );
      overflow: hidden;
    }

    .settings-panel[open] {
      box-shadow: var(--elevation-1);
    }

    .settings-panel-summary {
      list-style: none;
      cursor: pointer;
      padding: 12px 14px;
    }

    .settings-panel-summary::-webkit-details-marker {
      display: none;
    }

    .settings-panel-summary .section-heading {
      padding-inline: 0;
    }

    .panel-chevron {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 28px;
      height: 28px;
      border-radius: 50%;
      color: var(--md-on-surface-variant);
      transition: transform var(--motion-standard), background var(--motion-standard);
    }

    .settings-panel[open] .panel-chevron {
      transform: rotate(180deg);
    }

    .settings-panel-summary:hover .panel-chevron {
      background: color-mix(in srgb, var(--md-on-surface) 10%, transparent);
    }

    .settings-panel-content {
      padding: 0 14px 14px;
    }

    .section-heading {
      display: flex;
      align-items: end;
      justify-content: space-between;
      gap: 16px;
      padding-inline: 4px;
    }

    .settings-section-title {
      margin: 0;
      color: var(--md-on-surface);
      font-size: 22px;
      font-weight: 500;
      line-height: 1.25;
    }

    .settings-section-desc {
      margin: 4px 0 0;
      color: var(--md-on-surface-variant);
      font-size: 14px;
    }

    :root[data-theme-resolved="dark"] .settings-section-title {
      color: #ffffff;
    }

    :root[data-theme-resolved="dark"] .settings-section-desc {
      color: color-mix(in srgb, #ffffff 86%, transparent);
    }

    :root[data-theme-resolved="dark"] .top-app-bar h1 {
      color: #ffffff;
    }

    :root[data-theme-resolved="dark"] .top-app-bar .subtitle {
      color: color-mix(in srgb, #ffffff 84%, transparent);
    }

    :root[data-theme-resolved="dark"] .top-app-bar .theme-btn {
      color: color-mix(in srgb, #ffffff 92%, transparent);
    }

    :root[data-theme-resolved="dark"] .top-app-bar .nav-btn {
      color: color-mix(in srgb, #ffffff 92%, transparent);
    }

    :root[data-theme-resolved="dark"] .top-app-bar .connection-chip {
      color: color-mix(in srgb, #ffffff 92%, transparent);
    }

    :root[data-theme-resolved="dark"] #dashboardView .settings-section-title {
      color: #ffffff !important;
    }

    :root[data-theme-resolved="dark"] #dashboardView .settings-section-desc {
      color: color-mix(in srgb, #ffffff 86%, transparent) !important;
    }

    :root[data-theme-resolved="dark"] .summary-item .summary-label,
    :root[data-theme-resolved="dark"] .summary-item .summary-note {
      color: color-mix(in srgb, #ffffff 84%, transparent) !important;
    }

    :root[data-theme-resolved="dark"] .summary-item .summary-value {
      color: #ffffff !important;
      text-shadow: none !important;
    }

    :root[data-theme-resolved="dark"] .summary-item[data-summary-tone="running"] .summary-value {
      color: #b6f5cc !important;
    }

    :root[data-theme-resolved="dark"] .summary-item[data-summary-tone="update"] .summary-value {
      color: #ffe28d !important;
    }

    .settings-list {
      display: grid;
      gap: 10px;
    }

    .settings-item {
      display: grid;
      grid-template-columns: auto minmax(0, 1fr) auto;
      gap: 14px;
      align-items: center;
      min-height: 72px;
      padding: 12px 14px;
      border: 1px solid color-mix(in srgb, var(--md-outline-variant) calc(var(--glass-border-opacity) * 100%), transparent);
      border-radius: var(--shape-lg);
      background: color-mix(in srgb, var(--md-surface-container-low) 56%, transparent);
      transition: background var(--motion-standard), border-color var(--motion-standard), transform var(--motion-standard);
    }

    .settings-item:hover {
      background: var(--md-surface-container);
    }

    .settings-item.dragging {
      opacity: 0.58;
      transform: scale(0.99);
    }

    .settings-item.drag-over {
      border-color: var(--md-primary);
      background: color-mix(in srgb, var(--md-primary-container) 54%, var(--md-surface-container));
    }

    .drag-handle {
      display: grid;
      width: 40px;
      height: 40px;
      place-items: center;
      border-radius: 50%;
      color: var(--md-on-surface-variant);
      cursor: grab;
      user-select: none;
    }

    .drag-handle:active {
      cursor: grabbing;
    }

    .settings-item-info {
      min-width: 0;
    }

    .settings-item-name {
      display: block;
      color: var(--md-on-surface);
      font-size: 16px;
      font-weight: 500;
      overflow-wrap: anywhere;
    }

    .settings-item-id {
      display: block;
      margin-top: 2px;
      color: var(--md-on-surface-variant);
      font-family: var(--font-mono);
      font-size: 12px;
      overflow-wrap: anywhere;
    }

    .settings-controls {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: flex-end;
      gap: 10px;
    }

    .order-badge {
      display: inline-flex;
      min-width: 38px;
      min-height: 30px;
      align-items: center;
      justify-content: center;
      border-radius: var(--shape-pill);
      background: var(--md-surface-container-high);
      color: var(--md-on-surface-variant);
      font-family: var(--font-mono);
      font-size: 12px;
      font-weight: 500;
    }

    .switch {
      position: relative;
      display: inline-flex;
      width: 52px;
      height: 32px;
      flex: 0 0 auto;
      align-items: center;
    }

    .switch input {
      position: absolute;
      width: 1px;
      height: 1px;
      opacity: 0;
    }

    .switch-track {
      position: absolute;
      inset: 0;
      border: 2px solid var(--md-outline);
      border-radius: var(--shape-pill);
      background: var(--md-surface-container-highest);
      cursor: pointer;
      transition: background var(--motion-standard), border-color var(--motion-standard);
    }

    .switch-track::before {
      content: "";
      position: absolute;
      top: 6px;
      left: 6px;
      width: 16px;
      height: 16px;
      border-radius: 50%;
      background: var(--md-outline);
      transition:
        width var(--motion-standard),
        height var(--motion-standard),
        transform var(--motion-standard),
        background var(--motion-standard);
    }

    .switch input:checked + .switch-track {
      border-color: var(--md-primary);
      background: var(--md-primary);
    }

    .switch input:checked + .switch-track::before {
      width: 24px;
      height: 24px;
      background: var(--md-on-primary);
      transform: translate(18px, -4px);
    }

    .text-field {
      display: grid;
      gap: 6px;
      min-width: 240px;
    }

    .text-field label {
      color: var(--md-on-surface-variant);
      font-size: 12px;
      font-weight: 500;
    }

    .input,
    .select {
      min-height: 44px;
      width: 100%;
      padding: 0 14px;
      border: 1px solid var(--md-outline);
      border-radius: var(--shape-xs);
      background: var(--md-surface-container-lowest);
      color: var(--md-on-surface);
      outline: none;
      transition: border-color var(--motion-standard), box-shadow var(--motion-standard);
    }

    .input:focus,
    .select:focus {
      border-color: var(--md-primary);
      box-shadow: 0 0 0 3px color-mix(in srgb, var(--md-primary) 18%, transparent);
    }

    .input.mono {
      font-family: var(--font-mono);
      font-size: 13px;
    }

    .url-row {
      grid-template-columns: minmax(0, 1fr) minmax(280px, 420px);
    }

    .url-input-group {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      gap: 8px;
      align-items: end;
    }

    .schedule-row {
      grid-template-columns: auto minmax(0, 1fr);
      align-items: start;
    }

    .schedule-controls {
      display: grid;
      grid-template-columns: repeat(2, minmax(120px, 1fr)) auto;
      gap: 10px;
      align-items: end;
    }

    .day-selector {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      grid-column: 1 / -1;
      padding-top: 2px;
    }

    .day-chip {
      display: inline-flex;
      min-height: 34px;
      align-items: center;
      justify-content: center;
      padding: 0 12px;
      border: 1px solid var(--md-outline);
      border-radius: var(--shape-pill);
      color: var(--md-on-surface-variant);
      cursor: pointer;
      font-size: 13px;
      font-weight: 500;
      user-select: none;
    }

    .day-chip input {
      position: absolute;
      opacity: 0;
      pointer-events: none;
    }

    .day-chip.checked {
      border-color: transparent;
      background: var(--md-tertiary-container);
      color: var(--md-on-tertiary-container);
    }

    .settings-actions {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      padding-top: 4px;
    }

    .empty-state,
    .loading-state {
      display: grid;
      grid-column: 1 / -1;
      min-height: 220px;
      place-items: center;
      padding: 32px;
      border: 1px dashed color-mix(in srgb, var(--md-outline) calc(var(--glass-border-opacity) * 100%), transparent);
      border-radius: var(--shape-lg);
      background: color-mix(in srgb, var(--md-surface-container-low) 48%, transparent);
      color: var(--md-on-surface-variant);
      text-align: center;
    }

    .loading-state .icon {
      margin-bottom: 10px;
      color: var(--md-primary);
      width: 34px;
      height: 34px;
      animation: spin 1100ms linear infinite;
    }

    .dialog {
      position: fixed;
      inset: 0;
      z-index: 100;
      display: none;
      align-items: center;
      justify-content: center;
      padding: 24px;
      background: color-mix(in srgb, var(--md-scrim) 42%, transparent);
    }

    .dialog.active {
      display: flex;
      animation: fade-in 140ms cubic-bezier(0.2, 0, 0, 1);
    }

    .inline-actions {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      align-items: center;
    }

    .dialog-content {
      display: grid;
      grid-template-rows: auto auto minmax(0, 1fr);
      width: min(1120px, 100%);
      max-height: min(84vh, 880px);
      border-radius: var(--shape-xl);
      background: color-mix(in srgb, var(--md-surface-container-high) calc(var(--glass-surface-opacity) * 100%), transparent);
      color: var(--md-on-surface);
      box-shadow: var(--elevation-3);
      overflow: hidden;
      animation: scale-in 180ms cubic-bezier(0.2, 0, 0, 1);
      backdrop-filter: blur(calc(var(--glass-blur) + 4px));
      -webkit-backdrop-filter: blur(calc(var(--glass-blur) + 4px));
    }

    .dialog-header {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      gap: 14px;
      align-items: center;
      padding: 22px 24px 12px;
    }

    .dialog-title {
      min-width: 0;
    }

    .dialog-title h2 {
      margin: 0;
      color: var(--md-on-surface);
      font-size: 24px;
      font-weight: 500;
      overflow-wrap: anywhere;
    }

    .dialog-title p {
      margin: 4px 0 0;
      color: var(--md-on-surface-variant);
      font-size: 14px;
    }

    .log-toolbar {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      align-items: center;
      padding: 0 24px 14px;
    }

    .log-toolbar .text-field {
      flex: 1 1 260px;
      min-width: 180px;
    }

    .log-toolbar .select-field {
      width: 148px;
      flex: 0 0 auto;
    }

    .dialog-body {
      min-height: 0;
      margin: 0 24px 24px;
      border: 1px solid var(--md-outline-variant);
      border-radius: var(--shape-lg);
      background: var(--md-surface-container-lowest);
      overflow: auto;
    }

    .log-content {
      min-height: 360px;
      margin: 0;
      padding: 14px 16px;
      color: var(--md-on-surface);
      font-family: var(--font-mono);
      font-size: 13px;
      line-height: 1.6;
      white-space: pre-wrap;
      word-break: break-word;
    }

    .log-line {
      display: block;
      padding: 1px 6px;
      border-radius: var(--shape-xs);
    }

    .log-line:hover {
      background: var(--md-surface-container);
    }

    .log-line-error {
      color: var(--md-error);
      background: color-mix(in srgb, var(--md-error-container) 36%, transparent);
    }

    .log-line-warn {
      color: var(--md-warning);
    }

    .log-line-stack {
      color: var(--md-on-surface-variant);
      padding-left: 22px;
    }

    .log-line-hidden {
      display: none;
    }

    .terminal-drawer {
      position: fixed;
      top: 0;
      right: 0;
      bottom: 0;
      z-index: 80;
      display: grid;
      grid-template-columns: 8px minmax(360px, 1fr);
      width: min(var(--terminal-width, 720px), calc(100vw - 24px));
      min-width: 360px;
      max-width: calc(100vw - 24px);
      transform: translateX(calc(100% + 12px));
      transition: transform var(--motion-emphasized);
      pointer-events: none;
    }

    .terminal-drawer.active {
      transform: translateX(0);
      pointer-events: auto;
    }

    .terminal-peek {
      position: fixed;
      right: 18px;
      bottom: 18px;
      z-index: 79;
      display: none;
      align-items: center;
      gap: 8px;
      min-height: 42px;
      padding: 0 14px;
      border: 1px solid color-mix(in srgb, var(--md-outline-variant) 62%, transparent);
      border-radius: var(--shape-pill);
      background: color-mix(in srgb, var(--md-surface-container-high) 88%, transparent);
      color: var(--md-on-surface);
      box-shadow: var(--elevation-2);
      cursor: pointer;
      backdrop-filter: blur(calc(var(--glass-blur) + 2px));
      -webkit-backdrop-filter: blur(calc(var(--glass-blur) + 2px));
    }

    .terminal-peek.visible {
      display: inline-flex;
    }

    .terminal-resizer {
      cursor: col-resize;
      background: transparent;
    }

    .terminal-resizer::after {
      content: "";
      display: block;
      width: 2px;
      height: 100%;
      margin-left: 3px;
      background: color-mix(in srgb, var(--md-outline) 34%, transparent);
    }

    .terminal-panel {
      display: grid;
      grid-template-rows: auto minmax(0, 1fr);
      min-width: 0;
      border-left: 1px solid color-mix(in srgb, var(--md-outline-variant) calc(var(--glass-border-opacity) * 100%), transparent);
      background: color-mix(in srgb, var(--md-surface-container-lowest) 88%, transparent);
      backdrop-filter: blur(calc(var(--glass-blur) + 4px));
      -webkit-backdrop-filter: blur(calc(var(--glass-blur) + 4px));
      box-shadow: -8px 0 28px rgb(0 0 0 / 0.22);
    }

    .terminal-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      min-height: 68px;
      padding: 12px 14px;
      border-bottom: 1px solid var(--md-outline-variant);
    }

    .terminal-title {
      display: grid;
      gap: 2px;
      min-width: 0;
    }

    .terminal-title h2 {
      margin: 0;
      color: var(--md-on-surface);
      font-size: 17px;
      line-height: 1.2;
      overflow-wrap: anywhere;
    }

    .terminal-title p {
      margin: 0;
      color: var(--md-on-surface-variant);
      font-size: 12px;
      overflow-wrap: anywhere;
    }

    .terminal-actions {
      display: flex;
      flex-wrap: wrap;
      justify-content: flex-end;
      gap: 8px;
    }

    .terminal-body {
      min-height: 0;
      padding: 8px;
      background: #0b0f12;
    }

    #webTerminal {
      width: 100%;
      height: 100%;
    }

    .snackbar {
      position: fixed;
      left: 50%;
      top: 16px;
      z-index: 200;
      display: flex;
      min-height: 52px;
      max-width: min(560px, calc(100vw - 32px));
      align-items: flex-start;
      gap: 12px;
      padding: 10px 12px 10px 14px;
      border-radius: var(--shape-xs);
      background: #313631;
      color: #f0f1ec;
      box-shadow: var(--elevation-3);
      opacity: 0;
      pointer-events: auto;
      transform: translate(-50%, -16px);
      transition: opacity var(--motion-standard), transform var(--motion-standard);
    }

    .snackbar.show {
      opacity: 1;
      transform: translate(-50%, 0);
    }

    .snackbar.error {
      background: var(--md-error-container);
      color: var(--md-on-error-container);
    }

    .snackbar.success {
      background: var(--md-success-container);
      color: var(--md-on-success-container);
    }

    .snackbar-message {
      flex: 1 1 auto;
      min-width: 0;
      max-height: 180px;
      overflow: auto;
      white-space: pre-wrap;
      word-break: break-word;
      user-select: text;
      cursor: text;
      padding-top: 2px;
      font-size: 13px;
      line-height: 1.45;
    }

    .snackbar-actions {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      flex: 0 0 auto;
      padding-left: 4px;
    }

    .snackbar-action-btn {
      display: inline-flex;
      min-height: 30px;
      align-items: center;
      justify-content: center;
      padding: 0 10px;
      border: 0;
      border-radius: var(--shape-pill);
      background: color-mix(in srgb, currentColor 16%, transparent);
      color: inherit;
      cursor: pointer;
      font-size: 12px;
      font-weight: 600;
    }

    .snackbar-action-btn:hover {
      background: color-mix(in srgb, currentColor 24%, transparent);
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.42; }
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    @keyframes fade-in {
      from { opacity: 0; }
      to { opacity: 1; }
    }

    @keyframes scale-in {
      from {
        opacity: 0;
        transform: scale(0.96);
      }
      to {
        opacity: 1;
        transform: scale(1);
      }
    }

    @media (max-width: 1080px) {
      .shell {
        padding-left: 160px;
      }

      .top-app-bar {
        margin-left: -160px;
        padding-left: 160px;
      }

      .group-rail {
        left: 18px;
        width: 124px;
      }

      .top-app-bar,
      .dashboard-header {
        grid-template-columns: 1fr;
      }

      .bar-actions,
      .dashboard-actions {
        justify-content: flex-start;
      }

      .theme-switcher {
        justify-items: start;
      }

      .summary-strip {
        grid-template-columns: repeat(2, minmax(0, 1fr));
      }
    }

    @media (max-width: 760px) {
      .shell {
        padding: 14px;
      }

      .top-app-bar {
        margin: -14px -14px 14px;
        padding: 14px;
      }

      .group-rail {
        position: sticky;
        top: 78px;
        z-index: 24;
        width: auto;
        max-height: none;
        display: grid;
        grid-auto-flow: column;
        grid-auto-columns: minmax(88px, 1fr);
        gap: 8px;
        margin: 0 0 16px;
        padding: 8px 0;
        overflow-x: auto;
        overflow-y: hidden;
      }

      .group-rail::before {
        left: 0;
        right: 0;
        top: auto;
        bottom: 15px;
        width: auto;
        height: 2px;
      }

      .group-rail-item {
        min-height: 52px;
        padding: 0 0 18px;
        justify-items: center;
        text-align: center;
      }

      .group-rail-item::before {
        left: 50%;
        top: auto;
        bottom: 8px;
        transform: translateX(-50%);
      }

      .group-rail-item.active::before {
        transform: translateX(-50%) scale(1.04);
      }

      .brand-mark {
        width: 40px;
        height: 40px;
        border-radius: var(--shape-md);
      }

      h1 {
        font-size: 24px;
      }

      .bar-actions {
        flex-direction: column;
        align-items: stretch;
      }

      .theme-tabs {
        width: 100%;
      }

      .theme-btn {
        min-width: 0;
        width: 100%;
      }

      .view-tabs {
        width: 100%;
      }

      .nav-btn {
        min-width: 0;
        width: 100%;
      }

      .connection-chip {
        justify-content: center;
      }

      .summary-strip {
        grid-template-columns: 1fr 1fr;
      }

      .modules-grid {
        grid-template-columns: minmax(0, 1fr);
      }

      .module-card {
        width: 100%;
        min-height: 700px;
        height: auto;
      }

      .module-card.script-card {
        max-width: none;
        min-height: 430px;
      }

      .module-card.system-action-card {
        max-width: none;
        min-height: 468px;
      }

      .tool-action-meta {
        grid-template-columns: 1fr;
      }

      .metric-grid {
        grid-template-columns: repeat(2, minmax(0, 1fr));
      }

      .system-action-preset-grid {
        grid-template-columns: 1fr;
      }

      .terminal-drawer {
        grid-template-columns: 0 minmax(0, 1fr);
        width: 100vw;
        min-width: 0;
        max-width: 100vw;
      }

      .terminal-resizer {
        display: none;
      }

      .terminal-header {
        align-items: stretch;
        flex-direction: column;
      }

      .terminal-actions {
        justify-content: stretch;
      }

      .terminal-actions .btn {
        flex: 1 1 120px;
      }

      .process-kv-row {
        grid-template-columns: 1fr;
        gap: 2px;
      }

      .settings-item,
      .url-row,
      .schedule-row {
        grid-template-columns: 1fr;
      }

      .settings-panel-summary,
      .settings-panel-content {
        padding-inline: 10px;
      }

      .drag-handle {
        display: none;
      }

      .settings-controls,
      .url-input-group,
      .schedule-controls {
        grid-template-columns: 1fr;
        justify-content: stretch;
      }

      .settings-controls {
        align-items: stretch;
      }

      .btn {
        width: 100%;
      }

      .module-actions .btn {
        width: auto;
        flex: 1 1 130px;
      }

      .dialog {
        padding: 10px;
      }

      .dialog-content {
        max-height: calc(100vh - 20px);
        border-radius: var(--shape-lg);
      }

      .dialog-header,
      .log-toolbar {
        padding-inline: 16px;
      }

      .dialog-body {
        margin: 0 16px 16px;
      }
    }
  </style>

  <script src="/vendor/xterm-web-links/addon-web-links.js"></script>
  <script>
    const THEME_STORAGE_KEY = 'hubkit-theme-mode';
    const UI_PREFS_STORAGE_KEY = 'hubkit-ui-prefs';
    let ws = null;
    let modules = [];
    const defaultStartPolicy = {
      retryCount: 1,
      retryDelayMs: 1500,
      healthCheckEnabled: true,
      healthCheckTimeoutMs: 15000,
      preflightChecksEnabled: true,
      blockOnPortConflict: true,
    };
    let settings = {
      autoStart: {},
      startOrder: [],
      visibility: {},
      schedules: {},
      moduleWebUrls: {},
      startPolicies: {},
      groupStartPolicyTemplates: {},
    };
    let reconnectInterval = null;
    let currentView = 'dashboard';
    let dragSrcIndex = null;
    let currentLogModuleId = null;
    let currentLogModuleName = '';
    let currentLogTarget = null;
    let logTailTimer = null;
    let lastToastMessage = '';
    let themeMode = document.documentElement.dataset.themeMode || 'auto';
    let resolvedTheme = document.documentElement.dataset.themeResolved || 'light';
    let diagnosticsByModule = {};
    let diagnosticsLoadingByModule = {};
    let forceCloseLoadingByModule = {};
    let forceCloseAllLoading = false;
    let moduleActionLoading = {};
    let moduleAuditReports = [];
    let startPolicyTemplates = [];
    let scriptBundles = [];
    let scriptRunLoading = {};
    let systemActions = [];
    let systemActionLoading = {};
    let systemActionRefreshing = {};
    let terminalInstance = null;
    let terminalFitAddon = null;
    let activeTerminalSessionId = null;
    let activeTerminalAction = null;
    let terminalHasContent = false;
    let terminalSessionState = 'closed';
    let terminalResizing = false;
    let terminalDrawerWidth = Number(localStorage.getItem('hubkit-terminal-width')) || 720;
    let uiPrefs = loadUiPrefs();
    let settingsPanels = {
      display: true,
      autoStart: false,
      grouping: false,
      visibility: false,
      startPolicy: false,
      webUrl: false,
      schedule: false,
      cleanup: false,
    };
    const systemThemeQuery = window.matchMedia('(prefers-color-scheme: dark)');

    const dayLabels = ['日', '一', '二', '三', '四', '五', '六'];

    function icon(name) {
      return `<svg class="icon" aria-hidden="true"><use href="#icon-${name}"></use></svg>`;
    }

    function escapeHtml(value) {
      return String(value ?? '')
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#39;');
    }

    function escapeAttr(value) {
      return escapeHtml(value).replace(/`/g, '&#96;');
    }

    function jsString(value) {
      return String(value ?? '').replace(/\\/g, '\\\\').replace(/'/g, "\\'").replace(/\n/g, '\\n').replace(/\r/g, '');
    }

    function loadUiPrefs() {
      try {
        const raw = localStorage.getItem(UI_PREFS_STORAGE_KEY);
        const parsed = raw ? JSON.parse(raw) : {};
        const blurRaw = Number(parsed?.wallpaperBlur);
        const wallpaperBlur = Number.isFinite(blurRaw)
          ? Math.min(24, Math.max(0, blurRaw))
          : 6;
        return {
          collapseProcessMini: parsed?.collapseProcessMini === true,
          collapseDashboardGroups: parsed?.collapseDashboardGroups === true,
          groupCollapseState: parsed?.groupCollapseState && typeof parsed.groupCollapseState === 'object'
            ? parsed.groupCollapseState
            : {},
          wallpaperEnabled: parsed?.wallpaperEnabled === true,
          wallpaperUrl: typeof parsed?.wallpaperUrl === 'string' ? parsed.wallpaperUrl : '',
          wallpaperFit: ['contain', 'cover', 'stretch'].includes(parsed?.wallpaperFit) ? parsed.wallpaperFit : 'contain',
          wallpaperPositionX: clampNumber(parsed?.wallpaperPositionX, 0, 100, 50),
          wallpaperPositionY: clampNumber(parsed?.wallpaperPositionY, 0, 100, 50),
          wallpaperBlur,
          wallpaperOpacity: clampNumber(parsed?.wallpaperOpacity, 0.35, 1, 0.92),
          wallpaperScrimOpacity: clampNumber(parsed?.wallpaperScrimOpacity, 0, 0.8, resolvedTheme === 'dark' ? 0.55 : 0.35),
          glassBlur: clampNumber(parsed?.glassBlur, 0, 36, 18),
          glassOpacity: clampNumber(parsed?.glassOpacity, 0.28, 0.92, 0.72),
          glassBorderOpacity: clampNumber(parsed?.glassBorderOpacity, 0.12, 0.65, 0.34),
          cardSurfaceOpacity: clampNumber(parsed?.cardSurfaceOpacity, 0.45, 0.96, 0.86),
          cardInnerOpacity: clampNumber(parsed?.cardInnerOpacity, 0.35, 0.92, 0.72),
        };
      } catch (error) {
        return {
          collapseProcessMini: false,
          collapseDashboardGroups: false,
          groupCollapseState: {},
          wallpaperEnabled: false,
          wallpaperUrl: '',
          wallpaperFit: 'contain',
          wallpaperPositionX: 50,
          wallpaperPositionY: 50,
          wallpaperBlur: 6,
          wallpaperOpacity: 0.92,
          wallpaperScrimOpacity: resolvedTheme === 'dark' ? 0.55 : 0.35,
          glassBlur: 18,
          glassOpacity: 0.72,
          glassBorderOpacity: 0.34,
          cardSurfaceOpacity: 0.86,
          cardInnerOpacity: 0.72,
        };
      }
    }

    function clampNumber(value, min, max, fallback) {
      const n = Number(value);
      if (!Number.isFinite(n)) return fallback;
      return Math.min(max, Math.max(min, n));
    }

    function saveUiPrefs() {
      localStorage.setItem(UI_PREFS_STORAGE_KEY, JSON.stringify(uiPrefs));
    }

    function setProcessMiniCollapsed(enabled) {
      uiPrefs.collapseProcessMini = enabled === true;
      saveUiPrefs();
      renderDashboard();
      if (currentView === 'settings') {
        renderSettings();
      }
    }

    function setDashboardGroupsCollapsed(enabled) {
      uiPrefs.collapseDashboardGroups = enabled === true;
      const nextState = {};
      buildDashboardSections().forEach((section) => {
        nextState[section.id] = uiPrefs.collapseDashboardGroups;
      });
      uiPrefs.groupCollapseState = nextState;
      saveUiPrefs();
      renderDashboardGroups();
      if (currentView === 'settings') {
        renderSettings();
      }
    }

    function setSingleDashboardGroupCollapsed(sectionId, enabled) {
      uiPrefs.groupCollapseState = uiPrefs.groupCollapseState || {};
      uiPrefs.groupCollapseState[sectionId] = enabled === true;
      saveUiPrefs();
      renderDashboardGroups();
      if (currentView === 'settings') {
        renderSettings();
      }
    }

    function toggleDashboardGroup(sectionId) {
      uiPrefs.groupCollapseState = uiPrefs.groupCollapseState || {};
      const current = isDashboardGroupCollapsed(sectionId);
      uiPrefs.groupCollapseState[sectionId] = !current;
      saveUiPrefs();
      renderDashboardGroups();
      if (currentView === 'settings') {
        renderSettings();
      }
    }

    function isDashboardGroupCollapsed(sectionId) {
      if (uiPrefs.groupCollapseState && Object.prototype.hasOwnProperty.call(uiPrefs.groupCollapseState, sectionId)) {
        return uiPrefs.groupCollapseState[sectionId] === true;
      }
      return uiPrefs.collapseDashboardGroups === true;
    }

    function applyWallpaper() {
      const layer = document.getElementById('wallpaperLayer');
      if (!layer) return;
      const enabled = uiPrefs.wallpaperEnabled === true;
      const url = String(uiPrefs.wallpaperUrl || '').trim();
      const blur = Number.isFinite(Number(uiPrefs.wallpaperBlur)) ? Number(uiPrefs.wallpaperBlur) : 6;
      const safeBlur = Math.min(24, Math.max(0, blur));
      const fit = ['contain', 'cover', 'stretch'].includes(uiPrefs.wallpaperFit) ? uiPrefs.wallpaperFit : 'contain';
      const positionX = clampNumber(uiPrefs.wallpaperPositionX, 0, 100, 50);
      const positionY = clampNumber(uiPrefs.wallpaperPositionY, 0, 100, 50);
      const scrimOpacity = clampNumber(uiPrefs.wallpaperScrimOpacity, 0, 0.8, resolvedTheme === 'dark' ? 0.55 : 0.35);
      layer.style.setProperty('--wallpaper-blur', `${safeBlur}px`);
      layer.style.setProperty('--wallpaper-opacity', String(uiPrefs.wallpaperOpacity ?? 0.92));
      layer.style.setProperty('--wallpaper-scale', safeBlur === 0 ? '1' : '1.03');
      document.documentElement.style.setProperty('--wallpaper-scrim-opacity', enabled && url ? String(scrimOpacity) : '0');
      layer.style.backgroundSize = fit === 'stretch' ? '100% 100%' : fit;
      layer.style.backgroundPosition = `${positionX}% ${positionY}%`;

      if (!enabled || !url) {
        layer.style.display = 'none';
        layer.style.backgroundImage = '';
        return;
      }

      layer.style.backgroundImage = `url("${url.replace(/"/g, '\\"')}")`;
      layer.style.display = 'block';
    }

    function applyGlassPrefs() {
      const root = document.documentElement;
      root.style.setProperty('--glass-blur', `${uiPrefs.glassBlur ?? 18}px`);
      root.style.setProperty('--glass-surface-opacity', String(uiPrefs.glassOpacity ?? 0.72));
      root.style.setProperty('--glass-border-opacity', String(uiPrefs.glassBorderOpacity ?? 0.34));
      root.style.setProperty('--card-surface-mix', `${Math.round((uiPrefs.cardSurfaceOpacity ?? 0.86) * 100)}%`);
      root.style.setProperty('--card-inner-mix', `${Math.round((uiPrefs.cardInnerOpacity ?? 0.72) * 100)}%`);
    }

    function setWallpaperEnabled(enabled) {
      uiPrefs.wallpaperEnabled = enabled === true;
      saveUiPrefs();
      applyWallpaper();
    }

    function updateWallpaperUrl(value) {
      uiPrefs.wallpaperUrl = String(value || '');
      saveUiPrefs();
      applyWallpaper();
    }

    function isLocalWallpaperUrl(value = uiPrefs.wallpaperUrl) {
      return String(value || '').startsWith('data:image/');
    }

    function formatWallpaperUrlForInput() {
      const url = String(uiPrefs.wallpaperUrl || '');
      if (!isLocalWallpaperUrl(url)) return url;
      const sizeKb = Math.max(1, Math.round(url.length * 0.75 / 1024));
      const sizeLabel = sizeKb >= 1024 ? `${(sizeKb / 1024).toFixed(1)} MB` : `${sizeKb} KB`;
      return `本地上传图片（浏览器缓存，约 ${sizeLabel}）`;
    }

    async function copyWallpaperData() {
      if (!uiPrefs.wallpaperUrl) {
        showToast('没有可复制的壁纸数据', 'error');
        return;
      }
      try {
        await navigator.clipboard.writeText(uiPrefs.wallpaperUrl);
        showToast('壁纸数据已复制');
      } catch (error) {
        showToast('复制失败', 'error');
      }
    }

    function uploadWallpaperFile(input) {
      const file = input?.files?.[0];
      if (!file) return;
      if (!file.type.startsWith('image/')) {
        showToast('请选择图片文件', 'error');
        input.value = '';
        return;
      }

      const reader = new FileReader();
      reader.onload = () => {
        try {
          uiPrefs.wallpaperUrl = String(reader.result || '');
          uiPrefs.wallpaperEnabled = true;
          saveUiPrefs();
          applyWallpaper();
      if (currentView === 'settings') renderSettings();
      showToast('本地壁纸已应用');
        } catch (error) {
          showToast('图片过大，无法存入浏览器本地缓存', 'error');
        } finally {
          input.value = '';
        }
      };
      reader.onerror = () => {
        showToast('读取图片失败', 'error');
        input.value = '';
      };
      reader.readAsDataURL(file);
    }

    function resolveTheme(mode) {
      return mode === 'auto' ? (systemThemeQuery.matches ? 'dark' : 'light') : mode;
    }

    function applyTheme(mode, persist = true) {
      themeMode = mode === 'light' || mode === 'dark' || mode === 'auto' ? mode : 'auto';
      resolvedTheme = resolveTheme(themeMode);
      document.documentElement.dataset.themeMode = themeMode;
      document.documentElement.dataset.themeResolved = resolvedTheme;
      if (persist) {
        localStorage.setItem(THEME_STORAGE_KEY, themeMode);
      }
      updateThemeControls();
    }

    function updateThemeControls() {
      document.querySelectorAll('.theme-btn').forEach((button) => {
        const active = button.dataset.themeMode === themeMode;
        button.classList.toggle('active', active);
        button.setAttribute('aria-selected', active ? 'true' : 'false');
      });
    }

    function setThemeMode(mode) {
      applyTheme(mode, true);
      const themeName = mode === 'auto' ? '自动跟随系统' : mode === 'light' ? '浅色模式' : '深色模式';
      showToast(`已切换到${themeName}`);
    }

    function connectWebSocket() {
      const protocol = window.location.protocol === 'https:' ? 'wss:' : 'ws:';
      const wsUrl = `${protocol}//${window.location.host}`;

      ws = new WebSocket(wsUrl);

      ws.onopen = () => {
        updateConnectionStatus(true);
        clearInterval(reconnectInterval);
        reconnectInterval = null;
        fetchModules();
        fetchSettings();
      };

      ws.onmessage = (event) => {
        try {
          handleWebSocketMessage(JSON.parse(event.data));
        } catch (error) {
          console.error('Invalid WebSocket message:', error);
        }
      };

      ws.onerror = () => updateConnectionStatus(false);

      ws.onclose = () => {
        updateConnectionStatus(false);
        if (!reconnectInterval) {
          reconnectInterval = setInterval(connectWebSocket, 3000);
        }
      };
    }

    function updateConnectionStatus(connected) {
      const chip = document.getElementById('connectionChip');
      const statusText = document.getElementById('wsStatusText');
      chip.className = `connection-chip ${connected ? 'connected' : 'disconnected'}`;
      statusText.textContent = connected ? '已连接' : '未连接';
    }

    function handleWebSocketMessage(data) {
      const refreshEvents = new Set([
        'module_started',
        'module_stopped',
        'module_restarted',
        'module_updated',
        'module_runtime_updated',
        'schedule_triggered',
      ]);
      if (refreshEvents.has(data.type)) {
        fetchModules();
        if (currentView === 'diagnostics') fetchModuleAudit();
      }
      if (data.type === 'script_action_updated') {
        fetchScriptBundles();
      }
      if (data.type === 'system_action_updated') {
        fetchSystemActions();
      }
      if (data.type === 'terminal_output') {
        handleTerminalOutput(data);
      }
      if (data.type === 'terminal_exit') {
        handleTerminalExit(data);
      }
      if (data.type === 'terminal_error') {
        handleTerminalError(data);
      }
    }

      } catch (error) {
        console.error('Failed to fetch modules:', error);

            groupStartPolicyTemplates: settings.groupStartPolicyTemplates,
          }),
        });
        const json = await response.json();
        if (json.success) {
          showToast('设置已保存');
          fetchSettings();

          showToast(json.error || '保存失败', 'error');

    async function moduleAction(id, action) {
      const labels = { start: '启动', stop: '停止', restart: '重启' };
      if (moduleActionLoading[id]) return;
      try {
        moduleActionLoading[id] = action;
        renderDashboard();
        const response = await fetch(`/api/modules/${encodeURIComponent(id)}/${action}`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: action === 'stop' ? JSON.stringify({ force: false }) : undefined,
        });
        const json = await response.json().catch(() => ({}));
        if (!response.ok || json.success === false) {
          throw new Error(json.error || `${labels[action]}失败`);
        }
        showToast(json.message || `${labels[action]}成功`);
        fetchModules();
      } catch (error) {
        console.error(`Failed to ${action} module:`, error);
        showToast(error.message || `${labels[action]}失败`, 'error');
      } finally {
        delete moduleActionLoading[id];
        renderDashboard();
      }
    }
