    function createModuleCard(module) {
      const runtimeState = module.runtimeState || null;
      const effectiveStatus = getEffectiveStatus(module);
      const statusClass = getStatusClass(effectiveStatus);
      const uptime = module.uptime ? formatUptime(module.uptime) : 'N/A';
      const pid = module.pid || 'N/A';
      const description = module.description || getTypeText(module.type);
      const startedAt = module.startedAt ? formatStartedAt(module.startedAt) : '未知';
      const diagnostics = diagnosticsByModule[module.id] || null;
      const startReadiness = module.startReadiness || null;
      const healthSummary = runtimeState?.health?.summary || '未检查';
      const lastRecordText = formatLastStartRecord(runtimeState?.lastStartRecord);
      const primaryMeta = effectiveStatus === 'running'
        ? `已运行 ${uptime}`
        : runtimeState?.phase === 'failed'
          ? runtimeState.failure?.details || runtimeState.details || '查看日志定位问题'
        : isModuleBusy(module)
          ? runtimeState?.details || runtimeState?.summary || '启动进行中'
        : startReadiness?.ready === false
          ? startReadiness.installCommand || '首次启动会先安装依赖'
        : module.updateable
          ? '支持在线更新'
          : `${getTypeText(module.type)} 模块`;
      const keyAction = effectiveStatus === 'running'
        ? healthSummary
        : runtimeState?.phase === 'failed'
          ? runtimeState.failure?.summary || runtimeState.summary || '启动失败'
        : isModuleBusy(module)
          ? runtimeState?.summary || '启动进行中'
        : startReadiness?.ready === false
          ? startReadiness.summary || '启动前需要准备依赖'
          : module.updateable
            ? '待机，可更新'
            : '待机，可启动';

      return `
        <article class="module-card glass-panel ${statusClass}" data-module-id="${escapeAttr(module.id)}">
          <div class="module-header">
            <div class="module-title">
              <h3>${escapeHtml(module.name)}</h3>
              <span class="module-id">${escapeHtml(module.id)}</span>
            </div>
            <div class="state-badge ${statusClass}">
              <span class="state-dot"></span>
              <span>${escapeHtml(getStatusText(effectiveStatus))}</span>
            </div>
          </div>

          <p class="module-description">${escapeHtml(description)}</p>

          ${runtimeState?.phase === 'failed' ? `
            <div class="tool-action-warning">${escapeHtml(runtimeState.failure?.details || runtimeState.details || runtimeState.failure?.summary || runtimeState.summary || '启动失败')}</div>
          ` : startReadiness?.ready === false ? `
            <div class="tool-action-warning">${escapeHtml(startReadiness.details || startReadiness.summary || '首次启动会先安装依赖，再继续启动模块')}</div>
          ` : runtimeState?.health?.state === 'unhealthy' ? `
            <div class="tool-action-warning">${escapeHtml(runtimeState.health.details || runtimeState.health.summary || '健康检查未通过')}</div>
          ` : ''}

          <div class="module-primary-row">
            <div class="module-primary-meta">
              <span class="module-kicker">当前状态</span>
              <span class="module-emphasis">${escapeHtml(keyAction)}</span>
            </div>
            <div class="module-primary-meta" style="text-align: right;">
              <span class="module-kicker">摘要</span>
              <span class="module-emphasis">${escapeHtml(primaryMeta)}</span>
            </div>
          </div>

          <div class="metric-grid">
            <div class="metric">
              <span class="metric-label">类型</span>
              <span class="metric-value">${escapeHtml(getTypeText(module.type))}</span>
            </div>
            <div class="metric">
              <span class="metric-label">进程</span>
              <span class="metric-value">${escapeHtml(pid)}</span>
            </div>
            <div class="metric">
              <span class="metric-label">启动时间</span>
              <span class="metric-value" title="${escapeAttr(startedAt)}">${escapeHtml(startedAt)}</span>
            </div>
            <div class="metric">
              <span class="metric-label">健康状态</span>
              <span class="metric-value">${escapeHtml(healthSummary)}</span>
            </div>
            <div class="metric">
              <span class="metric-label">最近启动</span>
              <span class="metric-value" title="${escapeAttr(lastRecordText)}">${escapeHtml(lastRecordText)}</span>
            </div>
          </div>

          ${buildProcessMiniCard(module, diagnostics)}

          <div class="module-actions">
            ${buildActionButtons(module)}
          </div>
        </article>
      `;
    }

    function buildActionButtons(module) {
      const id = jsString(module.id);
      const name = jsString(module.name);
      const runtimeState = module.runtimeState || null;
      const startLabel = module.startReadiness?.actionLabel || '启动';
      const loadingAction = moduleActionLoading[module.id] || '';
      const busy = isModuleBusy(module) || Boolean(loadingAction);
      const busyLabel = runtimeState?.summary || (loadingAction === 'stop' ? '停止中...' : '处理中...');
      const controls = module.status === 'running'
        ? `
          <button class="btn btn-error" type="button" ${busy ? 'disabled' : ''} onclick="stopModule('${id}')">${loadingAction === 'stop' ? `${icon('progress_activity')}<span>停止中...</span>` : `${icon('stop_circle')}<span>停止</span>`}</button>
          <button class="btn btn-tonal" type="button" ${busy ? 'disabled' : ''} onclick="restartModule('${id}')">${loadingAction === 'restart' ? `${icon('progress_activity')}<span>重启中...</span>` : `${icon('restart_alt')}<span>重启</span>`}</button>
        `
        : `<button class="btn btn-filled" type="button" ${busy ? 'disabled' : ''} onclick="startModule('${id}')">${busy ? `${icon('progress_activity')}<span>${escapeHtml(busyLabel)}</span>` : `${icon('play_circle')}<span>${escapeHtml(startLabel)}</span>`}</button>`;

      const openButton = module.webUrl
        ? `<button class="btn btn-tertiary" type="button" onclick="openModuleUrl('${id}', '${jsString(module.webUrl)}')">${icon('open_in_new')}<span>打开</span></button>`
        : '';

      const updateButton = module.updateable
        ? `<button class="btn btn-outlined" id="update-btn-${escapeAttr(module.id)}" type="button" onclick="checkAndUpdate('${id}')">${icon('system_update_alt')}<span>检查更新</span></button>`
        : '';

      return `
        ${controls}
        ${openButton}
        <button class="btn btn-text" type="button" onclick="showLogs('${id}', '${name}')">${icon('article')}<span>${runtimeState?.phase === 'failed' ? '查看失败日志' : '日志'}</span></button>
        ${updateButton}
      `;
    }

    function buildProcessMiniCard(module, diagnostics) {
      const id = jsString(module.id);
      const loading = diagnosticsLoadingByModule[module.id] === true;
      const forcing = forceCloseLoadingByModule[module.id] === true;
      const collapsed = uiPrefs.collapseProcessMini === true;
      const checkedAt = diagnostics?.checkedAt ? formatStartedAt(diagnostics.checkedAt) : '未检查';
      const pidStatus = diagnostics?.pidFromStatus ?? module.pid ?? null;
      const pidFile = diagnostics?.pidFromPidFile ?? null;
      const portValue = diagnostics?.port ?? parsePort(module.webUrl) ?? null;
      const portText = portValue ? String(portValue) : '未配置';
      const portOccupied = diagnostics?.portOccupied === true;
      const listenerText = formatListenerSummary(diagnostics?.portListeners || []);
      const pidCandidatesText = formatPidCandidatesSummary(diagnostics?.pidCandidates || []);
      const runBadge = module.status === 'running' ? '运行中' : '已停止';
      const runBadgeClass = module.status === 'running' ? 'running' : 'error';
      const portBadgeClass = portValue ? (portOccupied ? 'warn' : 'running') : '';
      const portBadgeText = portValue ? (portOccupied ? '端口占用' : '端口空闲') : '无端口';

      return `
        <section class="process-mini glass-panel ${collapsed ? 'collapsed' : ''}">
          <div class="process-mini-head">
            <span class="process-mini-title">进程检查</span>
            <span class="process-mini-time">${escapeHtml(checkedAt)}</span>
          </div>
          <div class="process-badges">
            <span class="proc-badge ${runBadgeClass}">${escapeHtml(runBadge)}</span>
            <span class="proc-badge ${portBadgeClass}">${escapeHtml(portBadgeText)}</span>
          </div>
          <div class="process-kv">
            <div class="process-kv-row">
              <span class="process-kv-key">PID：</span>
              <span class="process-kv-value">${escapeHtml(pidStatus ? String(pidStatus) : '无')} / 文件 ${escapeHtml(pidFile ? String(pidFile) : '无')}</span>
            </div>
            <div class="process-kv-row">
              <span class="process-kv-key">端口：</span>
              <span class="process-kv-value">${escapeHtml(portText)}</span>
            </div>
            <div class="process-kv-row">
              <span class="process-kv-key">占用进程：</span>
              <span class="process-kv-value">${escapeHtml(listenerText)}</span>
            </div>
            <div class="process-kv-row">
              <span class="process-kv-key">候选进程：</span>
              <span class="process-kv-value">${escapeHtml(pidCandidatesText)}</span>
            </div>
          </div>
          <div class="process-mini-actions">
            <button
              class="btn btn-outlined btn-sm"
              type="button"
              ${loading || forcing ? 'disabled' : ''}
              onclick="checkModuleDiagnostics('${id}')"
            >${loading ? `${icon('progress_activity')}<span>检查中...</span>` : `${icon('refresh')}<span>检查状态</span>`}</button>
            <button
              class="btn btn-error btn-sm"
              type="button"
              ${forcing || loading ? 'disabled' : ''}
              onclick="forceCloseModule('${id}')"
            >${forcing ? `${icon('progress_activity')}<span>处理中...</span>` : `${icon('stop_circle')}<span>强制关闭</span>`}</button>
          </div>
        </section>
      `;
    }

    function parsePort(urlValue) {
      return window.HubKitDiagnostics.parsePort(urlValue);
    }

    function trimCommand(command) {
      return window.HubKitFormatters.trimCommand(command);
    }

    function formatListenerSummary(listeners) {
      return window.HubKitFormatters.formatListenerSummary(listeners);
    }

    function formatPidCandidatesSummary(candidates) {
      return window.HubKitFormatters.formatPidCandidatesSummary(candidates);
    }

    function buildBasicDiagnostics(module) {
      const pid = module?.pid ?? null;
      const port = parsePort(module?.webUrl) ?? null;
      const alive = module?.status === 'running' && pid;
      return {
        pidFromStatus: pid,
        pidFromPidFile: null,
        pidCandidates: pid ? [{ pid, command: 'unknown', alive: Boolean(alive) }] : [],
        port,
        portOccupied: Boolean(module?.status === 'running' && port),
        portListeners: [],
        checkedAt: new Date().toISOString(),
      };
    }

    async function checkModuleDiagnostics(moduleId) {
      diagnosticsLoadingByModule[moduleId] = true;
      renderDashboard();
      try {
        if (window.HubKitApi?.getModuleDiagnostics) {
          const result = await window.HubKitApi.getModuleDiagnostics(moduleId);
          if (result.unsupported) {
            const module = modules.find(item => item.id === moduleId);
            diagnosticsByModule[moduleId] = buildBasicDiagnostics(module);
            showToast('当前服务版本不支持进程诊断，已降级为基础检查。请重启 2281 服务更新后端。', 'error');
            return;
          }
          diagnosticsByModule[moduleId] = result.diagnostics || null;
          showToast('进程状态已更新');
          return;
        }

        const response = await fetch(`/api/modules/${encodeURIComponent(moduleId)}/diagnostics`);
        const isJson = String(response.headers.get('content-type') || '').includes('application/json');
        const json = isJson ? await response.json().catch(() => ({})) : {};

        if (response.status === 404) {
          const module = modules.find(item => item.id === moduleId);
          diagnosticsByModule[moduleId] = buildBasicDiagnostics(module);
          showToast('当前服务版本不支持进程诊断，已降级为基础检查。请重启 2281 服务更新后端。', 'error');
          return;
        }

        if (!response.ok || json.success === false) {
          throw new Error(json.error || `检查失败（HTTP ${response.status}）`);
        }
        diagnosticsByModule[moduleId] = json.data?.diagnostics || null;
        showToast('进程状态已更新');
      } catch (error) {
        console.error('Failed to fetch diagnostics:', error);
        showToast(error.message || '检查失败', 'error');
      } finally {
        diagnosticsLoadingByModule[moduleId] = false;
        renderDashboard();
      }
    }

    async function forceCloseModule(moduleId) {
      const module = modules.find(item => item.id === moduleId);
      const moduleName = module?.name || moduleId;
      if (!confirmHighRiskAction({
        title: `强制关闭 ${moduleName}`,
        impact: [
          '会停止模块进程。',
          '会尝试清理占用模块端口的残留进程。',
        ],
        recovery: '可在清理后重新启动模块；最近日志仍可用于排查。',
        confirmLabel: '强制关闭',
      })) return;

      forceCloseLoadingByModule[moduleId] = true;
      renderDashboard();
      try {
        const json = window.HubKitApi?.forceCloseModule
          ? await window.HubKitApi.forceCloseModule(moduleId, await highRiskHeaders(`module:${moduleId}:force-close`))
          : await (async () => {
            const response = await fetch(`/api/modules/${encodeURIComponent(moduleId)}/force-close`, {
              method: 'POST',
              headers: await highRiskHeaders(`module:${moduleId}:force-close`),
            });
            const fallbackJson = await response.json().catch(() => ({}));
            if (!response.ok) {
              throw new Error(fallbackJson.error || '强制关闭失败');
            }
            return fallbackJson;
          })();
        if (json.data?.after) {
          diagnosticsByModule[moduleId] = json.data.after;
        }
        if (json.success === false) {
          showToast(json.message || '强制关闭执行完成，但仍有残留进程', 'error');
        } else {
          showToast(json.message || '强制关闭成功');
        }
        fetchModules();
      } catch (error) {
        console.error('Failed to force close module:', error);
        showToast(error.message || '强制关闭失败', 'error');
      } finally {
        forceCloseLoadingByModule[moduleId] = false;
        renderDashboard();
      }
    }

    async function forceCloseAllModules() {
      if (forceCloseAllLoading) return;
      const runningCount = modules.filter(item => item.status === 'running').length;
      if (!confirmHighRiskAction({
        title: runningCount > 0 ? '强制关停全部模块' : '全量残留清理',
        impact: runningCount > 0
          ? [
              `当前运行中 ${runningCount} 个模块会被停止。`,
              '会逐个执行残留端口清理。',
            ]
          : ['当前无运行模块，会执行一次残留端口清理。'],
        recovery: '可在清理完成后按需重新启动模块。',
        confirmLabel: runningCount > 0 ? '关停全部模块' : '执行清理',
      })) return;

      forceCloseAllLoading = true;
      renderDashboard();
      try {
        const json = window.HubKitApi?.forceCloseAllModules
          ? await window.HubKitApi.forceCloseAllModules(await highRiskHeaders('module:*:force-close-all'))
          : await (async () => {
            const response = await fetch('/api/modules/force-close-all', {
              method: 'POST',
              headers: await highRiskHeaders('module:*:force-close-all'),
            });
            const fallbackJson = await response.json().catch(() => ({}));
            if (!response.ok) {
              throw new Error(fallbackJson.error || '全部关停失败');
            }
            return fallbackJson;
          })();

        const failedCount = Number(json?.data?.failedCount || 0);
        const total = Number(json?.data?.total || 0);
        if (failedCount > 0) {
          showToast(json.message || `全部关停已执行，但 ${failedCount}/${total} 仍有残留`, 'error');
        } else {
          showToast(json.message || `全部关停完成，已清理 ${total} 个模块`);
        }

        const results = Array.isArray(json?.data?.results) ? json.data.results : [];
        results.forEach((result) => {
          if (result?.moduleId && result?.after) {
            diagnosticsByModule[result.moduleId] = result.after;
          }
        });
        await fetchModules();
      } catch (error) {
        console.error('Failed to force close all modules:', error);
        showToast(error.message || '全部关停失败', 'error');
      } finally {
        forceCloseAllLoading = false;
        renderDashboard();
      }
    }

    function openModuleUrl(moduleId, url) {
      window.open(url, '_blank', 'noopener,noreferrer');
    }

    async function checkAndUpdate(moduleId) {
      const btn = document.getElementById(`update-btn-${moduleId}`);
      setButtonBusy(btn, '检查中...');

      try {
        const json = window.HubKitApi?.checkModuleUpdate
          ? await window.HubKitApi.checkModuleUpdate(moduleId)
          : await (async () => {
            const res = await fetch(`/api/modules/${encodeURIComponent(moduleId)}/update-check`);
            return await res.json();
          })();
        resetUpdateButton(btn, moduleId);

        if (!json.success) {
          showToast(json.error || '检查失败', 'error');
          return;
        }

        if (json.hasUpdates) {
          btn.className = 'btn btn-warning';
          btn.innerHTML = `${icon('download')}<span>更新 ${json.commitsBehind || ''}</span>`;
          btn.onclick = () => performUpdate(moduleId);
          showToast(json.message || '发现可用更新');
        } else {
          showToast('已是最新版本');
        }
      } catch (error) {
        resetUpdateButton(btn, moduleId);
        showToast('检查失败', 'error');
      }
    }

    async function performUpdate(moduleId) {
      const btn = document.getElementById(`update-btn-${moduleId}`);
      const module = modules.find((item) => item.id === moduleId);
      if (!confirmHighRiskAction({
        title: `更新模块：${module?.name || moduleId}`,
        impact: [
          '会在模块目录执行 git pull。',
          '如果模块包含 package.json，还会执行 npm install。',
        ],
        recovery: '可根据模块仓库历史回退；更新前请确认当前模块没有未保存的本地修改。',
        confirmLabel: '继续更新',
      })) {
        resetUpdateButton(btn, moduleId);
        return;
      }
      setButtonBusy(btn, '更新中...');

      try {
        const json = window.HubKitApi?.updateModule
          ? await window.HubKitApi.updateModule(moduleId, await highRiskHeaders(`module:${moduleId}:update`))
          : await (async () => {
            const res = await fetch(`/api/modules/${encodeURIComponent(moduleId)}/update`, {
              method: 'POST',
              headers: await highRiskHeaders(`module:${moduleId}:update`),
            });
            return await res.json();
          })();
        resetUpdateButton(btn, moduleId);

        if (json.success) {
          showToast(json.message || '更新完成');
          fetchModules();
        } else {
          showToast(json.error || '更新失败', 'error');
        }
      } catch (error) {
        resetUpdateButton(btn, moduleId);
        showToast('更新失败', 'error');
      }
    }

    function setButtonBusy(btn, label) {
      if (!btn) return;
      btn.disabled = true;
      btn.innerHTML = `${icon('progress_activity')}<span>${escapeHtml(label)}</span>`;
    }

    function resetUpdateButton(btn, moduleId) {
      if (!btn) return;
      btn.disabled = false;
      btn.className = 'btn btn-outlined';
      btn.innerHTML = `${icon('system_update_alt')}<span>检查更新</span>`;
      btn.onclick = () => checkAndUpdate(moduleId);
    }

    function getStatusClass(status) {
      return window.HubKitFormatters.getStatusClass(status);
    }

    function getStatusText(status) {
      return window.HubKitFormatters.getStatusText(status);
    }

    function getEffectiveStatus(module) {
      return window.HubKitFormatters.getEffectiveStatus(module);
    }

    function isModuleBusy(module) {
      const phase = module?.runtimeState?.phase;
      return phase === 'preparing' || phase === 'installing' || phase === 'starting' || phase === 'health_checking';
    }

    function formatLastStartRecord(record) {
      return window.HubKitFormatters.formatLastStartRecord(record);
    }

    function getRuntimePhaseText(phase) {
      return window.HubKitFormatters.getRuntimePhaseText(phase);
    }

    function getAuditSeverityText(severity) {
      return window.HubKitFormatters.getAuditSeverityText(severity);
    }

    function getTypeText(type) {
      return window.HubKitFormatters.getTypeText(type);
    }

    function formatUptime(seconds) {
      return window.HubKitFormatters.formatUptime(seconds);
    }

    function formatStartedAt(value) {
      return window.HubKitFormatters.formatStartedAt(value);
    }

    function formatFileSize(bytes) {
      return window.HubKitFormatters.formatFileSize(bytes);
    }

    function showView(view) {
      currentView = view;
      document.getElementById('dashboardView').style.display = view === 'dashboard' ? 'block' : 'none';
      document.getElementById('diagnosticsView').style.display = view === 'diagnostics' ? 'block' : 'none';
      document.getElementById('settingsView').style.display = view === 'settings' ? 'block' : 'none';
      document.getElementById('pageSubtitle').textContent = view === 'dashboard'
        ? '个人自动化中控台'
        : view === 'diagnostics'
          ? '模块体检与诊断'
          : '模块偏好与调度';
      document.querySelectorAll('.nav-btn').forEach(btn => {
        btn.classList.toggle('active', btn.dataset.view === view);
      });
      if (view === 'settings') {
        renderSettings();
        fetchConfigBackups();
        const hash = String(window.location.hash || '');
        if (hash.startsWith('#settings-panel-')) {
          const panelId = hash.slice('#settings-panel-'.length);
          if (panelId) {
            requestAnimationFrame(() => focusSettingsPanel(panelId));
          }
        }
      }
      if (view === 'diagnostics') renderDiagnostics();
    }

    function isSettingsInteractionActive() {
      if (currentView !== 'settings') return false;
      const active = document.activeElement;
      return settingsDirty || Boolean(active && active.closest && active.closest('#settingsView'));
    }

    function requestSettingsRender({ force = false } = {}) {
      if (currentView !== 'settings') return;
      if (!force && isSettingsInteractionActive()) {
        updateSettingsSaveState();
        return;
      }
      renderSettings();
    }

    function renderSettings() {
      const container = document.getElementById('settingsContent');
      const orderedModules = getOrderedModules();
      const webUrlModules = modules.filter(m => m.webUrl !== undefined || m.webPort);
      const groups = Array.isArray(settings.groups) && settings.groups.length > 0
        ? settings.groups
        : [{ id: 'default', name: '默认分组' }];
      const overview = getSettingsOverview(orderedModules, groups, webUrlModules);

      container.innerHTML = `
        <section class="settings-hero glass-panel">
          <div class="settings-hero-copy">
            <h2 class="settings-section-title" id="settingsTitle">设置</h2>
            <p class="settings-section-desc">面向日常重度使用的控制台配置：先看运行态势，再调整启动、分组、入口、定时和本地显示。</p>
            <div class="inline-actions">
              <span class="settings-status-chip ${settingsDirty ? 'dirty' : ''}" id="settingsDirtyChip">${settingsDirty ? '有未保存运行配置' : '运行配置已同步'}</span>
              <span class="settings-save-note">“需保存”的面板会写入 HubKit 配置；“即时生效”的单项会直接调用后端接口。</span>
            </div>
          </div>
          <div class="settings-hero-actions">
            <button class="btn btn-filled" id="settingsSaveButton" type="button" ${settingsDirty ? '' : 'disabled'} onclick="saveSettings()">${icon('save')}<span>保存运行配置</span></button>
            <button class="btn btn-tonal" type="button" onclick="resetSettings()">${icon('undo')}<span>放弃未保存</span></button>
          </div>
        </section>

        <section class="settings-overview-grid" aria-label="设置概览">
          ${overview.map(createSettingsOverviewCard).join('')}
        </section>

        <div class="settings-layout">
          <nav class="settings-nav" aria-label="设置分区">
            ${createSettingsNavLink('operations', 'tune', '运行控制')}
            ${createSettingsNavLink('grouping', 'dashboard', '模块分组与工作区')}
            ${createSettingsNavLink('startPolicy', 'auto_mode', '启动策略')}

    function renderSettingsPanel(panelId, title, description, meta, content) {
      const openAttr = settingsPanels[panelId] === false ? '' : 'open';
      return `
        <details class="settings-panel glass-panel" id="settings-panel-${escapeAttr(panelId)}" data-settings-panel="${panelId}" ${openAttr}>
          <summary class="settings-panel-summary">
            <div class="section-heading">
              <div>
                <h3 class="settings-section-title">${escapeHtml(title)}</h3>
                <p class="settings-section-desc">${escapeHtml(description)}</p>
              </div>
              <div class="settings-panel-meta">
                ${meta || ''}
                <span class="panel-chevron" aria-hidden="true">${icon('expand_more')}</span>
              </div>
            </div>
          </summary>
          <div class="settings-panel-content">
            ${content}
          </div>
        </details>
      `;
    }

    function createPanelMeta(items) {
      return items.map((item) => `
        <span class="settings-panel-chip ${escapeAttr(item.tone || '')}">${escapeHtml(item.label)}</span>
      `).join('');
    }

    function createSettingsNavLink(panelId, iconName, label) {
      return `
        <a class="settings-nav-link" href="#settings-panel-${escapeAttr(panelId)}" onclick="focusSettingsPanel('${jsString(panelId)}'); return false;">

      `;
    }

    function initSettingsPanels() {
      const panels = document.querySelectorAll('[data-settings-panel]');
      panels.forEach((panel) => {
        const panelId = panel.dataset.settingsPanel;
        panel.addEventListener('toggle', () => {
          settingsPanels[panelId] = panel.open;
        });
      });
    }

    function scrollToSettingsPanel(panelEl) {
      const offset = window.innerWidth <= 760 ? 86 : 104;
      const top = window.scrollY + panelEl.getBoundingClientRect().top - offset;
      window.scrollTo({
        top: Math.max(0, top),
        behavior: 'smooth',
      });
    }

    function updateSettingsPanelHash(panelId) {
      const hash = `#settings-panel-${panelId}`;
      if (window.location.hash === hash) return;
      if (window.history && typeof window.history.replaceState === 'function') {
        window.history.replaceState(null, '', hash);
        return;
      }
      window.location.hash = hash;
    }

    function focusSettingsPanel(panelId) {
      if (currentView !== 'settings') return;
      const panel = document.getElementById(`settings-panel-${panelId}`);
      if (!panel) return;
      if (!panel.open) {
        panel.open = true;
        settingsPanels[panelId] = true;
      }
      updateSettingsPanelHash(panelId);
      const summary = panel.querySelector('.settings-panel-summary');
      requestAnimationFrame(() => {
        scrollToSettingsPanel(summary || panel);
      });
    }

    function emptySettings(text) {
      return `<div class="empty-state">${escapeHtml(text)}</div>`;
    }

              </button>
            </div>
          </div>
        </div>
        <div class="settings-item" style="grid-template-columns: minmax(0, 1fr); align-items: start;">
          <div class="settings-item-info" style="display: grid; gap: 12px;">
            <div class="inline-actions" style="justify-content: space-between;">
              <div class="settings-item-info">
                <span class="settings-item-name">HubKit 配置备份</span>
                <span class="settings-item-id">恢复模块目录、分组、自启顺序、启动策略和定时任务；恢复前会先备份当前配置</span>
              </div>
              <button class="btn btn-outlined btn-sm" type="button" onclick="fetchConfigBackups(true)">
                ${icon('refresh')}
                <span>刷新备份</span>
              </button>
            </div>
            <div class="settings-list">
              ${createConfigBackupSettingsList()}
            </div>
          </div>
        </div>
      `;
    }

    function createConfigBackupSettingsList() {
      if (configBackupsLoading && configBackups.length === 0) {
        return emptySettings('正在加载配置备份...');
      }
      if (configBackups.length === 0) {
        return emptySettings('暂无可恢复的配置备份；保存设置或修改模块目录后会自动生成。');
      }
      return configBackups.map(createConfigBackupSettingsItem).join('');
    }

    function createConfigBackupSettingsItem(backup) {
      const createdAt = formatStartedAt(backup.createdAt);
      const summary = [
        `${backup.moduleDirCount || 0} 个模块目录`,
        `${backup.groupCount || 0} 个工作区`,
        `${backup.autoStartCount || 0} 个自启`,
        `${backup.scheduleCount || 0} 个定时`,
        formatFileSize(backup.sizeBytes),
      ].join(' · ');
      return `
        <div class="settings-item">
          <div class="settings-item-info">
            <span class="settings-item-name">${escapeHtml(createdAt)}</span>
            <span class="settings-item-id">${escapeHtml(summary)}</span>
            <span class="settings-item-id mono">${escapeHtml(backup.id)}</span>
          </div>
          <div class="settings-controls">
            <button class="btn btn-error btn-sm" type="button" onclick="restoreConfigBackup('${jsString(backup.id)}')">
              ${icon('undo')}
              <span>恢复</span>
            </button>
          </div>
        </div>
      `;
    }

    function createGroupingSettings(groups, orderedModules) {
      const scriptGroupItems = getScriptDashboardSections();
      return `
        <div class="settings-item" style="grid-template-columns: minmax(0, 1fr); align-items: start;">
          <div class="settings-item-info" style="display: grid; gap: 12px;">
            <div class="inline-actions">
              <span class="settings-item-name">模块分组</span>
              <button class="btn btn-tonal btn-sm" type="button" onclick="addDashboardGroup()">${icon('save')}<span>新增分组</span></button>
            </div>
            <span class="settings-item-id">控制 Dashboard 模块卡片归属和分组启动策略模板。</span>
            <div class="settings-list">
              ${groups.map((group) => createGroupEditorItem(group, orderedModules)).join('')}
            </div>
            ${scriptGroupItems.length > 0 ? `
              <div class="inline-actions">
                <span class="settings-item-name">脚本分组</span>
                <span class="settings-item-id">固定来源，仅控制折叠状态</span>
              </div>
              <div class="settings-list">
                ${scriptGroupItems.map(createScriptGroupSettingsItem).join('')}
              </div>
            ` : ''}
          </div>
        </div>
        ${createWorkspaceSettings(orderedModules)}
      `;
    }

    function createWorkspaceSettings(orderedModules) {
      const workspaceSettings = buildWorkspaceSettingsViewModel(getEditableWorkspaces());
      return `
        <div class="settings-item" style="grid-template-columns: minmax(0, 1fr); align-items: start;">
          <div class="settings-item-info" style="display: grid; gap: 12px;">
            <div class="inline-actions">
              <span class="settings-item-name">工作区编排</span>
              <button class="btn btn-tonal btn-sm" type="button" onclick="addWorkspace()">${icon('save')}<span>新增工作区</span></button>
            </div>
            <span class="settings-item-id">按场景选择模块，一键启动或停止；启动顺序暂按勾选顺序执行，停止时默认反向执行。</span>
            <div class="settings-list">
              ${workspaceSettings.hasWorkspaces
                ? workspaceSettings.items.map((workspace) => createWorkspaceEditorItem(workspace, orderedModules)).join('')
                : emptySettings(workspaceSettings.emptyText)}
            </div>
          </div>
        </div>
      `;
    }

    function createWorkspaceEditorItem(workspace, orderedModules) {
      const workspaceEditor = buildWorkspaceEditorViewModel(workspace);
      const workspaceEditorModules = buildWorkspaceEditorModulesViewModel(orderedModules);
      return `
        <div class="settings-item" style="grid-template-columns: minmax(0, 1fr); align-items: start;">
          <div class="settings-item-info" style="display: grid; gap: 12px;">
            <div style="display: flex; align-items: start; justify-content: space-between; gap: 14px; flex-wrap: wrap;">
              <div style="display: grid; gap: 4px; min-width: 0;">
                <span class="settings-item-name">${escapeHtml(workspaceEditor.title)}</span>
                <span class="settings-item-id">${escapeHtml(workspaceEditor.id)} · ${workspaceEditor.selectedCount} 个模块</span>
              </div>
              <div class="settings-controls" style="width: min(100%, 620px); justify-content: stretch;">
                <div class="text-field" style="min-width: 0; flex: 1 1 160px;">
                  <label for="${escapeAttr(workspaceEditor.nameInputId)}">名称</label>
                  <input
                    class="input"
                    id="${escapeAttr(workspaceEditor.nameInputId)}"
                    type="text"
                    value="${escapeAttr(workspaceEditor.nameValue)}"
                    oninput="updateWorkspaceField('${jsString(workspace.id)}', 'name', this.value)"
                  >
                </div>
                <div class="text-field" style="min-width: 0; flex: 1 1 220px;">
                  <label for="${escapeAttr(workspaceEditor.descriptionInputId)}">说明</label>
                  <input
                    class="input"
                    id="${escapeAttr(workspaceEditor.descriptionInputId)}"
                    type="text"
                    value="${escapeAttr(workspaceEditor.descriptionValue)}"
                    placeholder="例如：开发环境、本机维护"
                    oninput="updateWorkspaceField('${jsString(workspace.id)}', 'description', this.value)"
                  >
                </div>
                <div class="text-field select-field" style="min-width: 0; flex: 1 1 160px;">
                  <label for="${escapeAttr(workspaceEditor.policySelectId)}">失败策略</label>
                  <select class="select" id="${escapeAttr(workspaceEditor.policySelectId)}" onchange="updateWorkspaceFailurePolicy('${jsString(workspace.id)}', this.value)">
                    <option value="stop" ${workspaceEditor.isStopSelected ? 'selected' : ''}>失败后中断</option>
                    <option value="continue" ${workspaceEditor.isContinueSelected ? 'selected' : ''}>失败后继续</option>
                  </select>
                </div>
                <button class="btn btn-text btn-sm" type="button" onclick="removeWorkspace('${jsString(workspace.id)}')">${icon('close')}<span>删除</span></button>
              </div>
            </div>
            <div class="settings-list">
              ${workspaceEditorModules.hasModules
                ? workspaceEditorModules.items.map((module) => createWorkspaceModuleToggle(workspace, module)).join('')
                : emptySettings(workspaceEditorModules.emptyText)}
            </div>
          </div>
        </div>
      `;
    }

    function createWorkspaceModuleToggle(workspace, module) {
      const moduleToggle = buildWorkspaceModuleToggleViewModel(workspace, module);
      return `
        <div class="settings-item">
          <div class="settings-item-info">
            <span class="settings-item-name">${escapeHtml(moduleToggle.moduleName)}</span>
            <span class="settings-item-id">${escapeHtml(moduleToggle.moduleId)}</span>
          </div>
          <div class="settings-controls">
            <label class="switch" title="加入当前工作区">
              <input type="checkbox" ${moduleToggle.checked ? 'checked' : ''} onchange="toggleWorkspaceModule('${jsString(moduleToggle.workspaceId)}', '${jsString(moduleToggle.moduleId)}', this.checked)">
              <span class="switch-track"></span>
            </label>
          </div>
        </div>
      `;
    }

    function createScriptGroupSettingsItem(section) {
      return `
        <div class="settings-item">
          <div class="settings-item-info">
            <span class="settings-item-name">${escapeHtml(section.name)}</span>
            <span class="settings-item-id">${escapeHtml(section.id)} · ${section.items.length} 张卡片</span>
          </div>
          <div class="settings-controls">
            <label class="switch" title="默认折叠该分组">
              <input type="checkbox" ${isDashboardGroupCollapsed(section.id) ? 'checked' : ''} onchange="setSingleDashboardGroupCollapsed('${jsString(section.id)}', this.checked)">
              <span class="switch-track"></span>
            </label>
          </div>
        </div>
      `;
    }

    function createGroupEditorItem(group, orderedModules) {
      const locked = group.id === 'default';
      const sectionId = `group-${group.id}`;
      const assignedModules = orderedModules.filter((module) => getModuleGroupId(module) === group.id);
      const selectedTemplate = settings.groupStartPolicyTemplates?.[group.id] || 'balanced';
      return `
        <div class="settings-item" style="grid-template-columns: minmax(0, 1fr); align-items: start;">
          <div class="settings-item-info" style="display: grid; gap: 12px;">
            <div style="display: flex; align-items: start; justify-content: space-between; gap: 14px; flex-wrap: wrap;">
              <div style="display: grid; gap: 4px; min-width: 0;">
                <span class="settings-item-name">${escapeHtml(group.name)}</span>
                <span class="settings-item-id">${escapeHtml(group.id)} · ${assignedModules.length} 张卡片</span>
              </div>
              <div class="settings-controls" style="width: min(100%, 520px); justify-content: stretch;">
                <div class="text-field" style="min-width: 0; flex: 1 1 180px;">
                  <label for="group-name-${escapeAttr(group.id)}">名称</label>
                  <input
                    class="input"
                    id="group-name-${escapeAttr(group.id)}"
                    type="text"
                    value="${escapeAttr(group.name)}"
                    ${locked ? 'disabled' : ''}
                    oninput="renameDashboardGroup('${jsString(group.id)}', this.value)"
                  >
                </div>
                <div class="text-field select-field" style="min-width: 0; flex: 1 1 180px;">
                  <label for="group-template-${escapeAttr(group.id)}">启动模板</label>
                  <select class="select" id="group-template-${escapeAttr(group.id)}" onchange="updateGroupStartPolicyTemplate('${jsString(group.id)}', this.value)">
                    ${startPolicyTemplates.map((template) => `
                      <option value="${escapeAttr(template.id)}" ${selectedTemplate === template.id ? 'selected' : ''}>${escapeHtml(template.name)}</option>
                    `).join('')}
                  </select>
                </div>
                <label class="switch" title="默认折叠该分组">
                  <input type="checkbox" ${isDashboardGroupCollapsed(sectionId) ? 'checked' : ''} onchange="setSingleDashboardGroupCollapsed('${jsString(sectionId)}', this.checked)">
                  <span class="switch-track"></span>
                </label>
                ${locked ? '' : `<button class="btn btn-text btn-sm" type="button" onclick="removeDashboardGroup('${jsString(group.id)}')">${icon('close')}<span>移除</span></button>`}
              </div>
            </div>
            <div class="settings-list">
              ${orderedModules.map((module) => createGroupModuleToggle(group, module)).join('')}
            </div>
          </div>
        </div>
      `;
    }

    function createGroupModuleToggle(group, module) {
      const selected = getModuleGroupId(module);
      const checked = selected === group.id;
      return `
        <div class="settings-item">
          <div class="settings-item-info">
            <span class="settings-item-name">${escapeHtml(module.name)}</span>
            <span class="settings-item-id">${escapeHtml(module.id)}</span>
          </div>
          <div class="settings-controls">
            <label class="switch" title="加入当前分组">
              <input type="checkbox" ${checked ? 'checked' : ''} onchange="toggleGroupModule('${jsString(group.id)}', '${jsString(module.id)}', this.checked)">
              <span class="switch-track"></span>
            </label>
          </div>
        </div>
      `;
    }

    function createVisibilityItem(module) {
      const visible = module.visible !== false;
      return `
        <div class="settings-item">
          <div class="brand-mark" style="width: 40px; height: 40px; box-shadow: none;">${icon(visible ? 'visibility' : 'visibility_off')}</div>
          <div class="settings-item-info">
            <span class="settings-item-name">${escapeHtml(module.name)}</span>
            <span class="settings-item-id">${escapeHtml(module.id)}</span>
          </div>
          <div class="settings-controls">
            <label class="switch" title="显示卡片">
              <input type="checkbox" ${visible ? 'checked' : ''} onchange="setModuleVisibility('${jsString(module.id)}', this.checked)">
              <span class="switch-track"></span>
            </label>
          </div>
        </div>
      `;
    }

    function createWebUrlItem(module) {
      return `
        <div class="settings-item url-row">
          <div class="settings-item-info">
            <span class="settings-item-name">${escapeHtml(module.name)}</span>
            <span class="settings-item-id">${escapeHtml(module.id)}</span>
          </div>
          <div class="url-input-group">
            <div class="text-field">
              <label for="url-${escapeAttr(module.id)}">URL</label>
              <input class="input mono" type="url" id="url-${escapeAttr(module.id)}" value="${escapeAttr(module.webUrl || '')}" placeholder="http://localhost:5173">
            </div>
            <button class="btn btn-tonal btn-sm" type="button" onclick="saveModuleUrl('${jsString(module.id)}')">${icon('save')}<span>保存</span></button>
          </div>
        </div>
      `;
    }

    function createScheduleItem(module) {
      const schedule = module.schedule || settings.schedules[module.id] || {};
      const scheduleStatus = module.scheduleStatus || {};
      const enabled = schedule.enabled === true;
      const days = Array.isArray(schedule.daysOfWeek) ? schedule.daysOfWeek : [];
      return `
        <div class="settings-item schedule-row">
          <label class="switch" title="启用定时任务">
            <input type="checkbox" ${enabled ? 'checked' : ''} id="schedule-enabled-${escapeAttr(module.id)}">
            <span class="switch-track"></span>
          </label>
          <div class="settings-item-info">
            <span class="settings-item-name">${escapeHtml(module.name)}</span>
            <span class="settings-item-id">${escapeHtml(module.id)}</span>
            <span class="settings-item-id">${escapeHtml(formatScheduleStatus(scheduleStatus, enabled))}</span>
            <div class="schedule-controls" style="margin-top: 10px;">
              <div class="text-field">
                <label for="schedule-start-${escapeAttr(module.id)}">启动</label>
                <input class="input" type="time" id="schedule-start-${escapeAttr(module.id)}" value="${escapeAttr(schedule.startTime || '')}">
              </div>
              <div class="text-field">
                <label for="schedule-stop-${escapeAttr(module.id)}">停止</label>
                <input class="input" type="time" id="schedule-stop-${escapeAttr(module.id)}" value="${escapeAttr(schedule.stopTime || '')}">
              </div>
              <button class="btn btn-tonal btn-sm" type="button" onclick="saveSchedule('${jsString(module.id)}')">${icon('event_available')}<span>保存</span></button>
              <div class="day-selector" aria-label="生效日期">
                ${dayLabels.map((label, day) => `
                  <label class="day-chip ${days.includes(day) ? 'checked' : ''}">
                    <input type="checkbox" name="schedule-days-${escapeAttr(module.id)}" value="${day}" ${days.includes(day) ? 'checked' : ''} onchange="this.closest('.day-chip').classList.toggle('checked', this.checked)">
                    周${label}
                  </label>
                `).join('')}
              </div>
            </div>
          </div>
        </div>
      `;
    }

    function formatScheduleStatus(scheduleStatus, enabled) {
      return window.HubKitFormatters.formatScheduleStatus(scheduleStatus, enabled);
    }

    function getModuleStartPolicySettings(module) {
      return window.HubKitSettings.getModuleStartPolicySettings(module, settings.startPolicies, defaultStartPolicy);
    }

    function getStartPolicyTemplateName(templateId) {
      const found = startPolicyTemplates.find((template) => template.id === templateId);
      return found?.name || '平衡型';
    }

    function updateStartPolicyBoolean(moduleId, key, value) {
      const current = {
        ...getModuleStartPolicySettings({ id: moduleId }),
      };
      settings.startPolicies = settings.startPolicies || {};
      settings.startPolicies[moduleId] = {
        ...current,
        [key]: value === true,
      };
      markSettingsDirty();
    }

    function updateStartPolicyNumber(moduleId, key, value) {
      const normalized = Number(value);
      if (!Number.isFinite(normalized)) return;
      const current = {
        ...getModuleStartPolicySettings({ id: moduleId }),
      };
      settings.startPolicies = settings.startPolicies || {};
      settings.startPolicies[moduleId] = {
        ...current,
        [key]: Math.round(normalized),
      };
      markSettingsDirty(false);
    }

    function resetModuleStartPolicy(moduleId) {
      if (!settings.startPolicies) return;
      delete settings.startPolicies[moduleId];
      markSettingsDirty(false);
      renderSettings();
    }

    function updateGroupStartPolicyTemplate(groupId, templateId) {
      settings.groupStartPolicyTemplates = settings.groupStartPolicyTemplates || {};
      settings.groupStartPolicyTemplates[groupId] = templateId || 'balanced';
      markSettingsDirty(false);
      renderSettings();
    }

    async function saveModuleUrl(moduleId) {
      const input = document.getElementById(`url-${moduleId}`);
      if (!input) return;
      const url = input.value.trim();
      if (!url) {
        showToast('请输入有效的 URL', 'error');
        return;
      }

      try {
        const json = window.HubKitApi?.saveModuleWebUrl
          ? await window.HubKitApi.saveModuleWebUrl(moduleId, url)
          : await (async () => {
            const res = await fetch(`/api/modules/${encodeURIComponent(moduleId)}/web-url`, {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({ url }),
            });
            return await res.json();
          })();
        if (json.success) {
          showToast('Web 地址已保存');
          const module = modules.find(m => m.id === moduleId);
          if (module) module.webUrl = url;
          renderDashboard();
        } else {
          showToast(json.error || '保存失败', 'error');
        }
      } catch (error) {
        showToast('保存失败', 'error');
      }
    }

    async function setModuleVisibility(moduleId, visible) {
      try {
        const json = window.HubKitApi?.setModuleVisibility
          ? await window.HubKitApi.setModuleVisibility(moduleId, visible)
          : await (async () => {
            const res = await fetch(`/api/modules/${encodeURIComponent(moduleId)}/visibility`, {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({ visible }),
            });
            return await res.json();
          })();
        if (!json.success) throw new Error(json.error || '保存失败');
        const module = modules.find(m => m.id === moduleId);
        if (module) module.visible = visible;
        showToast('显示状态已更新');
        renderDashboard();
      } catch (error) {
        showToast(error.message || '保存失败', 'error');
        fetchModules();
      }
    }

    async function saveSchedule(moduleId) {
      const enabled = document.getElementById(`schedule-enabled-${moduleId}`)?.checked === true;
      const startTime = document.getElementById(`schedule-start-${moduleId}`)?.value || '';
      const stopTime = document.getElementById(`schedule-stop-${moduleId}`)?.value || '';
      const daysOfWeek = [...document.querySelectorAll('input[name^="schedule-days-"]:checked')]
        .filter(input => input.name === `schedule-days-${moduleId}`)
        .map(input => Number(input.value));

      try {
        const payload = { enabled, startTime, stopTime, daysOfWeek };
        const json = window.HubKitApi?.saveModuleSchedule
          ? await window.HubKitApi.saveModuleSchedule(moduleId, payload)
          : await (async () => {
            const res = await fetch(`/api/modules/${encodeURIComponent(moduleId)}/schedule`, {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify(payload),
            });
            return await res.json();
          })();
        if (!json.success) throw new Error(json.error || '保存失败');
        settings.schedules[moduleId] = json.schedule;
        const module = modules.find(m => m.id === moduleId);
        if (module) {
          module.schedule = json.schedule;
          module.scheduleStatus = json.scheduleStatus;
        }
        showToast('定时任务已保存');
        if (currentView === 'settings') renderSettings();
      } catch (error) {
        showToast(error.message || '保存失败', 'error');
      }
    }

    function getOrderedModules() {
      return window.HubKitSettings.getOrderedModules(modules, settings.startOrder);
    }

    function toggleAutoStart(moduleId, enabled) {
      settings.autoStart[moduleId] = enabled;
      markSettingsDirty();
    }

    function ensureSettingsGroups() {
      if (!Array.isArray(settings.groups) || settings.groups.length === 0) {
        settings.groups = [{ id: 'default', name: '默认分组' }];
      }
      if (!settings.groups.find((group) => group.id === 'default')) {
        settings.groups.unshift({ id: 'default', name: '默认分组' });
      }
      settings.moduleGroups = settings.moduleGroups || {};
    }

    function addDashboardGroup() {
      ensureSettingsGroups();
      const id = `group-${Date.now().toString(36)}`;
      settings.groups.push({ id, name: '新分组' });
      markSettingsDirty(false);
      renderSettings();
    }

    function renameDashboardGroup(groupId, name) {
      ensureSettingsGroups();
      const target = settings.groups.find((group) => group.id === groupId);
      if (!target) return;
      target.name = String(name || '').trim() || '未命名分组';
      markSettingsDirty(false);
    }

    function removeDashboardGroup(groupId) {
      if (groupId === 'default') return;
      ensureSettingsGroups();
      settings.groups = settings.groups.filter((group) => group.id !== groupId);
      Object.keys(settings.moduleGroups).forEach((moduleId) => {
        if (settings.moduleGroups[moduleId] === groupId) {
          settings.moduleGroups[moduleId] = 'default';
        }
      });
      markSettingsDirty(false);
      renderSettings();
      renderDashboard();
    }

    function setModuleGroup(moduleId, groupId) {
      ensureSettingsGroups();
      settings.moduleGroups[moduleId] = groupId || 'default';
      const module = modules.find((item) => item.id === moduleId);
      if (module) module.groupId = settings.moduleGroups[moduleId];
      markSettingsDirty();
      renderDashboard();
    }

    function toggleGroupModule(groupId, moduleId, enabled) {
      ensureSettingsGroups();
      const targetGroupId = enabled ? groupId : 'default';
      settings.moduleGroups[moduleId] = targetGroupId;
      const module = modules.find((item) => item.id === moduleId);
      if (module) module.groupId = targetGroupId;
      markSettingsDirty(false);
      renderSettings();
      renderDashboard();
    }

    function ensureSettingsWorkspaces() {
      if (!Array.isArray(settings.workspaces)) {
        settings.workspaces = [];
      }
    }

    function getEditableWorkspaces() {
      ensureSettingsWorkspaces();
      return settings.workspaces;
    }

    function syncWorkspaceDraftsToDashboard() {
      workspaces = buildWorkspaceDashboardDrafts(getEditableWorkspaces());
    }

    function addWorkspace() {
      const id = generateWorkspaceId();
      getEditableWorkspaces().push(createWorkspaceDraft(id));
      syncWorkspaceDraftsToDashboard();
      markSettingsDirty(false);
      renderSettings();
      renderDashboard();
    }

    function updateWorkspaceField(workspaceId, field, value) {
      const workspace = getEditableWorkspaces().find((item) => item.id === workspaceId);
      const updated = updateWorkspaceMetadataField(workspace, field, value);
      if (!updated) return;
      Object.assign(workspace, updated);
      syncWorkspaceDraftsToDashboard();
      markSettingsDirty(false);
      renderDashboardGroups();
      updateSettingsSaveState();
    }

    function updateWorkspaceFailurePolicy(workspaceId, value) {
      const workspace = getEditableWorkspaces().find((item) => item.id === workspaceId);
      const updated = normalizeWorkspaceFailurePolicy(workspace, value);
      if (!updated) return;
      Object.assign(workspace, updated);
      syncWorkspaceDraftsToDashboard();
      markSettingsDirty(false);
      renderDashboardGroups();
    }

    function toggleWorkspaceModule(workspaceId, moduleId, enabled) {
      const workspace = getEditableWorkspaces().find((item) => item.id === workspaceId);
      if (!workspace) return;
      Object.assign(workspace, updateWorkspaceModuleSelection(workspace, moduleId, enabled));
      delete workspacePlansById[workspaceId];
      syncWorkspaceDraftsToDashboard();
      markSettingsDirty(false);
      renderSettings();
      renderDashboard();
    }

    function removeWorkspace(workspaceId) {
      ensureSettingsWorkspaces();
      settings.workspaces = removeWorkspaceDraft(settings.workspaces, workspaceId);
      delete workspacePlansById[workspaceId];
      delete workspaceActionLoading[workspaceId];
      delete workspacePlanLoading[workspaceId];
      syncWorkspaceDraftsToDashboard();
      markSettingsDirty(false);
      renderSettings();
      renderDashboard();
    }

    function resetSettings() {
      fetchSettings({ forceRender: true });
    }

    function initDragAndDrop() {
      const list = document.getElementById('autoStartList');
      if (!list) return;

      const items = list.querySelectorAll('.settings-item[draggable="true"]');
      items.forEach((item, index) => {
        item.addEventListener('dragstart', (event) => {
          dragSrcIndex = index;
          item.classList.add('dragging');
          event.dataTransfer.effectAllowed = 'move';
        });

        item.addEventListener('dragend', () => {
          item.classList.remove('dragging');
          list.querySelectorAll('.settings-item').forEach(row => row.classList.remove('drag-over'));
        });

        item.addEventListener('dragover', (event) => {
          event.preventDefault();
          event.dataTransfer.dropEffect = 'move';
          item.classList.add('drag-over');
        });

        item.addEventListener('dragleave', () => item.classList.remove('drag-over'));

        item.addEventListener('drop', (event) => {
          event.preventDefault();
          item.classList.remove('drag-over');
          const dropIndex = index;
          if (dragSrcIndex === dropIndex) return;

          const ordered = getOrderedModules();
          const [moved] = ordered.splice(dragSrcIndex, 1);
          ordered.splice(dropIndex, 0, moved);
          settings.startOrder = ordered.map(module => module.id);
          markSettingsDirty(false);
          renderSettings();
        });
      });
    }

    function markSettingsDirty(shouldRender = true) {
      settingsDirty = true;
      if (shouldRender && currentView === 'settings') {
        requestSettingsRender();
      } else {
        updateSettingsSaveState();
      }
    }

    function updateSettingsSaveState() {
      const chip = document.getElementById('settingsDirtyChip');
      if (chip) {
        chip.classList.toggle('dirty', settingsDirty);
        chip.textContent = settingsDirty ? '有未保存运行配置' : '运行配置已同步';
      }
      const button = document.getElementById('settingsSaveButton');
      if (button) {
        button.disabled = !settingsDirty;
      }
    }

    async function showLogs(moduleId, moduleName) {
      currentLogModuleId = moduleId;
      currentLogModuleName = moduleName;
      document.getElementById('logDialogTitle').textContent = moduleName;
      document.getElementById('logDialogSubtitle').textContent = '最近 200 行';
      document.getElementById('logFilter').value = '';
      document.getElementById('logLevelFilter').value = 'all';
      document.getElementById('logContent').textContent = '加载中...';
      document.getElementById('logDialog').classList.add('active');
      await refreshLogs();
      toggleLogTail();
    }

    async function showGlobalLogs() {
      currentLogModuleId = null;
      currentLogModuleName = '';
      currentLogTarget = { kind: 'global' };
      document.getElementById('logDialogTitle').textContent = '全局日志搜索';
      document.getElementById('logDialogSubtitle').textContent = '跨模块搜索最近日志';
      document.getElementById('logFilter').value = '';
      document.getElementById('logLevelFilter').value = 'all';
      document.getElementById('logTailToggle').checked = false;
      document.getElementById('logContent').textContent = '输入关键字或选择级别后刷新。';
      document.getElementById('logDialog').classList.add('active');
      await refreshLogs();
      toggleLogTail();
    }

    function closeLogDialog() {
      document.getElementById('logDialog').classList.remove('active');
      currentLogModuleId = null;
      currentLogTarget = null;
      clearInterval(logTailTimer);
      logTailTimer = null;
    }

    async function refreshLogs() {
      if (!currentLogModuleId && !currentLogTarget) return;
      const content = document.getElementById('logContent');
      const rawLogs = currentLogTarget?.kind === 'script'
        ? await fetchScriptLogs(currentLogTarget.bundleId, currentLogTarget.actionId)
        : currentLogTarget?.kind === 'system-action'
          ? await fetchSystemActionLogs(currentLogTarget.actionId)
        : currentLogTarget?.kind === 'global'
          ? await fetchGlobalLogs()
        : await fetchLogs(currentLogModuleId);
      content.innerHTML = currentLogTarget?.kind === 'global'
        ? renderGlobalLogSearchResults(rawLogs)
        : renderLogLines(rawLogs || '暂无日志');
      applyLogFilter();
      if (document.getElementById('logTailToggle').checked) {
        scrollLogsBottom();
      }
    }

    function renderLogLines(rawLogs) {
      return window.HubKitLogRenderer.renderLogLines(rawLogs);
    }

    function renderGlobalLogSearchResults(payload) {
      return window.HubKitLogRenderer.renderGlobalLogSearchResults(payload);
    }

    function applyLogFilter() {
      const term = document.getElementById('logFilter').value.trim().toLowerCase();
      const level = document.getElementById('logLevelFilter').value;
      const lines = document.querySelectorAll('#logContent .log-line');
      lines.forEach(line => {
        const visible = window.HubKitLogRenderer.shouldShowLogLine({
          text: line.textContent,
          lineLevel: line.dataset.level,
          term,
          selectedLevel: level,
        });
        line.classList.toggle('log-line-hidden', !visible);
      });
    }

    function toggleLogTail() {
      clearInterval(logTailTimer);
      logTailTimer = null;
      if ((currentLogModuleId || currentLogTarget) && document.getElementById('logTailToggle').checked) {
        logTailTimer = setInterval(refreshLogs, 5000);
      }
    }

    function scrollLogsBottom() {
      const body = document.getElementById('logBody');
      body.scrollTop = body.scrollHeight;
    }

    function hideToast() {
      const snackbar = document.getElementById('snackbar');
      snackbar.classList.remove('show');
    }

    function pauseToastTimer() {
      const snackbar = document.getElementById('snackbar');
      clearTimeout(snackbar.hideTimer);
    }

    function resumeToastTimer() {
      const snackbar = document.getElementById('snackbar');
      if (!snackbar.classList.contains('show')) return;
      clearTimeout(snackbar.hideTimer);
      snackbar.hideTimer = setTimeout(() => {
        hideToast();
      }, 3000);
    }

    async function copyToastMessage() {
      const text = String(lastToastMessage || '').trim();
      if (!text) return;
      try {
        if (navigator.clipboard && typeof navigator.clipboard.writeText === 'function') {
          await navigator.clipboard.writeText(text);
        } else {
          const textArea = document.createElement('textarea');
          textArea.value = text;
          textArea.setAttribute('readonly', 'true');
          textArea.style.position = 'fixed';
          textArea.style.left = '-9999px';
          document.body.appendChild(textArea);
          textArea.select();
          document.execCommand('copy');
          textArea.remove();
        }
        showToast('提示内容已复制');
      } catch {
        showToast('复制失败，请手动选中文本复制', 'error');
      }
    }

    function showToast(message, type = 'success') {
      const snackbar = document.getElementById('snackbar');
      const messageEl = document.getElementById('snackbarMessage');
      lastToastMessage = String(message || '');
      snackbar.className = `snackbar ${type}`;
      messageEl.textContent = lastToastMessage;
      snackbar.classList.add('show');
      clearTimeout(snackbar.hideTimer);
      const baseDuration = type === 'error' ? 9000 : 5200;
      const longTextExtra = lastToastMessage.length > 80 ? 4000 : 0;
      snackbar.hideTimer = setTimeout(() => {
        hideToast();
      }, baseDuration + longTextExtra);
    }

    document.getElementById('logDialog').addEventListener('click', (event) => {
      if (event.target.id === 'logDialog') closeLogDialog();
    });
    document.getElementById('checkinDialog').addEventListener('click', (event) => {
      if (event.target.id === 'checkinDialog') closeCheckinDialog();
    });

    document.getElementById('snackbar').addEventListener('mouseenter', pauseToastTimer);
    document.getElementById('snackbar').addEventListener('mouseleave', resumeToastTimer);
    window.addEventListener('scroll', syncDashboardRailState, { passive: true });
    window.addEventListener('resize', fitWebTerminal, { passive: true });

    document.addEventListener('keydown', (event) => {
      if (event.key === 'Escape') {
        closeLogDialog();
        closeCheckinDialog();
      }
    });

    if (typeof systemThemeQuery.addEventListener === 'function') {
      systemThemeQuery.addEventListener('change', () => {
        if (themeMode === 'auto') applyTheme('auto', false);
      });
    } else if (typeof systemThemeQuery.addListener === 'function') {
      systemThemeQuery.addListener(() => {
        if (themeMode === 'auto') applyTheme('auto', false);
      });
    }

    applyTheme(themeMode, false);
    applyGlassPrefs();
    applyWallpaper();
    applyDashboardRefreshIntervalDisplay();
    setupTerminalResizeHandle();
    connectWebSocket();
    refreshDashboardNow(false);
    fetchModuleAudit();
    fetchStartPolicyTemplates();
    fetchSettings();
    setupDashboardRefreshTimer();
    setupCheckinAutoRunTimer();
  </script>
</body>
</html>
