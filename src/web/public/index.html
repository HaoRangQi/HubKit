  <div class="wallpaper-layer" id="wallpaperLayer" aria-hidden="true"></div>
  <div class="shell">
    <header class="top-app-bar">
      <div class="brand">
        <div class="brand-mark" aria-hidden="true">
          <svg class="icon"><use href="#icon-hub"></use></svg>
        </div>
        <div class="brand-copy">
          <h1>HubKit</h1>
          <p class="subtitle" id="pageSubtitle">个人自动化中控台</p>
        </div>
      </div>
      <div class="bar-actions">
        <div class="theme-switcher" aria-label="主题模式">
          <div class="theme-tabs" role="tablist" aria-label="主题模式">
            <button class="theme-btn" id="theme-auto" type="button" data-theme-mode="auto" onclick="setThemeMode('auto')">
              <svg class="icon" aria-hidden="true"><use href="#icon-auto_mode"></use></svg>
              <span>自动</span>
            </button>
            <button class="theme-btn" id="theme-light" type="button" data-theme-mode="light" onclick="setThemeMode('light')">
              <svg class="icon" aria-hidden="true"><use href="#icon-light_mode"></use></svg>
              <span>浅色</span>
            </button>
            <button class="theme-btn" id="theme-dark" type="button" data-theme-mode="dark" onclick="setThemeMode('dark')">
              <svg class="icon" aria-hidden="true"><use href="#icon-dark_mode"></use></svg>
              <span>深色</span>
            </button>
          </div>
        </div>
        <nav class="view-tabs" aria-label="视图切换">
          <button class="nav-btn active" type="button" data-view="dashboard" onclick="showView('dashboard')">
            <svg class="icon" aria-hidden="true"><use href="#icon-dashboard"></use></svg>
            <span>仪表盘</span>
          </button>
          <button class="nav-btn" type="button" data-view="diagnostics" onclick="showView('diagnostics')">
            <svg class="icon" aria-hidden="true"><use href="#icon-article"></use></svg>
            <span>体检</span>
          </button>
          <button class="nav-btn" type="button" data-view="settings" onclick="showView('settings')">
            <svg class="icon" aria-hidden="true"><use href="#icon-tune"></use></svg>
            <span>设置</span>
          </button>
        </nav>
        <div class="connection-chip disconnected" id="connectionChip" role="status" aria-live="polite">
          <span class="status-indicator" id="wsStatus"></span>
          <span id="wsStatusText">连接中...</span>
        </div>
      </div>
    </header>

    <main>
      <section id="dashboardView" aria-labelledby="dashboardTitle">
        <div class="dashboard-header">
          <div>
            <h2 class="settings-section-title" id="dashboardTitle">模块运行状态</h2>
            <p class="settings-section-desc">按需启动、停止和查看模块输出。</p>
          </div>
          <div class="dashboard-actions">
            <button class="btn btn-outlined" type="button" onclick="showGlobalLogs()">
              <svg class="icon" aria-hidden="true"><use href="#icon-article"></use></svg>
              <span>全局日志</span>
            </button>
            <div class="dashboard-refresh-control" title="自动刷新间隔（秒），0 表示关闭">
              <span>自动刷新</span>
              <input
                id="dashboardRefreshIntervalInput"
                type="number"
                min="0"
                max="600"
                step="1"
                value="30"
                onchange="updateDashboardRefreshInterval(this.value)"
              >
              <span class="dashboard-refresh-state" id="dashboardRefreshState">30s</span>
            </div>
            <button class="btn btn-tonal" type="button" onclick="refreshDashboardNow(true)">
              <svg class="icon" aria-hidden="true"><use href="#icon-refresh"></use></svg>
              <span>刷新</span>
            </button>
          </div>
        </div>

        <div class="summary-strip" id="summaryStrip" aria-label="模块统计">
        <div class="summary-item glass-panel" data-summary-tone="all">
            <span class="summary-label">全部模块</span>
            <span class="summary-value" id="summaryTotal">0</span>
            <span class="summary-note">已纳入当前面板</span>
          </div>
          <div class="summary-item glass-panel" data-summary-tone="running">
            <span class="summary-label">运行中</span>
            <span class="summary-value" id="summaryRunning">0</span>
            <span class="summary-note">正在提供服务</span>
            <button class="summary-inline-action" id="forceCloseAllBtn" type="button" onclick="forceCloseAllModules()">
              <svg class="icon" aria-hidden="true"><use href="#icon-stop_circle"></use></svg>
              <span>全部关停</span>
            </button>
          </div>
          <div class="summary-item glass-panel" data-summary-tone="stopped">
            <span class="summary-label">已停止</span>
            <span class="summary-value" id="summaryStopped">0</span>
            <span class="summary-note">可按需唤起</span>
          </div>
          <div class="summary-item glass-panel" data-summary-tone="update">
            <span class="summary-label">可更新</span>
            <span class="summary-value" id="summaryUpdateable">0</span>
            <span class="summary-note">建议优先关注</span>
          </div>
        </div>

        <div class="dashboard-layout">
          <aside class="group-rail" id="dashboardGroupRail" aria-label="分组导航"></aside>
          <div class="dashboard-group-content" id="dashboardGroupContent">

  <script>
    const THEME_STORAGE_KEY = 'hubkit-theme-mode';

    let settings = {

      schedule: false,
      cleanup: false,
    };
    let settingsDirty = false;
    const systemThemeQuery = window.matchMedia('(prefers-color-scheme: dark)');

    const dayLabels = ['日', '一', '二', '三', '四', '五', '六'];

    function icon(name) {
      return `<svg class="icon" aria-hidden="true"><use href="#icon-${name}"></use></svg>`;
    }

    function escapeHtml(value) {
      return String(value ?? '')
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#39;');
    }

    function escapeAttr(value) {
      return escapeHtml(value).replace(/`/g, '&#96;');
    }

    function jsString(value) {
      return String(value ?? '').replace(/\\/g, '\\\\').replace(/'/g, "\\'").replace(/\n/g, '\\n').replace(/\r/g, '');
    }

    function loadUiPrefs() {
      return window.HubKitUiPrefs.normalizeUiPrefs(localStorage.getItem(UI_PREFS_STORAGE_KEY), resolvedTheme);
    }

    function clampNumber(value, min, max, fallback) {
      return window.HubKitUiPrefs.clampNumber(value, min, max, fallback);
    }

    function saveUiPrefs() {
      localStorage.setItem(UI_PREFS_STORAGE_KEY, JSON.stringify(uiPrefs));
    }

    function getDashboardRefreshIntervalSeconds() {
      const value = Number(uiPrefs.dashboardRefreshIntervalSeconds);
      if (!Number.isFinite(value)) return 30;
      return Math.max(0, Math.min(600, Math.round(value)));
    }

    function applyDashboardRefreshIntervalDisplay() {
      const interval = getDashboardRefreshIntervalSeconds();
      const input = document.getElementById('dashboardRefreshIntervalInput');
      if (input) {
        input.value = String(interval);
      }
      const state = document.getElementById('dashboardRefreshState');
      if (state) {
        state.textContent = interval <= 0 ? '已关闭' : `${interval}s`;
      }
    }

    function setupDashboardRefreshTimer() {
      if (dashboardRefreshTimer) {
        clearInterval(dashboardRefreshTimer);
        dashboardRefreshTimer = null;
      }
      const interval = getDashboardRefreshIntervalSeconds();
      if (interval <= 0) {
        applyDashboardRefreshIntervalDisplay();
        return;
      }
      dashboardRefreshTimer = setInterval(() => {
        if (currentView === 'dashboard') {
          refreshDashboardNow(false);
          return;
        }
        if (currentView === 'diagnostics') {
          fetchModuleAudit();
        }
      }, interval * 1000);
      applyDashboardRefreshIntervalDisplay();
    }

    function updateDashboardRefreshInterval(value) {
      uiPrefs.dashboardRefreshIntervalSeconds = clampNumber(value, 0, 600, 30);
      uiPrefs.dashboardRefreshIntervalSeconds = Math.round(uiPrefs.dashboardRefreshIntervalSeconds);
      saveUiPrefs();
      setupDashboardRefreshTimer();
      showToast(uiPrefs.dashboardRefreshIntervalSeconds === 0
        ? '自动刷新已关闭'
        : `自动刷新间隔已设置为 ${uiPrefs.dashboardRefreshIntervalSeconds} 秒`);
    }

    async function refreshDashboardNow(showNotice = false) {
      if (dashboardRefreshRunning) {
        pendingDashboardRefresh = true;
        return;
      }
      dashboardRefreshRunning = true;
      try {
        await Promise.all([
          fetchModules(),
          fetchWorkspaces(),
          fetchScriptBundles(),
          fetchSystemActions(),
        ]);
        if (showNotice) showToast('卡片数据已刷新');
      } catch (error) {
        if (showNotice) showToast(error?.message || '刷新失败', 'error');
      } finally {
        dashboardRefreshRunning = false;
      }
      if (pendingDashboardRefresh) {
        pendingDashboardRefresh = false;
        return refreshDashboardNow(false);
      }
    }

    function normalizeDailyTime(value, fallback = DEFAULT_CHECKIN_RUN_TIME) {
      const text = String(value || '').trim();
      if (!/^\d{2}:\d{2}$/.test(text)) return fallback;
      const [hhRaw, mmRaw] = text.split(':');
      const hh = Number(hhRaw);
      const mm = Number(mmRaw);
      if (!Number.isInteger(hh) || !Number.isInteger(mm) || hh < 0 || hh > 23 || mm < 0 || mm > 59) {
        return fallback;
      }
      return `${String(hh).padStart(2, '0')}:${String(mm).padStart(2, '0')}`;
    }

    function normalizeCurlTimeoutMs(value) {
      const n = Number(value);
      if (!Number.isFinite(n)) return 30_000;
      return Math.max(1_000, Math.min(300_000, Math.round(n)));
    }

    function normalizeCheckinSiteId(value, fallbackId, usedIds) {
      const raw = String(value || '').trim().toLowerCase();
      const normalized = (raw || fallbackId).replace(/[^a-z0-9-_]/g, '-').replace(/-+/g, '-').replace(/^-|-$/g, '') || fallbackId;
      let candidate = normalized;
      let suffix = 2;
      while (usedIds.has(candidate)) {
        candidate = `${normalized}-${suffix}`;
        suffix += 1;
      }
      usedIds.add(candidate);
      return candidate;
    }

    function normalizeCheckinSites(sites) {
      const source = Array.isArray(sites) ? sites : [];
      const usedIds = new Set();
      const normalized = source
        .slice(0, 16)
        .map((item, index) => {
          const fallbackName = `请求站点 ${index + 1}`;
          const name = String(item?.name || item?.shortName || '').trim() || fallbackName;
          const url = String(item?.url || '').trim();
          const id = normalizeCheckinSiteId(item?.id, `site-${index + 1}`, usedIds);
          const defaultCurl = String(item?.defaultCurl || '').trim() || (url ? `curl --compressed "${url}"` : 'curl --compressed "https://example.com/api"');
          return {
            id,
            name,
            shortName: name,
            url,
            defaultCurl,
          };
        });
      return normalized.length > 0 ? normalized : DEFAULT_CHECKIN_SITES.map((site, index) => ({
        ...site,
        id: normalizeCheckinSiteId(site.id, `site-${index + 1}`, usedIds),
      }));
    }

    function loadCheckinSites() {
      try {
        const raw = localStorage.getItem(CHECKIN_SITES_STORAGE_KEY);
        if (!raw) return normalizeCheckinSites(DEFAULT_CHECKIN_SITES);
        const parsed = JSON.parse(raw);
        return normalizeCheckinSites(parsed);
      } catch {
        return normalizeCheckinSites(DEFAULT_CHECKIN_SITES);
      }
    }

    function saveCheckinSites() {
      localStorage.setItem(CHECKIN_SITES_STORAGE_KEY, JSON.stringify(checkinSites));
    }

    function getNextCheckinSiteId() {
      const usedIds = new Set(checkinSites.map((site) => site.id));
      return normalizeCheckinSiteId('', `site-${usedIds.size + 1}`, usedIds);
    }

    function getDefaultCurlCommand(site) {
      if (typeof site?.defaultCurl === 'string' && site.defaultCurl.trim()) {
        return site.defaultCurl.trim();
      }
      if (typeof site?.url === 'string' && site.url.trim()) {
        return `curl "${site.url.trim()}"`;
      }
      return 'curl "https://httpbin.org/get"';
    }

    function normalizeCheckinCommandIndex(value, total, fallback = 0) {
      const count = Number.isFinite(Number(total)) ? Math.max(1, Math.round(Number(total))) : 1;
      const n = Number(value);
      if (!Number.isFinite(n)) {
        return Math.max(0, Math.min(count - 1, fallback));
      }
      return Math.max(0, Math.min(count - 1, Math.round(n)));
    }

    function normalizeCheckinCommands(value, fallbackCommand) {
      const defaultCommand = String(fallbackCommand || '').replace(/\r/g, '').trim() || 'curl "https://httpbin.org/get"';
      const source = Array.isArray(value) ? value : [];
      const commands = source
        .slice(0, 12)
        .map((item) => String(item ?? '').replace(/\r/g, ''));
      if (commands.length === 0) {
        return [defaultCommand];
      }
      if (!commands.some((command) => command.trim())) {
        commands[0] = defaultCommand;
      }
      return commands;
    }

    function getCheckinActiveCommand(config) {
      if (!config || typeof config !== 'object') return '';
      const index = normalizeCheckinCommandIndex(config.selectedCommandIndex, config.curlCommands?.length || 1, 0);
      return String(config.curlCommands?.[index] || '').replace(/\r/g, '');
    }

    function getCheckinRunnableCommands(config) {
      const commands = Array.isArray(config?.curlCommands) ? config.curlCommands : [];
      return commands
        .map((command, index) => ({
          index,
          command: String(command || ''),
        }))
        .filter((entry) => entry.command.trim());
    }

    function buildDefaultCheckinConfig(site) {
      const defaultCommand = getDefaultCurlCommand(site);
      return {
        curlCommand: defaultCommand,
        curlCommands: [defaultCommand],
        selectedCommandIndex: 0,
        autoRunCursor: 0,
        autoRunEnabled: false,
        runTime: DEFAULT_CHECKIN_RUN_TIME,
        timeoutMs: 30_000,
      };
    }

    function normalizeCheckinConfig(site, value) {
      const defaults = buildDefaultCheckinConfig(site);
      const source = value && typeof value === 'object' ? value : {};
      const legacyCommand = String(source.curlCommand || source.command || '').replace(/\r/g, '');
      const rawCommands = Array.isArray(source.curlCommands) ? source.curlCommands : [];
      const commands = normalizeCheckinCommands(
        rawCommands.length > 0 ? rawCommands : [legacyCommand || defaults.curlCommand],
        defaults.curlCommand,
      );
      const selectedCommandIndex = normalizeCheckinCommandIndex(
        source.selectedCommandIndex,
        commands.length,
        0,
      );
      const autoRunCursor = normalizeCheckinCommandIndex(
        source.autoRunCursor,
        getCheckinRunnableCommands({ curlCommands: commands }).length || 1,
        0,
      );
      return {
        curlCommand: String(commands[selectedCommandIndex] || ''),
        curlCommands: commands,
        selectedCommandIndex,
        autoRunCursor,
        autoRunEnabled: source.autoRunEnabled === true,
        runTime: normalizeDailyTime(source.runTime, defaults.runTime),
        timeoutMs: normalizeCurlTimeoutMs(source.timeoutMs),
      };
    }

    function normalizeCheckinRunRecord(value) {
      const source = value && typeof value === 'object' ? value : {};
      const phase = typeof source.phase === 'string' ? source.phase : 'idle';
      return {
        phase: ['idle', 'running', 'success', 'failed'].includes(phase) ? phase : 'idle',
        message: typeof source.message === 'string' ? source.message : '',
        stdout: typeof source.stdout === 'string' ? source.stdout : '',
        stderr: typeof source.stderr === 'string' ? source.stderr : '',
        startedAt: typeof source.startedAt === 'string' ? source.startedAt : '',
        finishedAt: typeof source.finishedAt === 'string' ? source.finishedAt : '',
        exitCode: Number.isFinite(Number(source.exitCode)) ? Number(source.exitCode) : null,
      };
    }

    function loadCheckinPrefs() {
      const defaultSiteId = checkinSites[0]?.id || null;
      const fallback = {
        selectedSiteId: defaultSiteId,
        configsBySite: {},
        runRecordsBySite: {},
        lastAutoRunKeyBySite: {},
      };

      try {
        const raw = localStorage.getItem(CHECKIN_PREFS_STORAGE_KEY);
        const parsed = raw ? JSON.parse(raw) : {};
        const selectedSiteId = getCheckinSite(parsed?.selectedSiteId)?.id || defaultSiteId;
        const configsBySite = {};
        const runRecordsBySite = {};
        const parsedConfigs = parsed?.configsBySite && typeof parsed.configsBySite === 'object' ? parsed.configsBySite : {};
        const parsedRecords = parsed?.runRecordsBySite && typeof parsed.runRecordsBySite === 'object' ? parsed.runRecordsBySite : {};
        const parsedAutoRunKeys = parsed?.lastAutoRunKeyBySite && typeof parsed.lastAutoRunKeyBySite === 'object'
          ? parsed.lastAutoRunKeyBySite
          : {};

        checkinSites.forEach((site) => {
          configsBySite[site.id] = normalizeCheckinConfig(site, parsedConfigs[site.id]);
          runRecordsBySite[site.id] = normalizeCheckinRunRecord(parsedRecords[site.id]);
        });

        return {
          selectedSiteId,
          configsBySite,
          runRecordsBySite,
          lastAutoRunKeyBySite: parsedAutoRunKeys,
        };
      } catch {
        checkinSites.forEach((site) => {
          fallback.configsBySite[site.id] = buildDefaultCheckinConfig(site);
          fallback.runRecordsBySite[site.id] = normalizeCheckinRunRecord(undefined);
        });
        return fallback;
      }
    }

    function saveCheckinPrefs() {
      localStorage.setItem(CHECKIN_PREFS_STORAGE_KEY, JSON.stringify(checkinPrefs));
    }

    function reconcileCheckinPrefsWithSites(selectedSiteId = '') {
      const normalizedSites = normalizeCheckinSites(checkinSites);
      checkinSites = normalizedSites;
      saveCheckinSites();

      const validIds = new Set(checkinSites.map((site) => site.id));
      const nextConfigsBySite = {};
      const nextRunRecordsBySite = {};
      const nextAutoRunKeysBySite = {};
      checkinPrefs.configsBySite = checkinPrefs.configsBySite || {};
      checkinPrefs.runRecordsBySite = checkinPrefs.runRecordsBySite || {};
      checkinPrefs.lastAutoRunKeyBySite = checkinPrefs.lastAutoRunKeyBySite || {};

      checkinSites.forEach((site) => {
        nextConfigsBySite[site.id] = normalizeCheckinConfig(site, checkinPrefs.configsBySite[site.id]);
        nextRunRecordsBySite[site.id] = normalizeCheckinRunRecord(checkinPrefs.runRecordsBySite[site.id]);
        if (Object.prototype.hasOwnProperty.call(checkinPrefs.lastAutoRunKeyBySite, site.id)) {
          nextAutoRunKeysBySite[site.id] = String(checkinPrefs.lastAutoRunKeyBySite[site.id]);
        }
      });

      checkinPrefs.configsBySite = nextConfigsBySite;
      checkinPrefs.runRecordsBySite = nextRunRecordsBySite;
      checkinPrefs.lastAutoRunKeyBySite = nextAutoRunKeysBySite;

      const preferred = String(selectedSiteId || checkinPrefs.selectedSiteId || '').trim();
      checkinPrefs.selectedSiteId = validIds.has(preferred)
        ? preferred
        : (checkinSites[0]?.id || null);
      saveCheckinPrefs();
    }

    function updateCheckinSiteMeta(siteId, patch = {}) {
      const target = getCheckinSite(siteId);
      if (!target) return;
      checkinSites = normalizeCheckinSites(checkinSites.map((site) => {
        if (site.id !== target.id) return site;
        const nextName = Object.prototype.hasOwnProperty.call(patch, 'name')
          ? String(patch.name || '').trim()
          : site.name;
        const nextUrl = Object.prototype.hasOwnProperty.call(patch, 'url')
          ? String(patch.url || '').trim()
          : site.url;
        const fallbackName = nextName || site.name || '请求站点';
        return {
          ...site,
          name: fallbackName,
          shortName: fallbackName,
          url: nextUrl,
          defaultCurl: nextUrl ? `curl --compressed "${nextUrl}"` : site.defaultCurl,
        };
      }));
      reconcileCheckinPrefsWithSites(target.id);
      renderDashboardGroups();
    }

    function applyWallpaper() {
      const layer = document.getElementById('wallpaperLayer');
      if (!layer) return;
      const enabled = uiPrefs.wallpaperEnabled === true;
      const url = String(uiPrefs.wallpaperUrl || '').trim();
      const blur = Number.isFinite(Number(uiPrefs.wallpaperBlur)) ? Number(uiPrefs.wallpaperBlur) : 6;
      const safeBlur = Math.min(24, Math.max(0, blur));
      const fit = ['contain', 'cover', 'stretch'].includes(uiPrefs.wallpaperFit) ? uiPrefs.wallpaperFit : 'contain';
      const positionX = clampNumber(uiPrefs.wallpaperPositionX, 0, 100, 50);
      const positionY = clampNumber(uiPrefs.wallpaperPositionY, 0, 100, 50);
      const scrimOpacity = clampNumber(uiPrefs.wallpaperScrimOpacity, 0, 0.8, resolvedTheme === 'dark' ? 0.55 : 0.35);
      layer.style.setProperty('--wallpaper-blur', `${safeBlur}px`);
      layer.style.setProperty('--wallpaper-opacity', String(uiPrefs.wallpaperOpacity ?? 0.92));
      layer.style.setProperty('--wallpaper-scale', safeBlur === 0 ? '1' : '1.03');
      document.documentElement.style.setProperty('--wallpaper-scrim-opacity', enabled && url ? String(scrimOpacity) : '0');
      layer.style.backgroundSize = fit === 'stretch' ? '100% 100%' : fit;
      layer.style.backgroundPosition = `${positionX}% ${positionY}%`;

      if (!enabled || !url) {
        layer.style.display = 'none';
        layer.style.backgroundImage = '';
        return;
      }

      layer.style.backgroundImage = `url("${url.replace(/"/g, '\\"')}")`;
      layer.style.display = 'block';
    }

      root.style.setProperty('--glass-border-opacity', String(uiPrefs.glassBorderOpacity ?? 0.34));

    function connectWebSocket() {
      const protocol = window.location.protocol === 'https:' ? 'wss:' : 'ws:';
      const wsUrl = `${protocol}//${window.location.host}`;

      ws = new WebSocket(wsUrl);

      ws.onopen = () => {
        updateConnectionStatus(true);
        clearInterval(reconnectInterval);
        reconnectInterval = null;
        refreshDashboardNow(false);
        fetchSettings();
        fetchConfigBackups();
      };

      ws.onmessage = (event) => {
        try {
          handleWebSocketMessage(JSON.parse(event.data));
        } catch (error) {
          console.error('Invalid WebSocket message:', error);
        }
      };

      ws.onerror = () => updateConnectionStatus(false);

      ws.onclose = () => {
        updateConnectionStatus(false);
        if (!reconnectInterval) {
          reconnectInterval = setInterval(connectWebSocket, 3000);
        }
      };
    }

    function updateConnectionStatus(connected) {
      const chip = document.getElementById('connectionChip');
      const statusText = document.getElementById('wsStatusText');
      chip.className = `connection-chip ${connected ? 'connected' : 'disconnected'}`;
      statusText.textContent = connected ? '已连接' : '未连接';
    }

    function applyModuleRuntimeUpdate(message) {
      const moduleId = typeof message?.moduleId === 'string' ? message.moduleId.trim() : '';
      if (!moduleId || !message?.runtimeState || typeof message.runtimeState !== 'object') return;
      const module = modules.find((item) => item.id === moduleId);
      if (!module) return;

      module.runtimeState = message.runtimeState;
      if (message.runtimeState.phase === 'running') {
        module.status = 'running';
      } else if (message.runtimeState.phase === 'stopped' || message.runtimeState.phase === 'failed') {
        module.status = 'stopped';
      }

      if (currentView === 'dashboard') {
        updateSummary();
        patchModuleDashboardSections();
      }
    }

    function handleWebSocketMessage(data) {
      const refreshEvents = new Set([
        'module_started',
        'module_stopped',
        'module_restarted',
        'module_updated',
        'schedule_triggered',
        'workspace_started',
        'workspace_stopped',
      ]);
      if (data.type === 'module_runtime_updated') {
        applyModuleRuntimeUpdate(data);
      }
      if (refreshEvents.has(data.type)) {
        refreshDashboardNow(false);
        if (currentView === 'diagnostics') fetchModuleAudit();
      }
      if (data.type === 'script_action_updated') {
        fetchScriptBundles();
      }
      if (data.type === 'system_action_updated') {
        fetchSystemActions();
      }
      if (data.type === 'terminal_output') {
        handleTerminalOutput(data);
      }
      if (data.type === 'terminal_exit') {
        handleTerminalExit(data);
      }
      if (data.type === 'terminal_error') {
        handleTerminalError(data);
      }
    }

    async function fetchModules(showNotice = false) {
      try {
        if (window.HubKitApi?.getModules) {
          modules = await window.HubKitApi.getModules();
        } else {
          const response = await fetch('/api/modules');
          const json = await response.json();
          modules = Array.isArray(json) ? json : (json.data || []);
        }
        updateSummary();
        patchModuleDashboardSections();
        requestSettingsRender();
        if (showNotice) showToast('模块状态已刷新');
      } catch (error) {
        console.error('Failed to fetch modules:', error);
        if (!document.querySelector('#dashboardGroupContent .module-group-stack')) {
          renderDashboardError();
        }
        if (showNotice) showToast('刷新失败', 'error');
      }
    }

    async function fetchWorkspaces(showNotice = false) {
      try {
        if (window.HubKitApi?.getWorkspaces) {
          workspaces = await window.HubKitApi.getWorkspaces();
        } else {
          const response = await fetch('/api/workspaces');
          const json = await response.json();
          if (!json.success) throw new Error(json.error || '工作区加载失败');
          workspaces = Array.isArray(json.data) ? json.data : [];
        }
        updateSummary();
        patchWorkspaceDashboardSections();
        requestSettingsRender();
        if (showNotice) showToast('工作区已刷新');
      } catch (error) {
        console.error('Failed to fetch workspaces:', error);
        workspaces = [];
        updateSummary();
        patchWorkspaceDashboardSections();
        if (showNotice) showToast(error.message || '工作区刷新失败', 'error');
      }
    }

    async function fetchWorkspacePlan(workspaceId) {
      workspacePlanLoading[workspaceId] = true;
      renderDashboardGroups();
      try {
        if (window.HubKitApi?.getWorkspaceStartPlan) {
          workspacePlansById[workspaceId] = await window.HubKitApi.getWorkspaceStartPlan(workspaceId);
        } else {
          const response = await fetch(`/api/workspaces/${encodeURIComponent(workspaceId)}/plan?action=start`);
          const json = await response.json();
          if (!json.success) throw new Error(json.error || '工作区计划加载失败');
          workspacePlansById[workspaceId] = json.data;
        }
      } catch (error) {
        showToast(error.message || '工作区计划加载失败', 'error');
      } finally {
        delete workspacePlanLoading[workspaceId];
        renderDashboardGroups();
      }
    }

    async function workspaceAction(workspaceId, action) {
      const workspace = workspaces.find((item) => item.id === workspaceId);
      const name = workspace?.name || workspaceId;
      const labels = { start: '启动', stop: '停止' };
      if (workspaceActionLoading[workspaceId]) return;
      if (action === 'stop' && !confirmHighRiskAction({
        title: `停止工作区：${name}`,
        impact: [
          '将按工作区停止顺序批量停止其中的模块。',
          '如果某个模块当前未运行，HubKit 会跳过该模块。',
        ],
        recovery: '可重新点击“启动工作区”按计划恢复。',
        confirmLabel: '继续停止',
      })) {
        return;
      }

      try {
        workspaceActionLoading[workspaceId] = action;
        renderDashboardGroups();
        const json = action === 'start' && window.HubKitApi?.startWorkspace
          ? await window.HubKitApi.startWorkspace(workspaceId)
          : action === 'stop' && window.HubKitApi?.stopWorkspace
            ? await window.HubKitApi.stopWorkspace(workspaceId, await highRiskHeaders(`workspace:${workspaceId}:stop`))
          : await (async () => {
            const response = await fetch(`/api/workspaces/${encodeURIComponent(workspaceId)}/${action}`, {
              method: 'POST',
              headers: action === 'stop' ? await highRiskHeaders(`workspace:${workspaceId}:stop`) : undefined,
            });
            const fallbackJson = await response.json().catch(() => ({}));
            if (!response.ok || fallbackJson.success === false) {
              throw new Error(fallbackJson.error || `${labels[action]}工作区失败`);
            }
            return fallbackJson;
          })();
        if (json.data) workspacePlansById[workspaceId] = json.data;
        showToast(json.message || `${labels[action]}工作区成功`);
        await Promise.all([fetchModules(), fetchWorkspaces()]);
      } catch (error) {
        showToast(error.message || `${labels[action]}工作区失败`, 'error');
      } finally {
        delete workspaceActionLoading[workspaceId];
        renderDashboardGroups();
      }
    }

    function startWorkspace(workspaceId) {
      workspaceAction(workspaceId, 'start');
    }

    function stopWorkspace(workspaceId) {
      workspaceAction(workspaceId, 'stop');
    }

    async function fetchScriptBundles(showNotice = false) {
      try {
        if (window.HubKitApi?.getScriptBundles) {
          scriptBundles = await window.HubKitApi.getScriptBundles();

          const response = await fetch('/api/script-bundles');

        }
        patchScriptDashboardSections();

            visibility: {},

    function formatConfigRestoreImpact(preview, backupLabel) {
      const totals = preview?.totals || {};
      const changedAreas = Array.isArray(preview?.changedAreas) && preview.changedAreas.length > 0
        ? preview.changedAreas.join('、')
        : '未发现明显差异';
      const lines = [
        `将恢复 ${backupLabel} 的 HubKit 配置。`,
        `影响范围：${changedAreas}`,
        `影响统计：新增 ${totals.added || 0} 项，移除/关闭 ${totals.removed || 0} 项，变更 ${totals.changed || 0} 项。`,
      ];

      const details = [];
      addRestoreImpactLine(details, '模块目录新增', preview?.moduleDirs?.added);
      addRestoreImpactLine(details, '模块目录移除', preview?.moduleDirs?.removed);
      addRestoreImpactLine(details, '新增分组', preview?.groups?.added?.map((group) => group.name || group.id));
      addRestoreImpactLine(details, '移除分组', preview?.groups?.removed?.map((group) => group.name || group.id));
      addRestoreImpactLine(details, '重命名分组', preview?.groups?.renamed?.map((group) => `${group.from} -> ${group.to}`));
      addRestoreImpactLine(details, '启用自启', preview?.autoStart?.enabled);
      addRestoreImpactLine(details, '关闭自启', preview?.autoStart?.disabled);
      addRestoreImpactLine(details, '新增定时', preview?.schedules?.added);
      addRestoreImpactLine(details, '移除定时', preview?.schedules?.removed);
      addRestoreImpactLine(details, '变更定时', preview?.schedules?.changed);
      addRestoreImpactLine(details, '分组归属变更', preview?.moduleGroupChanges);
      addRestoreImpactLine(details, '启动策略变更', preview?.startPolicyChanges);
      addRestoreImpactLine(details, 'Web 入口变更', preview?.webUrlChanges);
      addRestoreImpactLine(details, '卡片显示变更', preview?.visibilityChanges);
      if (preview?.startOrderChanged) {
        details.push('启动顺序：将按备份配置恢复');
      }

      return details.length > 0
        ? `${lines.join('\n')}\n\n主要变化：\n${details.slice(0, 10).map((item) => `- ${item}`).join('\n')}`
        : `${lines.join('\n')}\n\n备份内容与当前配置基本一致。`;
    }

    function addRestoreImpactLine(lines, label, values) {
      if (!Array.isArray(values) || values.length === 0) return;
      const visible = values.slice(0, 4).map((value) => String(value));
      const suffix = values.length > visible.length ? ` 等 ${values.length} 项` : '';
      lines.push(`${label}：${visible.join('、')}${suffix}`);
    }

    function confirmHighRiskAction({ title, impact = [], recovery = '', confirmLabel = '继续' }) {

      }
      const sections = [
        `高风险操作：${title}`,
        ...impact.filter(Boolean),
        recovery ? `回退路径：${recovery}` : '',
        `确认后将执行：${confirmLabel}`,
      ].filter(Boolean);
      return window.confirm(sections.join('\n\n'));
    }

    function ensureWebTerminal() {
      if (terminalInstance) return terminalInstance;
      if (typeof Terminal !== 'function') {
        throw new Error('Web 终端组件未加载');
      }

      terminalInstance = new Terminal({
        cursorBlink: true,
        convertEol: true,
        fontFamily: '"SF Mono", "Roboto Mono", Consolas, monospace',
        fontSize: 13,
        lineHeight: 1.25,
        scrollback: 5000,
        theme: {
          background: '#0b0f12',
          foreground: '#e2e5df',
          cursor: '#98d4bc',
          selectionBackground: '#355347',
        },
      });
      terminalFitAddon = new FitAddon.FitAddon();
      terminalInstance.loadAddon(terminalFitAddon);
      if (typeof WebLinksAddon !== 'undefined') {
        terminalInstance.loadAddon(new WebLinksAddon.WebLinksAddon());
      }
      terminalInstance.open(document.getElementById('webTerminal'));
      terminalInstance.onData((data) => {
        if (!activeTerminalSessionId || !ws || ws.readyState !== WebSocket.OPEN) return;
        ws.send(JSON.stringify({ type: 'terminal_input', sessionId: activeTerminalSessionId, data }));
      });
      document.getElementById('webTerminal').addEventListener('pointerdown', () => {
        terminalInstance?.focus();
      });
      fitWebTerminal();
      return terminalInstance;
    }

    function openTerminalPanel(title = 'Web 终端', subtitle = '准备中') {
      const drawer = document.getElementById('terminalDrawer');
      drawer.style.setProperty('--terminal-width', `${terminalDrawerWidth}px`);
      drawer.classList.add('active');
      terminalSessionState = activeTerminalSessionId ? 'running' : terminalSessionState === 'closed' ? 'idle' : terminalSessionState;
      document.getElementById('terminalTitle').textContent = title;
      updateTerminalStatus(subtitle);
      updateTerminalPeek();
      requestAnimationFrame(() => {
        ensureWebTerminal();
        fitWebTerminal();
        terminalInstance.focus();
      });
    }

    function collapseTerminalPanel() {
      document.getElementById('terminalDrawer').classList.remove('active');
      updateTerminalPeek();
    }

    function restoreTerminalPanel() {
      const title = activeTerminalAction?.actionName || document.getElementById('terminalTitle').textContent || 'Web 终端';
      const subtitle = document.getElementById('terminalSubtitle').textContent || '已收起';
      openTerminalPanel(title, subtitle);
    }

    function updateTerminalPeek() {
      const peek = document.getElementById('terminalPeek');
      const label = document.getElementById('terminalPeekLabel');
      if (!peek || !label) return;
      const drawerActive = document.getElementById('terminalDrawer')?.classList.contains('active');
      const visible = !drawerActive && (activeTerminalSessionId || terminalHasContent);
      peek.classList.toggle('visible', Boolean(visible));
      if (activeTerminalSessionId) {
        label.textContent = `运行中：${activeTerminalAction?.actionName || 'Web 终端'}`;
      } else if (terminalSessionState === 'exited') {
        label.textContent = '已退出：显示 Web 终端';
      } else {
        label.textContent = '显示 Web 终端';
      }
    }

    function updateTerminalStatus(text) {
      const subtitle = document.getElementById('terminalSubtitle');
      if (subtitle) subtitle.textContent = text || '';
    }

    function clearWebTerminal() {
      ensureWebTerminal().clear();
      terminalHasContent = false;
      updateTerminalPeek();
    }

    function resetTerminalPanelState() {
      activeTerminalSessionId = null;
      activeTerminalAction = null;
      terminalHasContent = false;
      terminalSessionState = 'closed';
      document.getElementById('terminalTitle').textContent = 'Web 终端';
      updateTerminalStatus('未连接');
      terminalInstance?.reset();
      document.getElementById('terminalDrawer')?.classList.remove('active');
      updateTerminalPeek();
    }

    async function killWebTerminal() {
      if (!activeTerminalSessionId) {
        showToast('没有运行中的 Web 终端会话', 'error');
        return;
      }
      if (!confirmHighRiskAction({
        title: '停止正在运行的 Web 终端',
        impact: [
          '会停止当前脚本进程。',
          '终端输出会保留在当前面板中，直到关闭或清屏。',
        ],
        recovery: '脚本历史仍保留在脚本工具箱记录中；必要时可重新启动脚本。',
        confirmLabel: '停止 Web 终端',
      })) {
        return;
      }
      try {
        const { json } = window.HubKitApi?.killTerminalSession
          ? await window.HubKitApi.killTerminalSession(activeTerminalSessionId, await highRiskHeaders(`terminal-session:${activeTerminalSessionId}:kill`))
          : await (async () => {
            const response = await fetch(`/api/terminal-sessions/${encodeURIComponent(activeTerminalSessionId)}/kill`, {
              method: 'POST',
              headers: await highRiskHeaders(`terminal-session:${activeTerminalSessionId}:kill`),
            });
            const fallbackJson = await response.json().catch(() => ({}));
            if (!response.ok || fallbackJson.success === false) {
              throw new Error(fallbackJson.error || '停止失败');
            }
            return { status: response.status, json: fallbackJson };
          })();
        activeTerminalSessionId = null;
        terminalSessionState = 'stopped';
        updateTerminalStatus('已停止，可关闭或查看输出');
        updateTerminalPeek();
        showToast(json.message || '终端会话已停止');
      } catch (error) {
        showToast(error.message || '停止失败', 'error');
      }
    }

    async function closeWebTerminal() {
      const sessionId = activeTerminalSessionId;
      if (!sessionId) {
        resetTerminalPanelState();
        showToast('Web 终端已关闭');
        return;
      }

      if (!confirmHighRiskAction({
        title: '关闭正在运行的 Web 终端',
        impact: [
          '会停止当前脚本进程。',
          '会清空当前终端面板的实时输出显示。',
        ],
        recovery: '脚本历史仍保留在脚本工具箱记录中；必要时可重新启动脚本。',
        confirmLabel: '停止并关闭',
      })) {
        return;
      }

      try {
        const { status } = window.HubKitApi?.killTerminalSession
          ? await window.HubKitApi.killTerminalSession(sessionId, await highRiskHeaders(`terminal-session:${sessionId}:kill`), {
            allowNotFound: true,
            failureMessage: '关闭失败',
            throwOnSuccessFalse: false,
          })
          : await (async () => {
            const response = await fetch(`/api/terminal-sessions/${encodeURIComponent(sessionId)}/kill`, {
              method: 'POST',
              headers: await highRiskHeaders(`terminal-session:${sessionId}:kill`),
            });
            const fallbackJson = await response.json().catch(() => ({}));
            if (!response.ok && response.status !== 404) {
              throw new Error(fallbackJson.error || '关闭失败');
            }
            return { status: response.status, json: fallbackJson };
          })();
        resetTerminalPanelState();
        showToast(status === 404 ? '终端会话已结束，面板已关闭' : 'Web 终端已停止并关闭');
        fetchScriptBundles();
      } catch (error) {
        showToast(error.message || '关闭失败', 'error');
      }
    }

    function handleTerminalOutput(data) {
      if (!terminalInstance || data.sessionId !== activeTerminalSessionId) return;
      terminalHasContent = true;
      terminalInstance.write(data.data || '');
      updateTerminalPeek();
    }

    function handleTerminalExit(data) {
      if (data.sessionId !== activeTerminalSessionId) return;
      const exitCode = data.exitCode ?? 'null';
      updateTerminalStatus(`已退出，退出码 ${exitCode}`);
      activeTerminalSessionId = null;
      terminalSessionState = 'exited';
      updateTerminalPeek();
      fetchScriptBundles();
    }

    function handleTerminalError(data) {
      if (data.sessionId && data.sessionId !== activeTerminalSessionId) return;
      const message = data.message || 'Web 终端错误';
      updateTerminalStatus(message);
      showToast(message, 'error');
    }

    function fitWebTerminal() {
      if (!terminalInstance || !terminalFitAddon) return;
      terminalFitAddon.fit();
      sendTerminalResize();
    }

    function getTerminalDimensions() {
      if (!terminalInstance) return { cols: 100, rows: 30 };
      return { cols: terminalInstance.cols || 100, rows: terminalInstance.rows || 30 };
    }

    function sendTerminalResize() {
      if (!activeTerminalSessionId || !terminalInstance || !ws || ws.readyState !== WebSocket.OPEN) return;
      ws.send(JSON.stringify({
        type: 'terminal_resize',
        sessionId: activeTerminalSessionId,
        ...getTerminalDimensions(),
      }));
    }

    function setupTerminalResizeHandle() {
      const resizer = document.getElementById('terminalResizer');
      const drawer = document.getElementById('terminalDrawer');
      if (!resizer || !drawer) return;

      resizer.addEventListener('pointerdown', (event) => {
        terminalResizing = true;
        resizer.setPointerCapture(event.pointerId);
      });

      resizer.addEventListener('pointermove', (event) => {
        if (!terminalResizing) return;
        const width = Math.min(window.innerWidth - 24, Math.max(360, window.innerWidth - event.clientX));
        terminalDrawerWidth = width;
        localStorage.setItem('hubkit-terminal-width', String(width));
        drawer.style.setProperty('--terminal-width', `${width}px`);
        fitWebTerminal();
      });

      resizer.addEventListener('pointerup', (event) => {
        terminalResizing = false;
        resizer.releasePointerCapture(event.pointerId);
        fitWebTerminal();
      });
    }

    function renderDashboard() {
      updateSummary();
      renderDashboardGroups();
    }

    function buildDashboardSectionElement(section) {
      const template = document.createElement('template');
      template.innerHTML = createDashboardSection(section).trim();
      return template.content.firstElementChild;
    }

    function patchDashboardSections(sectionMatcher, sections) {
      if (currentView !== 'dashboard') return true;
      const content = document.getElementById('dashboardGroupContent');
      const stack = content?.querySelector('.module-group-stack');
      if (!stack) {
        renderDashboardGroups();
        return false;
      }

      const existingSections = [...stack.querySelectorAll('[data-dashboard-group]')]
        .filter((sectionEl) => sectionMatcher(sectionEl.dataset.dashboardGroup || ''));
      const nextSections = sections.filter((section) => sectionMatcher(section.id));
      const existingIds = existingSections.map((sectionEl) => sectionEl.dataset.dashboardGroup || '');
      const nextIds = nextSections.map((section) => section.id);

      if (existingIds.length !== nextIds.length || existingIds.some((id, index) => id !== nextIds[index])) {
        renderDashboardGroups();
        return false;
      }

      nextSections.forEach((section, index) => {
        const nextEl = buildDashboardSectionElement(section);
        if (!nextEl) return;
        existingSections[index].replaceWith(nextEl);
      });
      requestAnimationFrame(syncDashboardRailState);
      return true;
    }

    function patchModuleDashboardSections() {
      return patchDashboardSections(
        (sectionId) => sectionId.startsWith('group-'),
        buildDashboardSections(),
      );
    }

    function patchWorkspaceDashboardSections() {
      return patchDashboardSections(
        (sectionId) => sectionId === 'workspace-orchestration',
        buildDashboardSections(),
      );
    }

    function patchScriptDashboardSections() {
      return patchDashboardSections(
        (sectionId) => sectionId.startsWith('script-') || sectionId.startsWith('system-action-'),
        buildDashboardSections(),
      );
    }

      if (!content) return;

            ${icon('error')}
            <div>无法加载模块状态。</div>

        </div>
      `;

    function renderDiagnostics() {

      const visibleReports = reports.filter((report) => reportMatchesDiagnosticsFilter(report, diagnosticsFilter));
      const errorCount = reports.filter((report) => reportHasSeverity(report, 'error')).length;
      const warnCount = reports.filter((report) => !reportHasSeverity(report, 'error') && reportHasSeverity(report, 'warn')).length;

          </div>
          <div class="dashboard-actions">
            <button class="btn btn-tonal" type="button" onclick="fetchModuleAudit(true)">

            <span class="summary-value">${healthyCount}</span>
            <span class="summary-note">未发现明显异常</span>
          </div>
          <div class="summary-item glass-panel" data-summary-tone="stopped">
            <span class="summary-label">告警</span>
            <span class="summary-value">${warnCount}</span>
            <span class="summary-note">建议排查</span>
          </div>
          <div class="summary-item glass-panel" data-summary-tone="update">
            <span class="summary-label">错误</span>
            <span class="summary-value">${errorCount}</span>
            <span class="summary-note">需要处理</span>
          </div>
        </div>

        <div class="summary-strip" aria-label="环境统计" style="margin-top: 14px;">
          <div class="summary-item glass-panel" data-summary-tone="all">
            <span class="summary-label">缺命令</span>
            <span class="summary-value">${missingCommandCount}</span>
            <span class="summary-note">运行时或包管理器未就绪</span>
          </div>
          <div class="summary-item glass-panel" data-summary-tone="stopped">
            <span class="summary-label">缺变量</span>
            <span class="summary-value">${missingEnvCount}</span>
            <span class="summary-note">来自 .env.example 等模板</span>
          </div>
        </div>

        <div class="diagnostics-filter-bar" aria-label="体检筛选">
          <div class="segmented-tabs" role="tablist" aria-label="体检结果筛选">
            ${filterOptions.map((option) => `
              <button
                class="segmented-tab ${diagnosticsFilter === option.id ? 'active' : ''}"
                type="button"

                aria-selected="${diagnosticsFilter === option.id ? 'true' : 'false'}"
                onclick="setDiagnosticsFilter('${jsString(option.id)}')"

                <span>${escapeHtml(String(option.count))}</span>

          <span class="diagnostics-filter-count">当前显示 ${visibleReports.length} / ${reports.length} 个模块</span>
        </div>

        <section class="toolbox-section">

        </section>
      `;

      renderDiagnostics();

    function reportMatchesDiagnosticsFilter(report, filter) {
      return window.HubKitDiagnostics.reportMatchesDiagnosticsFilter(report, filter);

    function reportHasSeverity(report, severity) {

    function reportHasMissingCommands(report) {

    function toggleAuditFindings(moduleId) {

    function renderDiagnosticsError() {

    function createAuditCard(report) {
      const findings = Array.isArray(report.findings) ? report.findings : [];
      const module = modules.find((item) => item.id === report.moduleId);
      const expanded = expandedAuditModules.has(report.moduleId);
      const visibleFindings = expanded ? findings : findings.slice(0, 4);
      const hiddenFindingCount = Math.max(0, findings.length - visibleFindings.length);
      const templateName = getStartPolicyTemplateName(report.inheritedTemplateId);
      const environment = report.environment || {};
      const envSummary = [
        environment.runtime ? `运行时 ${environment.runtime}` : '',
        environment.packageManager ? `包管理器 ${environment.packageManager}` : '',
        Array.isArray(environment.missingCommands) && environment.missingCommands.length > 0 ? `缺命令 ${environment.missingCommands.join('、')}` : '',
        Array.isArray(environment.missingEnvVars) && environment.missingEnvVars.length > 0 ? `缺变量 ${environment.missingEnvVars.join('、')}` : '',
      ].filter(Boolean).join(' · ');

        <article class="toolbox-card glass-panel">
          <div class="toolbox-card-header">
            <div class="toolbox-card-title">
              <h3>${escapeHtml(report.moduleName)}</h3>
              <p>${escapeHtml(report.moduleId)} · ${escapeHtml(report.groupId)} · 评分 ${escapeHtml(String(report.score))}</p>

            <div class="state-badge ${reportHasSeverity(report, 'error') ? 'error' : reportHasSeverity(report, 'warn') ? 'starting' : 'running'}">

          </div>

          <div class="metric-grid">
            <div class="metric">
              <span class="metric-label">运行状态</span>
              <span class="metric-value">${escapeHtml(getStatusText(report.status))}</span>
            </div>
            <div class="metric">
              <span class="metric-label">启动阶段</span>
              <span class="metric-value">${escapeHtml(getRuntimePhaseText(report.runtimePhase))}</span>
            </div>
            <div class="metric">
              <span class="metric-label">策略模板</span>
              <span class="metric-value">${escapeHtml(templateName)}</span>
            </div>
            <div class="metric">
              <span class="metric-label">重试策略</span>
              <span class="metric-value">${escapeHtml(`${report.effectiveStartPolicy.retryCount} 次 / ${report.effectiveStartPolicy.retryDelayMs} ms`)}</span>
            </div>
            <div class="metric">
              <span class="metric-label">环境要求</span>
              <span class="metric-value">${escapeHtml(envSummary || '无额外要求')}</span>

            <button class="btn btn-tonal btn-sm" type="button" onclick="checkModuleStatus('${jsString(report.moduleId)}')">${icon('refresh')}<span>检查状态</span></button>
            <button class="btn btn-text btn-sm" type="button" onclick="showLogs('${jsString(report.moduleId)}', '${jsString(report.moduleName)}')">${icon('article')}<span>查看日志</span></button>

          </div>
        </article>
      `;

    function createAuditFindingItem(report, module, finding) {
      return `
        <div class="settings-item">
          <div class="settings-item-info">
            <span class="settings-item-name">${escapeHtml(getAuditSeverityText(finding.severity))} · ${escapeHtml(finding.summary)}</span>
            <span class="settings-item-id">${escapeHtml(finding.details || finding.recommendation || '无附加说明')}</span>
            <span class="settings-item-id">影响：${escapeHtml(finding.impact || '可能影响模块稳定性')}</span>
            ${finding.logExcerpt ? `<pre class="audit-log-excerpt" aria-label="最近相关日志">${escapeHtml(finding.logExcerpt)}</pre>` : ''}
            <span class="settings-item-id">修复：${escapeHtml(finding.fix?.label || '手动处理')} · ${escapeHtml(finding.fix?.description || finding.recommendation || '根据详情处理')}</span>
            <span class="settings-item-id">验证：${escapeHtml(finding.verify?.label || '重新检查')} · ${escapeHtml(finding.verify?.description || '刷新体检结果')}</span>
            <div class="inline-actions" style="margin-top: 8px;">
              ${createAuditActionButton(report, module, finding.fix, '修复')}
              ${createAuditActionButton(report, module, finding.verify, '验证')}
            </div>
          </div>
        </div>
      `;
    }

    function createAuditActionButton(report, module, action, role) {
      if (!action || action.kind === 'manual') {
        return `<span class="settings-chip">${escapeHtml(role)}：${escapeHtml(action?.label || '手动处理')}</span>`;
      }
      const moduleId = jsString(report.moduleId);
      const moduleName = jsString(report.moduleName);
      const handlers = {
        check_status: `checkModuleStatus('${moduleId}')`,
        open_logs: `showLogs('${moduleId}', '${moduleName}')`,
        force_close: `forceCloseModule('${moduleId}')`,
        open_settings: `showView('settings')`,
        open_url: module?.webUrl ? `openModuleUrl('${moduleId}', '${jsString(module.webUrl)}')` : '',
      };
      const icons = {
        check_status: 'refresh',
        open_logs: 'article',
        force_close: 'stop_circle',
        open_settings: 'tune',
        open_url: 'open_in_new',
      };
      const handler = handlers[action.kind];
      if (!handler) {
        return `<span class="settings-chip">${escapeHtml(role)}：${escapeHtml(action.label)}</span>`;
      }
      return `<button class="btn btn-text btn-sm" type="button" title="${escapeAttr(action.description || action.label)}" onclick="${handler}">${icon(icons[action.kind] || 'refresh')}<span>${escapeHtml(action.label)}</span></button>`;
    }

    function updateSummary() {
      const visibleModules = modules.filter(m => m.visible !== false);
      const running = visibleModules.filter(m => m.status === 'running').length;
      const stopped = visibleModules.filter(m => m.status !== 'running').length;
      const updateable = visibleModules.filter(m => m.updateable).length;
      document.getElementById('summaryTotal').textContent = visibleModules.length;
      document.getElementById('summaryRunning').textContent = running;
      document.getElementById('summaryStopped').textContent = stopped;
      document.getElementById('summaryUpdateable').textContent = updateable;

      if (btn) {

      const commands = [...config.curlCommands];

      updateCheckinSiteConfig(siteId, {

    async function copyCheckinCurlCommand(siteId) {

      if (!String(command).trim()) {
        showToast('暂无可复制的命令', 'error');
        return;

      try {
        await navigator.clipboard.writeText(command);

    function resolveCheckinRunCommand(config, trigger = 'manual') {
      const runnableCommands = getCheckinRunnableCommands(config);
      if (runnableCommands.length === 0) return null;

      if (trigger === 'auto') {
        const cursor = normalizeCheckinCommandIndex(config.autoRunCursor, runnableCommands.length, 0);
        return {
          ...runnableCommands[cursor],
          queueCount: runnableCommands.length,
          queueIndex: cursor,
        };
      }

      const selectedIndex = normalizeCheckinCommandIndex(config.selectedCommandIndex, config.curlCommands.length, 0);
      const selected = runnableCommands.find((entry) => entry.index === selectedIndex);
      if (selected) {
        return {
          ...selected,
          queueCount: runnableCommands.length,
          queueIndex: runnableCommands.findIndex((entry) => entry.index === selected.index),
        };
      }
      return {
        ...runnableCommands[0],
        queueCount: runnableCommands.length,
        queueIndex: 0,
      };
    }

    function getCheckinAutoRunKey(siteId, runTime, now = new Date()) {
      const site = getCheckinSite(siteId);
      if (!site) return;
      const mm = String(now.getMonth() + 1).padStart(2, '0');
      const dd = String(now.getDate()).padStart(2, '0');
      return `${now.getFullYear()}-${mm}-${dd}:${runTime}`;
    }

    async function runCheckinCurl(siteId, trigger = 'manual', options = {}) {
      const site = getCheckinSite(siteId || checkinPrefs.selectedSiteId);
      if (!site) {
        if (trigger === 'manual') showToast('未配置请求站点', 'error');
        return;
      }
      const runOptions = options && typeof options === 'object' ? options : {};
      const skipRunningGuard = runOptions.skipRunningGuard === true;
      const keepLoadingState = runOptions.keepLoadingState === true;
      const skipConfirm = runOptions.skipConfirm === true;
      const showManualToast = runOptions.showToast !== false;

      if (!skipRunningGuard && checkinRunLoadingBySite[site.id]) return false;

      const config = getCheckinSiteConfig(site.id);
      let commandTarget = null;
      const overrideIndex = Number.isFinite(Number(runOptions.commandIndex))
        ? normalizeCheckinCommandIndex(runOptions.commandIndex, config.curlCommands.length, 0)
        : null;
      if (overrideIndex !== null) {
        const overrideCommand = String(config.curlCommands[overrideIndex] || '').replace(/\r/g, '');
        if (overrideCommand.trim()) {
          const runnableCommands = getCheckinRunnableCommands(config);
          const queueIndex = Math.max(0, runnableCommands.findIndex((entry) => entry.index === overrideIndex));
          commandTarget = {
            index: overrideIndex,
            command: overrideCommand,
            queueCount: Math.max(1, runnableCommands.length),
            queueIndex,
          };
        }
      }
      commandTarget = commandTarget || resolveCheckinRunCommand(config, trigger);
      if (!commandTarget || !String(commandTarget.command || '').trim()) {
        if (trigger === 'manual' && showManualToast) showToast('请先输入 curl 命令', 'error');
        return false;
      }
      const command = String(commandTarget.command).trim();
      const commandIndexLabel = `命令 ${commandTarget.index + 1}`;
      if (trigger === 'manual' && !skipConfirm && !confirmHighRiskAction({
        title: `执行 curl 请求：${site.name}（${commandIndexLabel}）`,
        impact: [
          '将直接在本机执行你输入的 curl 命令。',
          '命令可能访问外部网络并返回敏感内容。',
        ],
        recovery: '建议先检查 URL、Header 和参数，再执行。',
        confirmLabel: '继续执行',
      })) {
        return false;
      }

      if (!keepLoadingState) {
        checkinRunLoadingBySite[site.id] = true;
      }
      updateCheckinRunRecord(site.id, {
        phase: 'running',
        message: trigger === 'auto' ? `自动执行中（${commandIndexLabel}）...` : `执行中（${commandIndexLabel}）...`,
        startedAt: new Date().toISOString(),
        finishedAt: '',
        stdout: '',
        stderr: '',
      });
      renderDashboardGroups();

      try {
        const payload = {
          command,
          timeoutMs: config.timeoutMs,
        };
        const json = window.HubKitApi?.runCurlRequest
          ? await window.HubKitApi.runCurlRequest(site.id, payload)
          : await (async () => {
            const response = await fetch(`/api/curl-requests/${encodeURIComponent(site.id)}/run`, {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify(payload),
            });
            return await response.json();
          })();
        const runData = json?.data || {};
        const success = json?.success === true;
        const message = String(json?.message || (success ? `执行完成（${commandIndexLabel}）` : `执行失败（${commandIndexLabel}）`));

        updateCheckinRunRecord(site.id, {
          phase: success ? 'success' : 'failed',
          message,
          stdout: String(runData.stdout || ''),
          stderr: String(runData.stderr || ''),
          startedAt: String(runData.startedAt || new Date().toISOString()),
          finishedAt: String(runData.finishedAt || new Date().toISOString()),
          exitCode: runData.exitCode,
        });
        if (trigger === 'auto') {
          const nextCursor = (commandTarget.queueIndex + 1) % commandTarget.queueCount;
          updateCheckinSiteConfig(site.id, {
            autoRunCursor: nextCursor,
          });
        }
        if (trigger === 'manual' && showManualToast) {
          showToast(success ? `${site.shortName || site.name} 执行成功` : `${site.shortName || site.name} 执行失败`, success ? 'success' : 'error');
        }
        return success;
      } catch (error) {
        updateCheckinRunRecord(site.id, {
          phase: 'failed',
          message: error?.message || '请求执行失败',
          stderr: String(error?.message || ''),
          finishedAt: new Date().toISOString(),
        });
        if (trigger === 'manual' && showManualToast) {
          showToast(error?.message || '请求执行失败', 'error');
        }
        return false;
      } finally {
        if (!keepLoadingState) {
          checkinRunLoadingBySite[site.id] = false;
        }
        renderDashboardGroups();
      }
    }

    async function runCheckinCurlAll(siteId, trigger = 'manual') {
      const site = getCheckinSite(siteId || checkinPrefs.selectedSiteId);
      if (!site) {
        if (trigger === 'manual') showToast('未配置请求站点', 'error');
        return;
      }
      if (checkinRunLoadingBySite[site.id]) return;

      const config = getCheckinSiteConfig(site.id);
      const runnableCommands = getCheckinRunnableCommands(config);
      if (runnableCommands.length === 0) {
        if (trigger === 'manual') showToast('暂无可执行命令', 'error');
        return;
      }
      if (trigger === 'manual' && !confirmHighRiskAction({
        title: `执行全部命令：${site.name}`,
        impact: [
          `将顺序执行 ${runnableCommands.length} 条 curl 命令。`,
          '命令可能访问外部网络并返回敏感内容。',
        ],
        recovery: '建议先检查队列顺序与参数后再执行。',
        confirmLabel: '继续执行全部',
      })) {
        return;
      }

      checkinRunLoadingBySite[site.id] = true;
      checkinRunLoadingBySite[`${site.id}#all`] = true;
      updateCheckinRunRecord(site.id, {
        phase: 'running',
        message: `${trigger === 'manual' ? '手动' : '自动'}批量执行中（共 ${runnableCommands.length} 条）...`,
        startedAt: new Date().toISOString(),
        finishedAt: '',
        stdout: '',
        stderr: '',
      });
      renderDashboardGroups();

      let failedCount = 0;
      for (const entry of runnableCommands) {
        const success = await runCheckinCurl(site.id, trigger === 'auto' ? 'auto' : 'manual', {
          skipConfirm: true,
          skipRunningGuard: true,
          keepLoadingState: true,
          showToast: false,
          commandIndex: entry.index,
        });
        if (!success) failedCount += 1;
      }

      checkinRunLoadingBySite[site.id] = false;
      checkinRunLoadingBySite[`${site.id}#all`] = false;
      if (trigger === 'manual') {
        showToast(
          failedCount === 0
            ? `${site.shortName || site.name} 全部执行完成`
            : `${site.shortName || site.name} 执行完成，失败 ${failedCount} 条`,
          failedCount === 0 ? 'success' : 'error',
        );
      }
      renderDashboardGroups();
    }

    function maybeRunCheckinAutoTasks() {
      const now = new Date();
      checkinPrefs.lastAutoRunKeyBySite = checkinPrefs.lastAutoRunKeyBySite || {};

      checkinSites.forEach((site) => {
        const config = getCheckinSiteConfig(site.id);
        if (!config.autoRunEnabled) return;
        if (checkinRunLoadingBySite[site.id]) return;
        if (getCheckinRunnableCommands(config).length === 0) return;
        const [hours, minutes] = normalizeDailyTime(config.runTime).split(':').map((value) => Number(value));
        if (now.getHours() !== hours || now.getMinutes() !== minutes) return;

        const runKey = getCheckinAutoRunKey(site.id, config.runTime, now);
        if (checkinPrefs.lastAutoRunKeyBySite[site.id] === runKey) return;

        checkinPrefs.lastAutoRunKeyBySite[site.id] = runKey;
        saveCheckinPrefs();
        runCheckinCurl(site.id, 'auto');
      });
    }

    function findScriptAction(bundleId, actionId) {
      const bundle = scriptBundles.find((item) => item.id === bundleId);
      if (!bundle) return null;
      for (const group of bundle.groups || []) {
        const action = (group.actions || []).find((item) => item.id === actionId);
        if (action) {
          return { bundle, action };
        }
      }
      return null;
    }

    async function runScriptAction(bundleId, actionId) {
      const target = findScriptAction(bundleId, actionId);
      if (!target) {
        showToast('脚本动作不存在', 'error');
        return;
      }

      if (target.action.executionMode === 'terminal') {
        await runScriptActionInWebTerminal(bundleId, actionId, target.action.name);
        return;
      }

      if (!confirmScriptActionIfNeeded(target.action, '后台执行')) return;

      const key = `${bundleId}:${actionId}`;
      if (scriptRunLoading[key]) return;
      scriptRunLoading[key] = true;
      renderDashboardGroups();

      try {
        const json = window.HubKitApi?.runScriptAction
          ? await window.HubKitApi.runScriptAction(bundleId, actionId, await highRiskHeaders(`script-bundle:${bundleId}:${actionId}:run`))
          : await (async () => {
            const response = await fetch(`/api/script-bundles/${encodeURIComponent(bundleId)}/actions/${encodeURIComponent(actionId)}/run`, {
              method: 'POST',
              headers: await highRiskHeaders(`script-bundle:${bundleId}:${actionId}:run`),
            });
            const fallbackJson = await response.json().catch(() => ({}));
            if (!response.ok || fallbackJson.success === false) {
              throw new Error(fallbackJson.error || '执行失败');
            }
            return fallbackJson;
          })();
        showToast(json.message || '脚本已启动');
        await fetchScriptBundles();
      } catch (error) {
        console.error('Failed to run script action:', error);
        showToast(error.message || '执行失败', 'error');
      } finally {
        delete scriptRunLoading[key];
        renderDashboardGroups();
      }
    }

      if (!target) {

      if (!confirmScriptActionIfNeeded(target.action, '系统终端执行')) return;

    async function runScriptActionInWebTerminal(bundleId, actionId, actionName) {
      const target = findScriptAction(bundleId, actionId);
      if (target && !confirmScriptActionIfNeeded(target.action, 'Web 终端执行')) return;

      if (activeTerminalSessionId) {
        openTerminalPanel(activeTerminalAction?.actionName || 'Web 终端', `正在运行：${activeTerminalAction?.actionName || activeTerminalSessionId}`);
        terminalInstance?.focus();
        showToast('已有 Web 终端正在运行。请先停止当前会话，或使用系统终端并行运行。', 'error');
        return;
      }

      const key = `${bundleId}:${actionId}`;
      if (scriptRunLoading[key]) return;
      scriptRunLoading[key] = true;
      renderDashboardGroups();
      openTerminalPanel(actionName || actionId, '正在启动 Web 终端...');

      try {
        ensureWebTerminal();
        terminalSessionState = 'starting';
        terminalInstance.reset();
        terminalHasContent = true;
        terminalInstance.writeln(`[HubKit] 启动 ${actionName || actionId}...`);
        const dimensions = getTerminalDimensions();
        const json = window.HubKitApi?.startScriptActionWebTerminal
          ? await window.HubKitApi.startScriptActionWebTerminal(bundleId, actionId, dimensions, await highRiskHeaders(`script-bundle:${bundleId}:${actionId}:web-terminal`, { 'Content-Type': 'application/json' }))
          : await (async () => {
            const response = await fetch(`/api/script-bundles/${encodeURIComponent(bundleId)}/actions/${encodeURIComponent(actionId)}/web-terminal`, {
              method: 'POST',
              headers: await highRiskHeaders(`script-bundle:${bundleId}:${actionId}:web-terminal`, { 'Content-Type': 'application/json' }),
              body: JSON.stringify(dimensions),
            });
            const fallbackJson = await response.json().catch(() => ({}));
            if (!response.ok || fallbackJson.success === false) {
              throw new Error(fallbackJson.error || 'Web 终端启动失败');
            }
            return fallbackJson;
          })();

        const session = json.data?.session || {};
        activeTerminalSessionId = session.sessionId || null;
        activeTerminalAction = {
          bundleId: session.bundleId || bundleId,
          actionId: session.actionId || actionId,
          actionName: session.actionName || actionName,
        };
        document.getElementById('terminalTitle').textContent = activeTerminalAction.actionName || actionName || actionId;
        terminalSessionState = activeTerminalSessionId ? 'running' : 'idle';
        updateTerminalStatus(activeTerminalSessionId ? `会话 ${activeTerminalSessionId}` : 'Web 终端运行中');
        const runId = session.runId || json.data?.record?.runId || '';
        const initialLog = runId
          ? await fetchScriptLogs(activeTerminalAction.bundleId, activeTerminalAction.actionId, runId)
          : '';
        if (initialLog) {
          terminalInstance.reset();
          terminalHasContent = true;
          terminalInstance.write(initialLog);
        }
        sendTerminalResize();
        terminalInstance.focus();
        updateTerminalPeek();
        showToast(json.message || 'Web 终端已启动');
        await fetchScriptBundles();
      } catch (error) {
        console.error('Failed to run script action in web terminal:', error);
        updateTerminalStatus(error.message || 'Web 终端启动失败');
        showToast(error.message || 'Web 终端启动失败', 'error');
      } finally {
        delete scriptRunLoading[key];
        renderDashboardGroups();
      }
    }

    function confirmScriptActionIfNeeded(action, executionLabel) {
      if (!action?.confirmRequired && action?.riskLevel !== 'high') return true;
      const riskText = action.riskLevel === 'high' ? '高风险' : action.riskLevel === 'medium' ? '中风险' : '低风险';
      return confirmHighRiskAction({
        title: `运行脚本：${action.name || action.id}`,
        impact: [
          action.confirmMessage || action.description || '该脚本可能修改本机文件、进程或系统状态。',
          `执行方式：${executionLabel}，风险等级：${riskText}。`,
        ],
        recovery: '执行前请确认脚本内容可信；执行后可查看日志和历史记录排查结果。',
        confirmLabel: '继续运行脚本',
      });
    }

    async function showScriptHistory(bundleId, actionId, actionName) {
      try {
        let history;
        if (window.HubKitApi?.getScriptActionHistory) {
          history = await window.HubKitApi.getScriptActionHistory(bundleId, actionId);
        } else {
          const response = await fetch(`/api/script-bundles/${encodeURIComponent(bundleId)}/actions/${encodeURIComponent(actionId)}/history`);
          const json = await response.json().catch(() => ({}));
          if (!response.ok || json.success === false) {
            throw new Error(json.error || '无法加载历史');
          }
          history = Array.isArray(json.data) ? json.data : [];
        }
        if (history.length === 0) {
          showToast(`${actionName} 暂无历史记录`);
          return;
        }

        const message = history.slice(0, 5).map((item) => {
          const time = item.startedAt ? formatStartedAt(item.startedAt) : '未知时间';
          const state = getRunStateLabel(item);
          return `${time} · ${state}${item.exitCode !== undefined && item.exitCode !== null ? ` · code ${item.exitCode}` : ''}`;
        }).join('\n');
        showToast(message);
      } catch (error) {
        console.error('Failed to fetch script history:', error);
        showToast(error.message || '无法加载历史', 'error');
      }
    }

      systemActionRefreshing[actionId] = true;
      renderDashboardGroups();

      try {
        await fetchSystemActions(showNotice);

    async function fetchSystemActionLogs(actionId, runId = '') {
      try {
        const search = runId ? `?runId=${encodeURIComponent(runId)}` : '';
        if (actionId !== 'boot-preference') {
          return '暂不支持该系统调优日志';
        }
        if (window.HubKitApi?.getSystemActionLogs) {
          return await window.HubKitApi.getSystemActionLogs(actionId, { runId });
        }
        const response = await fetch(`/api/system-actions/boot-preference/logs${search}`);
        const json = await response.json();
        if (json.success) return json.data || '';
        return json.error || '无法加载日志';
      } catch (error) {
        console.error('Failed to fetch system action logs:', error);
        return '无法加载日志';
      }
    }
