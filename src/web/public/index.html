    function ensureWebTerminal() {
      if (terminalInstance) return terminalInstance;
      if (typeof Terminal !== 'function') {
        throw new Error('Web 终端组件未加载');
      }

      terminalInstance = new Terminal({
        cursorBlink: true,
        convertEol: true,
        fontFamily: '"SF Mono", "Roboto Mono", Consolas, monospace',
        fontSize: 13,
        lineHeight: 1.25,
        scrollback: 5000,
        theme: {
          background: '#0b0f12',
          foreground: '#e2e5df',
          cursor: '#98d4bc',
          selectionBackground: '#355347',
        },
      });
      terminalFitAddon = new FitAddon.FitAddon();
      terminalInstance.loadAddon(terminalFitAddon);
      if (typeof WebLinksAddon !== 'undefined') {
        terminalInstance.loadAddon(new WebLinksAddon.WebLinksAddon());
      }
      terminalInstance.open(document.getElementById('webTerminal'));
      terminalInstance.onData((data) => {
        if (!activeTerminalSessionId || !ws || ws.readyState !== WebSocket.OPEN) return;
        ws.send(JSON.stringify({ type: 'terminal_input', sessionId: activeTerminalSessionId, data }));
      });
      document.getElementById('webTerminal').addEventListener('pointerdown', () => {
        terminalInstance?.focus();
      });
      fitWebTerminal();
      return terminalInstance;
    }

    function openTerminalPanel(title = 'Web 终端', subtitle = '准备中') {
      const drawer = document.getElementById('terminalDrawer');
      drawer.style.setProperty('--terminal-width', `${terminalDrawerWidth}px`);
      drawer.classList.add('active');
      terminalSessionState = activeTerminalSessionId ? 'running' : terminalSessionState === 'closed' ? 'idle' : terminalSessionState;
      document.getElementById('terminalTitle').textContent = title;
      updateTerminalStatus(subtitle);
      updateTerminalPeek();
      requestAnimationFrame(() => {
        ensureWebTerminal();
        fitWebTerminal();
        terminalInstance.focus();
      });
    }

    function collapseTerminalPanel() {
      document.getElementById('terminalDrawer').classList.remove('active');
      updateTerminalPeek();
    }

    function restoreTerminalPanel() {
      const title = activeTerminalAction?.actionName || document.getElementById('terminalTitle').textContent || 'Web 终端';
      const subtitle = document.getElementById('terminalSubtitle').textContent || '已收起';
      openTerminalPanel(title, subtitle);
    }

    function updateTerminalPeek() {
      const peek = document.getElementById('terminalPeek');
      const label = document.getElementById('terminalPeekLabel');
      if (!peek || !label) return;
      const drawerActive = document.getElementById('terminalDrawer')?.classList.contains('active');
      const visible = !drawerActive && (activeTerminalSessionId || terminalHasContent);
      peek.classList.toggle('visible', Boolean(visible));
      if (activeTerminalSessionId) {
        label.textContent = `运行中：${activeTerminalAction?.actionName || 'Web 终端'}`;
      } else if (terminalSessionState === 'exited') {
        label.textContent = '已退出：显示 Web 终端';
      } else {
        label.textContent = '显示 Web 终端';
      }
    }

    function updateTerminalStatus(text) {
      const subtitle = document.getElementById('terminalSubtitle');
      if (subtitle) subtitle.textContent = text || '';
    }

    function clearWebTerminal() {
      ensureWebTerminal().clear();
      terminalHasContent = false;
      updateTerminalPeek();
    }

    function resetTerminalPanelState() {
      activeTerminalSessionId = null;
      activeTerminalAction = null;
      terminalHasContent = false;
      terminalSessionState = 'closed';
      document.getElementById('terminalTitle').textContent = 'Web 终端';
      updateTerminalStatus('未连接');
      terminalInstance?.reset();
      document.getElementById('terminalDrawer')?.classList.remove('active');
      updateTerminalPeek();
    }

    async function killWebTerminal() {
      if (!activeTerminalSessionId) {
        showToast('没有运行中的 Web 终端会话', 'error');
        return;
      }
      try {
        const response = await fetch(`/api/terminal-sessions/${encodeURIComponent(activeTerminalSessionId)}/kill`, {
          method: 'POST',
        });
        const json = await response.json().catch(() => ({}));
        if (!response.ok || json.success === false) {
          throw new Error(json.error || '停止失败');
        }
        activeTerminalSessionId = null;
        terminalSessionState = 'stopped';
        updateTerminalStatus('已停止，可关闭或查看输出');
        updateTerminalPeek();
        showToast(json.message || '终端会话已停止');
      } catch (error) {
        showToast(error.message || '停止失败', 'error');
      }
    }

    async function closeWebTerminal() {
      const sessionId = activeTerminalSessionId;
      if (!sessionId) {
        resetTerminalPanelState();
        showToast('Web 终端已关闭');
        return;
      }

      if (!window.confirm('当前 Web 终端仍在运行。关闭会停止脚本进程并清空面板输出。继续？')) {
        return;
      }

      try {
        const response = await fetch(`/api/terminal-sessions/${encodeURIComponent(sessionId)}/kill`, {
          method: 'POST',
        });
        const json = await response.json().catch(() => ({}));
        if (!response.ok && response.status !== 404) {
          throw new Error(json.error || '关闭失败');
        }
        resetTerminalPanelState();
        showToast(response.status === 404 ? '终端会话已结束，面板已关闭' : 'Web 终端已停止并关闭');
        fetchScriptBundles();
      } catch (error) {
        showToast(error.message || '关闭失败', 'error');
      }
    }

    function handleTerminalOutput(data) {
      if (!terminalInstance || data.sessionId !== activeTerminalSessionId) return;
      terminalHasContent = true;
      terminalInstance.write(data.data || '');
      updateTerminalPeek();
    }

    function handleTerminalExit(data) {
      if (data.sessionId !== activeTerminalSessionId) return;
      const exitCode = data.exitCode ?? 'null';
      updateTerminalStatus(`已退出，退出码 ${exitCode}`);
      activeTerminalSessionId = null;
      terminalSessionState = 'exited';
      updateTerminalPeek();
      fetchScriptBundles();
    }

    function handleTerminalError(data) {
      if (data.sessionId && data.sessionId !== activeTerminalSessionId) return;
      const message = data.message || 'Web 终端错误';
      updateTerminalStatus(message);
      showToast(message, 'error');
    }

    function fitWebTerminal() {
      if (!terminalInstance || !terminalFitAddon) return;
      terminalFitAddon.fit();
      sendTerminalResize();
    }

    function getTerminalDimensions() {
      if (!terminalInstance) return { cols: 100, rows: 30 };
      return { cols: terminalInstance.cols || 100, rows: terminalInstance.rows || 30 };
    }

    function sendTerminalResize() {
      if (!activeTerminalSessionId || !terminalInstance || !ws || ws.readyState !== WebSocket.OPEN) return;
      ws.send(JSON.stringify({
        type: 'terminal_resize',
        sessionId: activeTerminalSessionId,
        ...getTerminalDimensions(),
      }));
    }

    function setupTerminalResizeHandle() {
      const resizer = document.getElementById('terminalResizer');
      const drawer = document.getElementById('terminalDrawer');
      if (!resizer || !drawer) return;

      resizer.addEventListener('pointerdown', (event) => {
        terminalResizing = true;
        resizer.setPointerCapture(event.pointerId);
      });

      resizer.addEventListener('pointermove', (event) => {
        if (!terminalResizing) return;
        const width = Math.min(window.innerWidth - 24, Math.max(360, window.innerWidth - event.clientX));
        terminalDrawerWidth = width;
        localStorage.setItem('hubkit-terminal-width', String(width));
        drawer.style.setProperty('--terminal-width', `${width}px`);
        fitWebTerminal();
      });

      resizer.addEventListener('pointerup', (event) => {
        terminalResizing = false;
        resizer.releasePointerCapture(event.pointerId);
        fitWebTerminal();
      });
    }

    function renderDashboard() {
      updateSummary();
      renderDashboardGroups();
    }

    function renderDashboardError() {

          </div>
        </div>
      `;
    }

    function renderDiagnostics() {
      const container = document.getElementById('diagnosticsContent');
      if (!container) return;

      const reports = [...moduleAuditReports].sort((a, b) => a.score - b.score || a.moduleName.localeCompare(b.moduleName, 'zh-CN'));
      const errorCount = reports.filter((report) => report.findings.some((item) => item.severity === 'error')).length;
      const warnCount = reports.filter((report) => !report.findings.some((item) => item.severity === 'error') && report.findings.some((item) => item.severity === 'warn')).length;
      const healthyCount = reports.length - errorCount - warnCount;
      const missingCommandCount = reports.filter((report) => (report.environment?.missingCommands || []).length > 0).length;
      const missingEnvCount = reports.filter((report) => (report.environment?.missingEnvVars || []).length > 0).length;

      container.innerHTML = `
        <div class="section-heading">
          <div>
            <h2 class="settings-section-title" id="diagnosticsTitle">模块体检</h2>
            <p class="settings-section-desc">聚合路径、依赖、端口、健康检查和最近一次启动结果。</p>
          </div>
          <div class="dashboard-actions">
            <button class="btn btn-tonal" type="button" onclick="fetchModuleAudit(true)">
              ${icon('refresh')}
              <span>刷新体检</span>
            </button>
          </div>
        </div>

        <div class="summary-strip" aria-label="体检统计">
          <div class="summary-item glass-panel" data-summary-tone="all">
            <span class="summary-label">已检查</span>
            <span class="summary-value">${reports.length}</span>
            <span class="summary-note">模块总数</span>
          </div>
          <div class="summary-item glass-panel" data-summary-tone="running">
            <span class="summary-label">健康</span>
            <span class="summary-value">${healthyCount}</span>
            <span class="summary-note">未发现明显异常</span>
          </div>
          <div class="summary-item glass-panel" data-summary-tone="stopped">
            <span class="summary-label">告警</span>
            <span class="summary-value">${warnCount}</span>
            <span class="summary-note">建议排查</span>
          </div>
          <div class="summary-item glass-panel" data-summary-tone="update">
            <span class="summary-label">错误</span>
            <span class="summary-value">${errorCount}</span>
            <span class="summary-note">需要处理</span>
          </div>
        </div>

        <div class="summary-strip" aria-label="环境统计" style="margin-top: 14px;">
          <div class="summary-item glass-panel" data-summary-tone="all">
            <span class="summary-label">缺命令</span>
            <span class="summary-value">${missingCommandCount}</span>
            <span class="summary-note">运行时或包管理器未就绪</span>
          </div>
          <div class="summary-item glass-panel" data-summary-tone="stopped">
            <span class="summary-label">缺变量</span>
            <span class="summary-value">${missingEnvCount}</span>
            <span class="summary-note">来自 `.env.example` 等模板</span>
          </div>
        </div>

        <section class="toolbox-section">
          <div class="toolbox-grid">
            ${reports.length > 0 ? reports.map(createAuditCard).join('') : emptySettings('暂无体检结果')}
          </div>
        </section>
      `;
    }

    function renderDiagnosticsError() {
      const container = document.getElementById('diagnosticsContent');
      if (!container) return;
      container.innerHTML = `
        <div class="empty-state">
          <div>
            ${icon('error')}
            <div>无法加载模块体检结果。</div>
          </div>
        </div>
      `;
    }

    function createAuditCard(report) {
      const findings = Array.isArray(report.findings) ? report.findings : [];
      const module = modules.find((item) => item.id === report.moduleId);
      const topFindings = findings.slice(0, 4);
      const templateName = getStartPolicyTemplateName(report.inheritedTemplateId);
      const environment = report.environment || {};
      const envSummary = [
        environment.runtime ? `运行时 ${environment.runtime}` : '',
        environment.packageManager ? `包管理器 ${environment.packageManager}` : '',
        Array.isArray(environment.missingCommands) && environment.missingCommands.length > 0 ? `缺命令 ${environment.missingCommands.join('、')}` : '',
        Array.isArray(environment.missingEnvVars) && environment.missingEnvVars.length > 0 ? `缺变量 ${environment.missingEnvVars.join('、')}` : '',
      ].filter(Boolean).join(' · ');
      return `
        <article class="toolbox-card glass-panel">
          <div class="toolbox-card-header">
            <div class="toolbox-card-title">
              <h3>${escapeHtml(report.moduleName)}</h3>
              <p>${escapeHtml(report.moduleId)} · ${escapeHtml(report.groupId)} · 评分 ${escapeHtml(String(report.score))}</p>
            </div>
            <div class="state-badge ${report.findings.some((item) => item.severity === 'error') ? 'error' : report.findings.some((item) => item.severity === 'warn') ? 'starting' : 'running'}">
              <span class="state-dot"></span>
              <span>${escapeHtml(report.healthy ? '稳定' : '需处理')}</span>
            </div>
          </div>

          <div class="metric-grid">
            <div class="metric">
              <span class="metric-label">运行状态</span>
              <span class="metric-value">${escapeHtml(getStatusText(report.status))}</span>
            </div>
            <div class="metric">
              <span class="metric-label">启动阶段</span>
              <span class="metric-value">${escapeHtml(getRuntimePhaseText(report.runtimePhase))}</span>
            </div>
            <div class="metric">
              <span class="metric-label">策略模板</span>
              <span class="metric-value">${escapeHtml(templateName)}</span>
            </div>
            <div class="metric">
              <span class="metric-label">重试策略</span>
              <span class="metric-value">${escapeHtml(`${report.effectiveStartPolicy.retryCount} 次 / ${report.effectiveStartPolicy.retryDelayMs} ms`)}</span>
            </div>
            <div class="metric">
              <span class="metric-label">环境要求</span>
              <span class="metric-value">${escapeHtml(envSummary || '无额外要求')}</span>
            </div>
          </div>

          <div class="settings-list">
            ${topFindings.map((finding) => `
              <div class="settings-item">
                <div class="settings-item-info">
                  <span class="settings-item-name">${escapeHtml(getAuditSeverityText(finding.severity))} · ${escapeHtml(finding.summary)}</span>
                  <span class="settings-item-id">${escapeHtml(finding.details || finding.recommendation || '无附加说明')}</span>
                </div>
              </div>
            `).join('')}
          </div>

          <div class="inline-actions">
            <button class="btn btn-tonal btn-sm" type="button" onclick="checkModuleStatus('${jsString(report.moduleId)}')">${icon('refresh')}<span>检查状态</span></button>
            <button class="btn btn-text btn-sm" type="button" onclick="showLogs('${jsString(report.moduleId)}', '${jsString(report.moduleName)}')">${icon('article')}<span>查看日志</span></button>
            ${module?.webUrl ? `<button class="btn btn-text btn-sm" type="button" onclick="openModuleUrl('${jsString(report.moduleId)}', '${jsString(module.webUrl)}')">${icon('open_in_new')}<span>打开入口</span></button>` : ''}
          </div>
        </article>
      `;
    }

    function updateSummary() {
      const visibleModules = modules.filter(m => m.visible !== false);
      const running = visibleModules.filter(m => m.status === 'running').length;
      const stopped = visibleModules.filter(m => m.status !== 'running').length;
      const updateable = visibleModules.filter(m => m.updateable).length;
      document.getElementById('summaryTotal').textContent = visibleModules.length;
      document.getElementById('summaryRunning').textContent = running;
      document.getElementById('summaryStopped').textContent = stopped;
      document.getElementById('summaryUpdateable').textContent = updateable;

      const btn = document.getElementById('forceCloseAllBtn');
      if (btn) {
        btn.disabled = forceCloseAllLoading;
        btn.innerHTML = forceCloseAllLoading
          ? `${icon('progress_activity')}<span>清理中...</span>`
          : `${icon('stop_circle')}<span>全部关停</span>`;
      }
    }

    function renderDashboardGroups() {
      const content = document.getElementById('dashboardGroupContent');
      const rail = document.getElementById('dashboardGroupRail');
      if (!content || !rail) return;

      const sections = buildDashboardSections();
      if (sections.length === 0) {
        rail.innerHTML = '';
        content.innerHTML = `
          <div class="empty-state">
            <div>
              ${icon('visibility_off')}
              <div>没有可显示的卡片。</div>
            </div>
          </div>
        `;
        return;
      }

      rail.innerHTML = sections.map((section, index) => `
        <button class="group-rail-item ${index === 0 ? 'active' : ''}" type="button" data-group-rail="${escapeAttr(section.id)}" onclick="scrollToDashboardGroup('${jsString(section.id)}')">
          <span class="group-rail-kicker">${String(index + 1).padStart(2, '0')}</span>
          <span class="group-rail-label">${escapeHtml(section.name)}</span>
        </button>
      `).join('');

      content.innerHTML = `<div class="module-group-stack">${sections.map(createDashboardSection).join('')}</div>`;
      requestAnimationFrame(syncDashboardRailState);
    }

    function buildVisibleModuleGroups(visibleModules) {
      const groups = Array.isArray(settings.groups) && settings.groups.length > 0
        ? settings.groups
        : [{ id: 'default', name: '默认分组' }];
      const moduleGroups = settings.moduleGroups || {};

      const groupMap = new Map(groups.map((group) => [group.id, { ...group, modules: [] }]));
      if (!groupMap.has('default')) {
        groupMap.set('default', { id: 'default', name: '默认分组', modules: [] });
      }

      visibleModules.forEach((module) => {
        const groupId = module.groupId || moduleGroups[module.id] || 'default';
        const target = groupMap.get(groupId) || groupMap.get('default');
        target.modules.push(module);
      });

      return Array.from(groupMap.values()).filter((group) => group.modules.length > 0);
    }

    function createModuleGroupSection(group) {
      return `
        <section class="module-group">
          <div class="module-group-header">
            <div>
              <h3 class="module-group-title">${escapeHtml(group.name)}</h3>
            </div>
            <span class="module-group-meta">${group.modules.length} 张卡片</span>
          </div>
          <div class="modules-grid">
            ${group.modules.map(createModuleCard).join('')}
          </div>
        </section>
      `;
    }

    function buildDashboardSections() {
      const sections = [];
      const moduleSections = buildVisibleModuleGroups(modules.filter(m => m.visible !== false));
      sections.push(...moduleSections.map((group) => ({
        id: `group-${group.id}`,
        kind: 'module',
        name: group.name,
        icon: 'dashboard',
        accent: getDashboardGroupAccent(group.id, 'module'),
        kicker: '模块分组',
        items: group.modules,
      })));

      const bundle = scriptBundles[0];
      if (bundle && Array.isArray(bundle.groups)) {
        sections.push(...getScriptDashboardSections(bundle));
      }

      appendSystemActionSections(sections);

      return sections;
    }

    function appendSystemActionSections(sections) {
      if (!Array.isArray(systemActions) || systemActions.length === 0) return;

      systemActions.forEach((action) => {
        const targetSectionId = `script-${action.groupId}`;
        const section = sections.find((item) => item.id === targetSectionId);
        if (section) {
          section.items = [...section.items, action];
          section.kind = 'mixed';
          return;
        }

        sections.push({
          id: `system-action-${action.groupId}`,
          kind: 'system-action',
          name: action.groupId === 'system-tuning' ? '系统调优' : action.groupId,
          icon: action.groupId === 'system-tuning' ? 'tune' : 'dashboard',
          accent: getDashboardGroupAccent(action.groupId, 'script'),
          kicker: '原生调优',
          items: [action],
        });
      });
    }

    function getScriptDashboardSections(bundleArg) {
      const bundle = bundleArg || scriptBundles[0];
      if (!bundle || !Array.isArray(bundle.groups)) return [];
      return bundle.groups.map((group) => ({
        id: `script-${group.id}`,
        kind: 'script',
        name: group.title,
        icon: getScriptGroupIcon(group.id),
        accent: getDashboardGroupAccent(group.id, 'script'),
        kicker: '脚本工具箱',
        description: group.description || '',
        bundleId: bundle.id,
        items: group.actions || [],
      }));
    }

    function getScriptGroupIcon(groupId) {
      if (groupId === 'environment') return 'download';
      if (groupId === 'system-tuning') return 'tune';
      if (groupId === 'data-tools') return 'article';
      return 'dashboard';
    }

    function getDashboardGroupAccent(groupId, kind) {
      if (kind === 'script') {
        if (groupId === 'environment') return 'var(--md-primary)';
        if (groupId === 'system-tuning') return 'var(--md-warning)';
        if (groupId === 'data-tools') return 'var(--md-tertiary)';
      }
      if (groupId === 'default') return 'var(--md-primary)';
      return 'var(--md-secondary)';
    }

    function createDashboardSection(section) {
      const collapsed = isDashboardGroupCollapsed(section.id);
      return `
        <section class="module-group ${collapsed ? 'collapsed' : ''}" id="dashboard-section-${escapeAttr(section.id)}" data-dashboard-group="${escapeAttr(section.id)}" style="--group-accent: ${escapeAttr(section.accent || 'var(--md-primary)')}">
          <div class="module-group-header">
            <button class="group-toggle" type="button" onclick="toggleDashboardGroup('${jsString(section.id)}')" aria-label="折叠或展开 ${escapeAttr(section.name)}">
              ${icon('expand_more')}
              ${icon(section.icon || 'dashboard')}
              <div class="group-toggle-copy">
                <span class="group-toggle-kicker">${escapeHtml(section.kicker || '分组')}</span>
                <h3 class="module-group-title">${escapeHtml(section.name)}</h3>
              </div>
            </button>
            <span class="module-group-meta">${section.items.length} 张卡片</span>
          </div>
          <div class="modules-grid">
            ${renderSectionCards(section)}
          </div>
        </section>
      `;
    }

    function renderSectionCards(section) {
      if (section.kind === 'module') {
        return section.items.map(createModuleCard).join('');
      }
      return section.items.map((item) => {
        if (isSystemActionItem(item)) {
          return createSystemActionCard(item);
        }
        return createScriptActionCard(section.bundleId, section.name, item);
      }).join('');
    }

    function isSystemActionItem(item) {
      return item && typeof item.id === 'string' && item.id === 'boot-preference' && Object.prototype.hasOwnProperty.call(item, 'supported');
    }

    function scrollToDashboardGroup(sectionId) {
      const target = document.getElementById(`dashboard-section-${sectionId}`);
      if (!target) return;
      target.scrollIntoView({ behavior: 'smooth', block: 'start' });
      requestAnimationFrame(syncDashboardRailState);
    }

    function syncDashboardRailState() {
      const sections = [...document.querySelectorAll('[data-dashboard-group]')];
      const railItems = [...document.querySelectorAll('[data-group-rail]')];
      if (sections.length === 0 || railItems.length === 0) return;

      const anchor = sections.find((section) => section.getBoundingClientRect().top >= 84) || sections[sections.length - 1];
      railItems.forEach((item) => item.classList.toggle('active', item.dataset.groupRail === anchor.dataset.dashboardGroup));
    }

    function createScriptActionCard(bundleId, groupName, action) {
      const latestRun = action.latestRun || null;
      const startedAt = latestRun?.startedAt ? formatStartedAt(latestRun.startedAt) : '未执行';
      const isTerminalAction = action.executionMode === 'terminal';
      const modeLabel = isTerminalAction ? 'Web 终端' : '后台执行';
      const runButtonLabel = isTerminalAction ? 'Web 终端运行' : '后台运行';
      const loading = scriptRunLoading[`${bundleId}:${action.id}`] === true;
      const riskText = action.riskLevel === 'high' ? '高风险' : action.riskLevel === 'medium' ? '中风险' : '低风险';
      const description = action.description || `${groupName} 脚本动作`;
      const latestMessage = latestRun?.message || '等待执行';

      return `
        <article class="module-card script-card glass-panel" data-script-action-id="${escapeAttr(action.id)}">
          <div class="module-header">
            <div class="module-title">
              <h3>${escapeHtml(action.name)}</h3>
              <span class="module-id">${escapeHtml(groupName)}</span>
            </div>
            <span class="run-chip ${getRunChipClass(latestRun?.status)}">${escapeHtml(getRunStateLabel(latestRun))}</span>
          </div>

          <p class="module-description">${escapeHtml(description)}</p>

          <div class="script-card-meta">
            <span class="mode-chip">${escapeHtml(modeLabel)}</span>
            <span class="risk-chip ${escapeAttr(action.riskLevel || 'medium')}">${escapeHtml(riskText)}</span>
            <span class="run-chip">${escapeHtml(startedAt)}</span>
          </div>

          <div class="script-card-result">
            <span class="metric-label">最近结果</span>
            <span class="metric-value">${escapeHtml(latestMessage)}</span>
          </div>

          <div class="module-actions">
            <button class="btn btn-filled" type="button" ${loading ? 'disabled' : ''} onclick="runScriptAction('${jsString(bundleId)}', '${jsString(action.id)}')">
              ${loading ? `${icon('progress_activity')}<span>处理中...</span>` : `${icon('play_circle')}<span>${escapeHtml(runButtonLabel)}</span>`}
            </button>
            ${isTerminalAction ? `
              <button class="btn btn-outlined" type="button" ${loading ? 'disabled' : ''} onclick="runScriptActionInSystemTerminal('${jsString(bundleId)}', '${jsString(action.id)}')">
                ${icon('open_in_new')}
                <span>系统终端</span>
              </button>
            ` : ''}
            <button class="btn btn-text" type="button" onclick="showScriptLogs('${jsString(bundleId)}', '${jsString(action.id)}', '${jsString(action.name)}')">
              ${icon('article')}
              <span>日志</span>
            </button>
            <button class="btn btn-tonal" type="button" onclick="showScriptHistory('${jsString(bundleId)}', '${jsString(action.id)}', '${jsString(action.name)}')">
              ${icon('refresh')}
              <span>历史</span>
            </button>
          </div>
        </article>
      `;
    }

    function createSystemActionCard(action) {
      const latestRun = action.latestRun || null;
      const currentMode = action.currentModeLabel || '状态未知';
      const currentModeDescription = action.currentModeDescription || describeBootPreferenceMode(action.currentMode);
      const supportText = action.supported ? '已支持' : (action.disabledReason || '当前设备不支持');
      const latestMessage = latestRun?.message || '等待执行';
      const startedAt = latestRun?.startedAt ? formatStartedAt(latestRun.startedAt) : '未执行';
      const loading = systemActionLoading[action.id] === true;
      const refreshing = systemActionRefreshing[action.id] === true;
      const checkedAt = action.checkedAt ? formatStartedAt(action.checkedAt) : '未检查';
      const actionButtons = [
        { mode: 'default', label: '恢复默认', style: 'btn-tonal' },
        { mode: 'block_all', label: '全阻止', style: 'btn-filled' },
        { mode: 'block_lid', label: '仅阻止开盖', style: 'btn-outlined' },
        { mode: 'block_power', label: '仅阻止接电', style: 'btn-outlined' },
      ];

      return `
        <article class="module-card system-action-card glass-panel ${action.supported ? '' : 'error'}" data-system-action-id="${escapeAttr(action.id)}">
          <div class="module-header">
            <div class="module-title">
              <h3>${escapeHtml(action.name)}</h3>
              <span class="module-id">Apple Silicon + macOS 15+</span>
            </div>
            <span class="run-chip ${getRunChipClass(latestRun?.status)}">${escapeHtml(currentMode)}</span>
          </div>

          <p class="module-description">${escapeHtml(currentModeDescription)}</p>

          <div class="module-primary-row">
            <div class="module-primary-meta">
              <span class="module-kicker">当前状态</span>
              <span class="module-emphasis">${escapeHtml(currentMode)}</span>
            </div>
            <div class="module-primary-meta" style="text-align: right;">
              <span class="module-kicker">最近检查</span>
              <span class="module-emphasis">${escapeHtml(checkedAt)}</span>
            </div>
          </div>

          <div class="metric-grid">
            <div class="metric">
              <span class="metric-label">支持状态</span>
              <span class="metric-value">${escapeHtml(supportText)}</span>
            </div>
            <div class="metric">
              <span class="metric-label">最近执行</span>
              <span class="metric-value">${escapeHtml(startedAt)}</span>
            </div>
            <div class="metric">
              <span class="metric-label">最近结果</span>
              <span class="metric-value">${escapeHtml(latestMessage)}</span>
            </div>
          </div>

          <div class="module-actions">
            <button class="btn btn-text" type="button" ${refreshing ? 'disabled' : ''} onclick="refreshSystemActionStatus('${jsString(action.id)}', true)">
              ${refreshing ? `${icon('progress_activity')}<span>检查中...</span>` : `${icon('refresh')}<span>检查当前状态</span>`}
            </button>
            <button class="btn btn-text" type="button" onclick="showSystemActionLogs('${jsString(action.id)}', '${jsString(action.name)}')">
              ${icon('article')}
              <span>日志</span>
            </button>
            <button class="btn btn-tonal" type="button" onclick="showSystemActionHistory('${jsString(action.id)}', '${jsString(action.name)}')">
              ${icon('refresh')}
              <span>历史</span>
            </button>
          </div>

          <div class="system-action-preset-grid">
            ${actionButtons.map((item) => `
              <button
                class="btn ${item.style}"
                type="button"
                ${loading || refreshing || !action.supported ? 'disabled' : ''}
                onclick="applyBootPreferenceMode('${jsString(item.mode)}')"
              >
                ${loading ? `${icon('progress_activity')}<span>处理中...</span>` : `<span>${escapeHtml(item.label)}</span>`}
              </button>
            `).join('')}
          </div>
        </article>
      `;
    }

    function getRunChipClass(status) {
      if (status === 'succeeded') return 'success';
      if (status === 'failed') return 'error';
      if (status === 'running' || status === 'launched') return 'running';
      return '';
    }

    function getRunStateLabel(run) {
      if (!run) return '未执行';
      if (run.status === 'succeeded') return '最近成功';
      if (run.status === 'failed') return '最近失败';
      if (run.status === 'running') return '后台运行中';
      if (run.status === 'launched') return '已在终端打开';
      return '未执行';
    }

    function formatBootPreferenceMode(mode) {
      if (mode === 'default') return '当前允许自动启动';
      if (mode === 'block_all') return '已阻止开盖与接电启动';
      if (mode === 'block_lid') return '仅阻止开盖启动';
      if (mode === 'block_power') return '仅阻止接电启动';
      return '状态未知';
    }

    function describeBootPreferenceMode(mode) {
      if (mode === 'default') return '现在是默认状态，开盖和接入电源都可能触发自动启动。';
      if (mode === 'block_all') return '现在已同时阻止开盖启动和接电启动。';
      if (mode === 'block_lid') return '现在只阻止开盖启动，接入电源仍可能自动启动。';
      if (mode === 'block_power') return '现在只阻止接电启动，开盖仍可能自动启动。';
      return '当前读取失败，暂时无法确认真实状态。';
    }

    function findScriptAction(bundleId, actionId) {
      const bundle = scriptBundles.find((item) => item.id === bundleId);
      if (!bundle) return null;
      for (const group of bundle.groups || []) {
        const action = (group.actions || []).find((item) => item.id === actionId);
        if (action) {
          return { bundle, action };
        }
      }
      return null;
    }

    async function runScriptAction(bundleId, actionId) {
      const target = findScriptAction(bundleId, actionId);
      if (!target) {
        showToast('脚本动作不存在', 'error');
        return;
      }

      if (target.action.executionMode === 'terminal') {
        await runScriptActionInWebTerminal(bundleId, actionId, target.action.name);
        return;
      }

      const key = `${bundleId}:${actionId}`;
      if (scriptRunLoading[key]) return;
      scriptRunLoading[key] = true;
      renderDashboardGroups();

      try {
        const response = await fetch(`/api/script-bundles/${encodeURIComponent(bundleId)}/actions/${encodeURIComponent(actionId)}/run`, {
          method: 'POST',
        });
        const json = await response.json().catch(() => ({}));
        if (!response.ok || json.success === false) {
          throw new Error(json.error || '执行失败');
        }
        showToast(json.message || '脚本已启动');
        await fetchScriptBundles();
      } catch (error) {
        console.error('Failed to run script action:', error);
        showToast(error.message || '执行失败', 'error');
      } finally {
        delete scriptRunLoading[key];
        renderDashboardGroups();

    async function runScriptActionInWebTerminal(bundleId, actionId, actionName) {
      if (activeTerminalSessionId) {
        openTerminalPanel(activeTerminalAction?.actionName || 'Web 终端', `正在运行：${activeTerminalAction?.actionName || activeTerminalSessionId}`);
        terminalInstance?.focus();
        showToast('已有 Web 终端正在运行。请先停止当前会话，或使用系统终端并行运行。', 'error');
        return;
      }

      const key = `${bundleId}:${actionId}`;
      if (scriptRunLoading[key]) return;
      scriptRunLoading[key] = true;
      renderDashboardGroups();
      openTerminalPanel(actionName || actionId, '正在启动 Web 终端...');

      try {
        ensureWebTerminal();
        terminalSessionState = 'starting';
        terminalInstance.reset();
        terminalHasContent = true;
        terminalInstance.writeln(`[HubKit] 启动 ${actionName || actionId}...`);
        const dimensions = getTerminalDimensions();
        const response = await fetch(`/api/script-bundles/${encodeURIComponent(bundleId)}/actions/${encodeURIComponent(actionId)}/web-terminal`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(dimensions),
        });
        const json = await response.json().catch(() => ({}));
        if (!response.ok || json.success === false) {
          throw new Error(json.error || 'Web 终端启动失败');
        }

        const session = json.data?.session || {};
        activeTerminalSessionId = session.sessionId || null;
        activeTerminalAction = {
          bundleId: session.bundleId || bundleId,
          actionId: session.actionId || actionId,
          actionName: session.actionName || actionName,
        };
        document.getElementById('terminalTitle').textContent = activeTerminalAction.actionName || actionName || actionId;
        terminalSessionState = activeTerminalSessionId ? 'running' : 'idle';
        updateTerminalStatus(activeTerminalSessionId ? `会话 ${activeTerminalSessionId}` : 'Web 终端运行中');
        const runId = session.runId || json.data?.record?.runId || '';
        const initialLog = runId
          ? await fetchScriptLogs(activeTerminalAction.bundleId, activeTerminalAction.actionId, runId)
          : '';
        if (initialLog) {
          terminalInstance.reset();
          terminalHasContent = true;
          terminalInstance.write(initialLog);
        }
        sendTerminalResize();
        terminalInstance.focus();
        updateTerminalPeek();
        showToast(json.message || 'Web 终端已启动');
        await fetchScriptBundles();
      } catch (error) {
        console.error('Failed to run script action in web terminal:', error);
        updateTerminalStatus(error.message || 'Web 终端启动失败');
        showToast(error.message || 'Web 终端启动失败', 'error');
      } finally {
        delete scriptRunLoading[key];
        renderDashboardGroups();
      }
    }

    function createModuleCard(module) {

      const pid = module.pid || 'N/A';
      const description = module.description || getTypeText(module.type);
      const startedAt = module.startedAt ? formatStartedAt(module.startedAt) : '未知';
      const diagnostics = diagnosticsByModule[module.id] || null;
      const startReadiness = module.startReadiness || null;

        ? `已运行 ${uptime}`

        : startReadiness?.ready === false
          ? startReadiness.installCommand || '首次启动会先安装依赖'

          ? runtimeState.failure?.summary || runtimeState.summary || '启动失败'
        : isModuleBusy(module)
          ? runtimeState?.summary || '启动进行中'
        : startReadiness?.ready === false
          ? startReadiness.summary || '启动前需要准备依赖'

          ` : runtimeState?.health?.state === 'unhealthy' ? `
            <div class="tool-action-warning">${escapeHtml(runtimeState.health.details || runtimeState.health.summary || '健康检查未通过')}</div>

            <div class="module-primary-meta" style="text-align: right;">
              <span class="module-kicker">摘要</span>
              <span class="module-emphasis">${escapeHtml(primaryMeta)}</span>
            </div>
          </div>

          <div class="metric-grid">
            <div class="metric">
              <span class="metric-label">类型</span>
              <span class="metric-value">${escapeHtml(getTypeText(module.type))}</span>
            </div>
            <div class="metric">
              <span class="metric-label">进程</span>
              <span class="metric-value">${escapeHtml(pid)}</span>
            </div>
            <div class="metric">
              <span class="metric-label">启动时间</span>
              <span class="metric-value" title="${escapeAttr(startedAt)}">${escapeHtml(startedAt)}</span>
            </div>
            <div class="metric">

    function buildActionButtons(module) {
      const id = jsString(module.id);
      const name = jsString(module.name);
      const runtimeState = module.runtimeState || null;
      const startLabel = module.startReadiness?.actionLabel || '启动';
      const loadingAction = moduleActionLoading[module.id] || '';
      const busy = isModuleBusy(module) || Boolean(loadingAction);
      const busyLabel = runtimeState?.summary || (loadingAction === 'stop' ? '停止中...' : '处理中...');
      const controls = module.status === 'running'
        ? `
          <button class="btn btn-error" type="button" ${busy ? 'disabled' : ''} onclick="stopModule('${id}')">${loadingAction === 'stop' ? `${icon('progress_activity')}<span>停止中...</span>` : `${icon('stop_circle')}<span>停止</span>`}</button>
          <button class="btn btn-tonal" type="button" ${busy ? 'disabled' : ''} onclick="restartModule('${id}')">${loadingAction === 'restart' ? `${icon('progress_activity')}<span>重启中...</span>` : `${icon('restart_alt')}<span>重启</span>`}</button>
        `
        : `<button class="btn btn-filled" type="button" ${busy ? 'disabled' : ''} onclick="startModule('${id}')">${busy ? `${icon('progress_activity')}<span>${escapeHtml(busyLabel)}</span>` : `${icon('play_circle')}<span>${escapeHtml(startLabel)}</span>`}</button>`;

        ? `<button class="btn btn-tertiary" type="button" onclick="openModuleUrl('${id}', '${jsString(module.webUrl)}')">${icon('open_in_new')}<span>打开</span></button>`

      const updateButton = module.updateable
        ? `<button class="btn btn-outlined" id="update-btn-${escapeAttr(module.id)}" type="button" onclick="checkAndUpdate('${id}')">${icon('system_update_alt')}<span>检查更新</span></button>`

      return `

        ${openButton}

        ${updateButton}
      `;
    }

    function buildProcessMiniCard(module, diagnostics) {
      const id = jsString(module.id);
      const loading = diagnosticsLoadingByModule[module.id] === true;
      const forcing = forceCloseLoadingByModule[module.id] === true;
      const collapsed = uiPrefs.collapseProcessMini === true;
      const checkedAt = diagnostics?.checkedAt ? formatStartedAt(diagnostics.checkedAt) : '未检查';
      const pidStatus = diagnostics?.pidFromStatus ?? module.pid ?? null;
      const pidFile = diagnostics?.pidFromPidFile ?? null;
      const portValue = diagnostics?.port ?? parsePort(module.webUrl) ?? null;
      const portText = portValue ? String(portValue) : '未配置';
      const portOccupied = diagnostics?.portOccupied === true;
      const listenerText = formatListenerSummary(diagnostics?.portListeners || []);
      const pidCandidatesText = formatPidCandidatesSummary(diagnostics?.pidCandidates || []);
      const runBadge = module.status === 'running' ? '运行中' : '已停止';
      const runBadgeClass = module.status === 'running' ? 'running' : 'error';
      const portBadgeClass = portValue ? (portOccupied ? 'warn' : 'running') : '';
      const portBadgeText = portValue ? (portOccupied ? '端口占用' : '端口空闲') : '无端口';

      return `
        <section class="process-mini glass-panel ${collapsed ? 'collapsed' : ''}">
          <div class="process-mini-head">
            <span class="process-mini-title">进程检查</span>
            <span class="process-mini-time">${escapeHtml(checkedAt)}</span>
          </div>
          <div class="process-badges">
            <span class="proc-badge ${runBadgeClass}">${escapeHtml(runBadge)}</span>
            <span class="proc-badge ${portBadgeClass}">${escapeHtml(portBadgeText)}</span>
          </div>
          <div class="process-kv">
            <div class="process-kv-row">
              <span class="process-kv-key">PID：</span>
              <span class="process-kv-value">${escapeHtml(pidStatus ? String(pidStatus) : '无')} / 文件 ${escapeHtml(pidFile ? String(pidFile) : '无')}</span>
            </div>
            <div class="process-kv-row">
              <span class="process-kv-key">端口：</span>
              <span class="process-kv-value">${escapeHtml(portText)}</span>
            </div>
            <div class="process-kv-row">
              <span class="process-kv-key">占用进程：</span>
              <span class="process-kv-value">${escapeHtml(listenerText)}</span>
            </div>
            <div class="process-kv-row">
              <span class="process-kv-key">候选进程：</span>
              <span class="process-kv-value">${escapeHtml(pidCandidatesText)}</span>
            </div>
          </div>
          <div class="process-mini-actions">
            <button
              class="btn btn-outlined btn-sm"
              type="button"
              ${loading || forcing ? 'disabled' : ''}
              onclick="checkModuleDiagnostics('${id}')"
            >${loading ? `${icon('progress_activity')}<span>检查中...</span>` : `${icon('refresh')}<span>检查状态</span>`}</button>
            <button
              class="btn btn-error btn-sm"
              type="button"
              ${forcing || loading ? 'disabled' : ''}
              onclick="forceCloseModule('${id}')"
            >${forcing ? `${icon('progress_activity')}<span>处理中...</span>` : `${icon('stop_circle')}<span>强制关闭</span>`}</button>
          </div>
        </section>
      `;
    }

    function parsePort(urlValue) {
      if (!urlValue) return null;
      try {
        const parsed = new URL(urlValue);
        if (parsed.port) return Number(parsed.port);
        if (parsed.protocol === 'http:') return 80;
        if (parsed.protocol === 'https:') return 443;
      } catch (error) {
        return null;
      }
      return null;
    }

    function trimCommand(command) {
      if (!command) return 'unknown';
      if (command.length <= 42) return command;
      return `${command.slice(0, 39)}...`;
    }

    function formatListenerSummary(listeners) {
      if (!listeners || listeners.length === 0) return '无';
      return listeners
        .slice(0, 2)
        .map((item) => `${item.pid}(${trimCommand(item.command)}${item.alive ? '' : ',dead'})`)
        .join('；');
    }

    function formatPidCandidatesSummary(candidates) {
      if (!candidates || candidates.length === 0) return '无';
      return candidates
        .slice(0, 3)
        .map((item) => `${item.pid}${item.alive ? '' : '(dead)'}`)
        .join('、');
    }

    function buildBasicDiagnostics(module) {
      const pid = module?.pid ?? null;
      const port = parsePort(module?.webUrl) ?? null;
      const alive = module?.status === 'running' && pid;
      return {
        pidFromStatus: pid,
        pidFromPidFile: null,
        pidCandidates: pid ? [{ pid, command: 'unknown', alive: Boolean(alive) }] : [],
        port,
        portOccupied: Boolean(module?.status === 'running' && port),
        portListeners: [],
        checkedAt: new Date().toISOString(),
      };
    }

    async function checkModuleDiagnostics(moduleId) {
      diagnosticsLoadingByModule[moduleId] = true;
      renderDashboard();
      try {
        const response = await fetch(`/api/modules/${encodeURIComponent(moduleId)}/diagnostics`);
        const isJson = String(response.headers.get('content-type') || '').includes('application/json');
        const json = isJson ? await response.json().catch(() => ({})) : {};

        if (response.status === 404) {
          const module = modules.find(item => item.id === moduleId);
          diagnosticsByModule[moduleId] = buildBasicDiagnostics(module);
          showToast('当前服务版本不支持进程诊断，已降级为基础检查。请重启 2281 服务更新后端。', 'error');
          return;
        }

        if (!response.ok || json.success === false) {
          throw new Error(json.error || `检查失败（HTTP ${response.status}）`);
        }
        diagnosticsByModule[moduleId] = json.data?.diagnostics || null;
        showToast('进程状态已更新');
      } catch (error) {
        console.error('Failed to fetch diagnostics:', error);
        showToast(error.message || '检查失败', 'error');
      } finally {
        diagnosticsLoadingByModule[moduleId] = false;
        renderDashboard();
      }
    }

    async function forceCloseModule(moduleId) {
      const module = modules.find(item => item.id === moduleId);
      const moduleName = module?.name || moduleId;
      const confirmText = `确认强制关闭 ${moduleName}？会尝试清理端口占用进程。`;
      if (!window.confirm(confirmText)) return;

      forceCloseLoadingByModule[moduleId] = true;
      renderDashboard();
      try {
        const response = await fetch(`/api/modules/${encodeURIComponent(moduleId)}/force-close`, { method: 'POST' });
        const json = await response.json().catch(() => ({}));
        if (!response.ok) {
          throw new Error(json.error || '强制关闭失败');
        }
        if (json.data?.after) {
          diagnosticsByModule[moduleId] = json.data.after;
        }
        if (json.success === false) {
          showToast(json.message || '强制关闭执行完成，但仍有残留进程', 'error');
        } else {
          showToast(json.message || '强制关闭成功');
        }
        fetchModules();
      } catch (error) {
        console.error('Failed to force close module:', error);
        showToast(error.message || '强制关闭失败', 'error');
      } finally {
        forceCloseLoadingByModule[moduleId] = false;
        renderDashboard();
      }
    }

    async function forceCloseAllModules() {
      if (forceCloseAllLoading) return;
      const runningCount = modules.filter(item => item.status === 'running').length;
      const confirmText = runningCount > 0
        ? `确认关停全部模块？当前运行中 ${runningCount} 个，将执行强制清理残留。`
        : '确认执行一次全量残留清理？当前无运行模块。';
      if (!window.confirm(confirmText)) return;

      forceCloseAllLoading = true;
      renderDashboard();
      try {
        const response = await fetch('/api/modules/force-close-all', { method: 'POST' });
        const json = await response.json().catch(() => ({}));
        if (!response.ok) {
          throw new Error(json.error || '全部关停失败');
        }

        const failedCount = Number(json?.data?.failedCount || 0);
        const total = Number(json?.data?.total || 0);
        if (failedCount > 0) {
          showToast(json.message || `全部关停已执行，但 ${failedCount}/${total} 仍有残留`, 'error');
        } else {
          showToast(json.message || `全部关停完成，已清理 ${total} 个模块`);
        }

        const results = Array.isArray(json?.data?.results) ? json.data.results : [];
        results.forEach((result) => {
          if (result?.moduleId && result?.after) {
            diagnosticsByModule[result.moduleId] = result.after;
          }
        });
        await fetchModules();
      } catch (error) {
        console.error('Failed to force close all modules:', error);
        showToast(error.message || '全部关停失败', 'error');
      } finally {
        forceCloseAllLoading = false;
        renderDashboard();
      }
    }

    async function checkAndUpdate(moduleId) {
      const btn = document.getElementById(`update-btn-${moduleId}`);
      setButtonBusy(btn, '检查中...');

      try {
        const res = await fetch(`/api/modules/${encodeURIComponent(moduleId)}/update-check`);
        const json = await res.json();
        resetUpdateButton(btn, moduleId);

        if (!json.success) {
          showToast(json.error || '检查失败', 'error');
          return;
        }

        if (json.hasUpdates) {
          btn.className = 'btn btn-warning';
          btn.innerHTML = `${icon('download')}<span>更新 ${json.commitsBehind || ''}</span>`;
          btn.onclick = () => performUpdate(moduleId);
          showToast(json.message || '发现可用更新');
        } else {
          showToast('已是最新版本');
        }
      } catch (error) {
        resetUpdateButton(btn, moduleId);
        showToast('检查失败', 'error');
      }
    }

    async function performUpdate(moduleId) {
      const btn = document.getElementById(`update-btn-${moduleId}`);
      setButtonBusy(btn, '更新中...');

      try {
        const res = await fetch(`/api/modules/${encodeURIComponent(moduleId)}/update`, { method: 'POST' });
        const json = await res.json();
        resetUpdateButton(btn, moduleId);

        if (json.success) {
          showToast(json.message || '更新完成');
          fetchModules();
        } else {
          showToast(json.error || '更新失败', 'error');
        }
      } catch (error) {
        resetUpdateButton(btn, moduleId);
        showToast('更新失败', 'error');
      }
    }

    function setButtonBusy(btn, label) {
      if (!btn) return;
      btn.disabled = true;
      btn.innerHTML = `${icon('progress_activity')}<span>${escapeHtml(label)}</span>`;

    function resetUpdateButton(btn, moduleId) {
      if (!btn) return;
      btn.disabled = false;
      btn.className = 'btn btn-outlined';
      btn.innerHTML = `${icon('system_update_alt')}<span>检查更新</span>`;
      btn.onclick = () => checkAndUpdate(moduleId);
    }

    function getStatusClass(status) {
      if (status === 'running') return 'running';
      if (status === 'error') return 'error';
      if (status === 'starting') return 'starting';
      if (status === 'stopping') return 'stopping';
      return 'stopped';
    }

    function getStatusText(status) {
      const statusMap = {
        running: '运行中',
        stopped: '已停止',
        starting: '启动中',
        stopping: '停止中',
        error: '错误',
        unknown: '未知',
      };
      return statusMap[status] || status || '未知';
    }

    function getEffectiveStatus(module) {
      const phase = module?.runtimeState?.phase;
      if (phase === 'failed') return 'error';
      if (phase === 'preparing' || phase === 'installing' || phase === 'starting' || phase === 'health_checking') {
        return 'starting';
      }
      if (phase === 'running') return 'running';
      if (phase === 'stopped') return 'stopped';
      return module?.status || 'unknown';
    }

    function isModuleBusy(module) {
      const phase = module?.runtimeState?.phase;
      return phase === 'preparing' || phase === 'installing' || phase === 'starting' || phase === 'health_checking';
    }

    function formatLastStartRecord(record) {
      if (!record) return '暂无记录';
      const duration = Number.isFinite(record.durationMs) ? `${Math.max(0, Math.round(record.durationMs))} ms` : '耗时未知';
      return record.outcome === 'succeeded'
        ? `${duration} · ${record.attemptCount} 次尝试`
        : `失败 · ${record.attemptCount} 次尝试`;
    }

    function getRuntimePhaseText(phase) {
      const phaseMap = {
        idle: '空闲',
        preparing: '准备中',
        installing: '安装依赖',
        starting: '启动中',
        health_checking: '健康检查',
        running: '运行中',
        stopped: '已停止',
        failed: '失败',
      };
      return phaseMap[phase] || phase || '未知';
    }

    function getAuditSeverityText(severity) {
      if (severity === 'error') return '错误';
      if (severity === 'warn') return '告警';
      return '提示';
    }

    function getTypeText(type) {
      const typeMap = {
        nodejs: 'Node.js',
        python: 'Python',
        shell: 'Shell',
      };
      return typeMap[type] || type || 'N/A';
    }

    function formatUptime(seconds) {
      if (!seconds || seconds < 0) return 'N/A';
      const days = Math.floor(seconds / 86400);
      const hours = Math.floor((seconds % 86400) / 3600);
      const minutes = Math.floor((seconds % 3600) / 60);
      if (days > 0) return `${days}天 ${hours}小时`;
      if (hours > 0) return `${hours}小时 ${minutes}分钟`;
      return `${minutes}分钟`;
    }

    function formatStartedAt(value) {
      const date = new Date(value);
      if (Number.isNaN(date.getTime())) return '未知';
      const y = date.getFullYear();
      const m = String(date.getMonth() + 1).padStart(2, '0');
      const d = String(date.getDate()).padStart(2, '0');
      const hh = String(date.getHours()).padStart(2, '0');
      const mm = String(date.getMinutes()).padStart(2, '0');
      return `${y}-${m}-${d} ${hh}:${mm}`;
    }

    function getModuleStartPolicySettings(module) {
      const stored = settings.startPolicies?.[module.id] || {};
      const fromModule = module.startPolicy || {};
      return {
        ...defaultStartPolicy,
        ...fromModule,
        ...stored,
      };

    function getStartPolicyTemplateName(templateId) {
      const found = startPolicyTemplates.find((template) => template.id === templateId);
      return found?.name || '平衡型';
    }

    function updateStartPolicyBoolean(moduleId, key, value) {
      const current = {
        ...getModuleStartPolicySettings({ id: moduleId }),
      };
      settings.startPolicies = settings.startPolicies || {};
      settings.startPolicies[moduleId] = {
        ...current,
        [key]: value === true,
      };
    }

    function updateStartPolicyNumber(moduleId, key, value) {
      const normalized = Number(value);
      if (!Number.isFinite(normalized)) return;
      const current = {
        ...getModuleStartPolicySettings({ id: moduleId }),
      };
      settings.startPolicies = settings.startPolicies || {};
      settings.startPolicies[moduleId] = {
        ...current,
        [key]: Math.round(normalized),
      };
    }

    function resetModuleStartPolicy(moduleId) {
      if (!settings.startPolicies) return;
      delete settings.startPolicies[moduleId];
      renderSettings();
    }

    function updateGroupStartPolicyTemplate(groupId, templateId) {
      settings.groupStartPolicyTemplates = settings.groupStartPolicyTemplates || {};
      settings.groupStartPolicyTemplates[groupId] = templateId || 'balanced';
      renderSettings();
    }

    async function saveModuleUrl(moduleId) {
      const input = document.getElementById(`url-${moduleId}`);
      if (!input) return;
      const url = input.value.trim();
      if (!url) {
        showToast('请输入有效的 URL', 'error');
        return;
      }

      try {
        const res = await fetch(`/api/modules/${encodeURIComponent(moduleId)}/web-url`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ url }),
        });
        const json = await res.json();
        if (json.success) {
          showToast('Web 地址已保存');
          const module = modules.find(m => m.id === moduleId);
          if (module) module.webUrl = url;
          renderDashboard();
        } else {
          showToast(json.error || '保存失败', 'error');
        }
      } catch (error) {
        showToast('保存失败', 'error');
      }
    }

    async function setModuleVisibility(moduleId, visible) {
      try {
        const res = await fetch(`/api/modules/${encodeURIComponent(moduleId)}/visibility`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ visible }),
        });
        const json = await res.json();
        if (!json.success) throw new Error(json.error || '保存失败');
        const module = modules.find(m => m.id === moduleId);
        if (module) module.visible = visible;
        showToast('显示状态已更新');
        renderDashboard();
      } catch (error) {
        showToast(error.message || '保存失败', 'error');
        fetchModules();
      }
    }

    async function saveSchedule(moduleId) {
      const enabled = document.getElementById(`schedule-enabled-${moduleId}`)?.checked === true;
      const startTime = document.getElementById(`schedule-start-${moduleId}`)?.value || '';
      const stopTime = document.getElementById(`schedule-stop-${moduleId}`)?.value || '';
      const daysOfWeek = [...document.querySelectorAll('input[name^="schedule-days-"]:checked')]
        .filter(input => input.name === `schedule-days-${moduleId}`)
        .map(input => Number(input.value));

      try {
        const res = await fetch(`/api/modules/${encodeURIComponent(moduleId)}/schedule`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ enabled, startTime, stopTime, daysOfWeek }),
        });
        const json = await res.json();
        if (!json.success) throw new Error(json.error || '保存失败');
        settings.schedules[moduleId] = json.schedule;
        const module = modules.find(m => m.id === moduleId);
        if (module) module.schedule = json.schedule;
        showToast('定时任务已保存');
      } catch (error) {
        showToast(error.message || '保存失败', 'error');
      }
    }

    function getOrderedModules() {
      const order = settings.startOrder || [];
      return [...modules].sort((a, b) => {
        const ai = order.indexOf(a.id);
        const bi = order.indexOf(b.id);
        if (ai === -1 && bi === -1) return 0;
        if (ai === -1) return 1;
        if (bi === -1) return -1;
        return ai - bi;
      });
    }

    function ensureSettingsGroups() {

        settings.groups = [{ id: 'default', name: '默认分组' }];

      if (!settings.groups.find((group) => group.id === 'default')) {
        settings.groups.unshift({ id: 'default', name: '默认分组' });

      settings.moduleGroups = settings.moduleGroups || {};

      if (!target) return;
      target.name = String(name || '').trim() || '未命名分组';

    function removeDashboardGroup(groupId) {
      if (groupId === 'default') return;
      ensureSettingsGroups();
      settings.groups = settings.groups.filter((group) => group.id !== groupId);
      Object.keys(settings.moduleGroups).forEach((moduleId) => {
        if (settings.moduleGroups[moduleId] === groupId) {
          settings.moduleGroups[moduleId] = 'default';

      ensureSettingsGroups();

      if (module) module.groupId = settings.moduleGroups[moduleId];
      renderDashboard();
    }

    function toggleGroupModule(groupId, moduleId, enabled) {
      ensureSettingsGroups();
      const targetGroupId = enabled ? groupId : 'default';
      settings.moduleGroups[moduleId] = targetGroupId;
      const module = modules.find((item) => item.id === moduleId);
      if (module) module.groupId = targetGroupId;
      renderSettings();
      renderDashboard();

    function resetSettings() {

    function initDragAndDrop() {
      const list = document.getElementById('autoStartList');
      if (!list) return;

      const items = list.querySelectorAll('.settings-item[draggable="true"]');
      items.forEach((item, index) => {
        item.addEventListener('dragstart', (event) => {
          dragSrcIndex = index;
          item.classList.add('dragging');
          event.dataTransfer.effectAllowed = 'move';
        });

        item.addEventListener('dragend', () => {
          item.classList.remove('dragging');
          list.querySelectorAll('.settings-item').forEach(row => row.classList.remove('drag-over'));
        });

        item.addEventListener('dragover', (event) => {
          event.preventDefault();
          event.dataTransfer.dropEffect = 'move';
          item.classList.add('drag-over');
        });

        item.addEventListener('dragleave', () => item.classList.remove('drag-over'));

        item.addEventListener('drop', (event) => {
          event.preventDefault();
          item.classList.remove('drag-over');
          const dropIndex = index;
          if (dragSrcIndex === dropIndex) return;

          const ordered = getOrderedModules();
          const [moved] = ordered.splice(dragSrcIndex, 1);
          ordered.splice(dropIndex, 0, moved);
          settings.startOrder = ordered.map(module => module.id);
          renderSettings();
        });
      });
    }

    async function showLogs(moduleId, moduleName) {
      currentLogModuleId = moduleId;
      currentLogModuleName = moduleName;
      document.getElementById('logDialogTitle').textContent = moduleName;
      document.getElementById('logDialogSubtitle').textContent = '最近 200 行';
      document.getElementById('logFilter').value = '';
      document.getElementById('logLevelFilter').value = 'all';
      document.getElementById('logContent').textContent = '加载中...';
      document.getElementById('logDialog').classList.add('active');
      await refreshLogs();
      toggleLogTail();
    }

    function closeLogDialog() {
      document.getElementById('logDialog').classList.remove('active');
      currentLogModuleId = null;
      currentLogTarget = null;
      clearInterval(logTailTimer);
      logTailTimer = null;
    }

    async function refreshLogs() {
      if (!currentLogModuleId && !currentLogTarget) return;
      const content = document.getElementById('logContent');
      const rawLogs = currentLogTarget?.kind === 'script'
        ? await fetchScriptLogs(currentLogTarget.bundleId, currentLogTarget.actionId)
        : currentLogTarget?.kind === 'system-action'
          ? await fetchSystemActionLogs(currentLogTarget.actionId)
        : await fetchLogs(currentLogModuleId);
      content.innerHTML = renderLogLines(rawLogs || '暂无日志');
      applyLogFilter();
      if (document.getElementById('logTailToggle').checked) {
        scrollLogsBottom();
      }
    }

    function renderLogLines(rawLogs) {
      return String(rawLogs).split('\n').map(line => {
        const lower = line.toLowerCase();
        let level = 'info';
        let cls = 'log-line log-line-info';
        if (lower.includes('error') || lower.includes('failed') || lower.includes('exception')) {
          level = 'error';
          cls = 'log-line log-line-error';
        } else if (lower.includes('warn')) {
          level = 'warn';
          cls = 'log-line log-line-warn';
        } else if (/^\s+at\s/.test(line)) {
          level = 'stack';
          cls = 'log-line log-line-stack';
        }
        return `<span class="${cls}" data-level="${level}">${escapeHtml(line || ' ')}</span>`;
      }).join('');
    }

    function applyLogFilter() {
      const term = document.getElementById('logFilter').value.trim().toLowerCase();
      const level = document.getElementById('logLevelFilter').value;
      const lines = document.querySelectorAll('#logContent .log-line');
      lines.forEach(line => {
        const textMatch = !term || line.textContent.toLowerCase().includes(term);
        const lineLevel = line.dataset.level;
        const levelMatch = level === 'all' || lineLevel === level || (level === 'info' && lineLevel === 'stack');
        line.classList.toggle('log-line-hidden', !(textMatch && levelMatch));
      });
    }

    function toggleLogTail() {
      clearInterval(logTailTimer);
      logTailTimer = null;
      if ((currentLogModuleId || currentLogTarget) && document.getElementById('logTailToggle').checked) {
        logTailTimer = setInterval(refreshLogs, 5000);
      }
    }

    function scrollLogsBottom() {
      const body = document.getElementById('logBody');
      body.scrollTop = body.scrollHeight;
    }

    function hideToast() {
      const snackbar = document.getElementById('snackbar');
      snackbar.classList.remove('show');
    }

    function pauseToastTimer() {
      const snackbar = document.getElementById('snackbar');
      clearTimeout(snackbar.hideTimer);
    }

    function resumeToastTimer() {
      const snackbar = document.getElementById('snackbar');
      if (!snackbar.classList.contains('show')) return;
      clearTimeout(snackbar.hideTimer);
      snackbar.hideTimer = setTimeout(() => {
        hideToast();
      }, 3000);
    }

    async function copyToastMessage() {
      const text = String(lastToastMessage || '').trim();
      if (!text) return;
      try {
        if (navigator.clipboard && typeof navigator.clipboard.writeText === 'function') {
          await navigator.clipboard.writeText(text);
        } else {
          const textArea = document.createElement('textarea');
          textArea.value = text;
          textArea.setAttribute('readonly', 'true');
          textArea.style.position = 'fixed';
          textArea.style.left = '-9999px';
          document.body.appendChild(textArea);
          textArea.select();
          document.execCommand('copy');
          textArea.remove();
        }
        showToast('提示内容已复制');
      } catch {
        showToast('复制失败，请手动选中文本复制', 'error');
      }
    }

    function showToast(message, type = 'success') {
      const snackbar = document.getElementById('snackbar');
      const messageEl = document.getElementById('snackbarMessage');
      lastToastMessage = String(message || '');
      snackbar.className = `snackbar ${type}`;
      messageEl.textContent = lastToastMessage;
      snackbar.classList.add('show');
      clearTimeout(snackbar.hideTimer);
      const baseDuration = type === 'error' ? 9000 : 5200;
      const longTextExtra = lastToastMessage.length > 80 ? 4000 : 0;
      snackbar.hideTimer = setTimeout(() => {
        hideToast();
      }, baseDuration + longTextExtra);
    }

    document.getElementById('logDialog').addEventListener('click', (event) => {
      if (event.target.id === 'logDialog') closeLogDialog();
    });

    document.getElementById('snackbar').addEventListener('mouseenter', pauseToastTimer);
    document.getElementById('snackbar').addEventListener('mouseleave', resumeToastTimer);
    window.addEventListener('scroll', syncDashboardRailState, { passive: true });
    window.addEventListener('resize', fitWebTerminal, { passive: true });

    document.addEventListener('keydown', (event) => {
      if (event.key === 'Escape') closeLogDialog();
    });

    if (typeof systemThemeQuery.addEventListener === 'function') {
      systemThemeQuery.addEventListener('change', () => {
        if (themeMode === 'auto') applyTheme('auto', false);
      });
    } else if (typeof systemThemeQuery.addListener === 'function') {
      systemThemeQuery.addListener(() => {
        if (themeMode === 'auto') applyTheme('auto', false);
      });
    }

    applyTheme(themeMode, false);
    applyGlassPrefs();
    applyWallpaper();
    setupTerminalResizeHandle();
    connectWebSocket();
    fetchModules();
    fetchModuleAudit();
    fetchStartPolicyTemplates();
    fetchScriptBundles();
    fetchSystemActions();
    fetchSettings();
    setInterval(fetchModules, 5000);
    setInterval(() => {
      if (currentView === 'diagnostics') fetchModuleAudit();
    }, 10000);
    setInterval(fetchScriptBundles, 10000);
    setInterval(fetchSystemActions, 10000);
  </script>
</body>
</html>
