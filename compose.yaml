name: hubkit

services:
  hubkit:
    build: .
    image: hubkit/control:local
    container_name: hubkit
    environment:
      HUBKIT_UPSTREAM: host.docker.internal:2282
    ports:
      - "127.0.0.1:${HUBKIT_PORT:-2281}:2281"
    restart: unless-stopped
    init: true
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
