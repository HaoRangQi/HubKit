<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>zsh Config Center</title>
    <link rel="stylesheet" href="/styles.css">
  </head>
  <body>
    <div class="app-shell">
      <aside class="sidebar">
        <div class="brand">
          <span class="brand-mark">Z</span>
          <div>
            <h1>zsh Config</h1>
            <p>本地配置中心</p>
          </div>
        </div>
        <nav class="nav" id="nav"></nav>
        <div class="sidebar-footer">
          <button class="secondary full" id="bootstrapBtn">启用自动加载</button>
          <button class="primary full" id="saveBtn">保存</button>
        </div>
      </aside>

      <main class="workspace">
        <header class="topbar">
          <div>
            <h2 id="pageTitle">概览</h2>
            <p id="pageSubtitle">扫描现有配置，安全管理托管层。</p>
          </div>
          <div class="topbar-actions">
            <button class="secondary" id="reloadBtn">重新扫描</button>
            <button class="secondary" id="validateBtn">保存前预览</button>
          </div>
        </header>

        <section class="notice" id="notice" hidden></section>
        <section id="content" class="content"></section>
      </main>
    </div>

    <dialog id="diffDialog">
      <form method="dialog" class="dialog">
        <header>
          <h3>保存前确认</h3>
          <button value="cancel" class="icon-button" aria-label="关闭">×</button>
        </header>
        <div class="save-summary" id="saveSummary"></div>
        <details class="tech-details">
          <summary>查看生成文件变化</summary>
          <pre id="diffOutput"></pre>
        </details>
        <footer>
          <button value="cancel" class="secondary">关闭</button>
          <button id="confirmSaveBtn" value="default" class="primary">确认保存</button>
        </footer>
      </form>
    </dialog>

    <script type="module" src="/app.js"></script>
  </body>
</html>
